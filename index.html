/* ---- 平面圖上的圖層（SVG：座標寬 1000，高依平面圖比例） ---- */
function lyPts(pts, VH){ return pts.map(q=>(q[0]*1000).toFixed(1)+','+(q[1]*VH).toFixed(1)).join(' '); }
function lyOverlay(m){
  const VH = lyVH(m), L = MV.layer, sel = MV.sel, ed = MV.mode==='edit', isSel = (t,id) => sel && sel.t===t && sel.id===id;
  let defs = '', body = '', html = '', zbody = '';
  if(L==='zone' || (MV_ZBG && L!=='defect')){
    lyList('zone').forEach(z => { zbody += `<polygon data-lo="zone:${z.id}" class="lz ${L!=='zone'?'bg':''} ${isSel('zone',z.id)?'sel':''}" points="${lyPts(z.pts, VH)}" style="--c:${lyColor(z.kind)}"/>`; });
    if(L==='zone') lyList('zone').forEach(z => { const b = lyLabPt(z.pts); html += `<span class="mplab lzlab" style="left:${b.x*100}%;top:${b.y*100}%;--c:${lyColor(z.kind)}">${esc(ZK[z.kind]?ZK[z.kind].t:'')}${z.name?'｜'+esc(z.name):''}</span>`; });
  }
  if(L==='flow'){
    lyList('mark').filter(o=>!MV_HIDE.has(o.kind)).forEach(o => { body += `<g data-lo="mark:${o.id}" class="lm ${isSel('mark',o.id)?'sel':''}"><polyline class="hit" points="${lyPts(o.pts, VH)}"/><polyline class="ln" points="${lyPts(o.pts, VH)}" style="stroke:${lyColor(o.kind)}"/></g>`; });
    const used = new Set();
    lyList('flow').filter(o=>!MV_HIDE.has(o.kind) && FK[o.kind]).forEach(o => { const k = o.kind, v = FK[k], c = lyColor(k); used.add(k);
      const p0 = o.pts[0];
      body += `<g data-lo="flow:${o.id}" class="lf ${isSel('flow',o.id)?'sel':''}"><polyline class="hit" points="${lyPts(o.pts, VH)}"/><polyline class="ln ${v.dash||''}" points="${lyPts(o.pts, VH)}" style="stroke:${c}" marker-end="url(#lyah-${k})"/>${v.tag?`<text class="ltag" x="${(p0[0]*1000+7).toFixed(1)}" y="${(p0[1]*VH-7).toFixed(1)}" style="fill:${c}">${v.tag}</text>`:''}</g>`; });
    used.forEach(k => { defs += `<marker id="lyah-${k}" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto"><path d="M0,0L10,5L0,10z" fill="${lyColor(k)}"/></marker>`; });
  }
  if(MV.poly && MV.poly.pts.length && (MV.tool==='zpoly'||MV.tool==='fline')){ body += `<polyline class="lytmp" points="${lyPts(MV.poly.pts, VH)}"/>`; html += MV.poly.pts.map((q,i)=>`<i class="mdot ${i===0?'first':''}" style="left:${q[0]*100}%;top:${q[1]*100}%"></i>`).join(''); }
  if(MV.tmp) body += `<polyline class="lm-tmp" points="${lyPts(MV.tmp, VH)}" style="stroke:${lyColor(MV.fk)}"/>`;
  if(L==='pest') lyList('pest').forEach(o => { html += `<div class="mpest ${isSel('pest',o.id)?'sel':''}" data-lo="pest:${o.id}" style="left:${o.x*100}%;top:${o.y*100}%" title="${esc(pestLabel(o))}${o.note?'｜'+esc(o.note):''}"><img src="${pestIconOf(o)}" alt="${esc(pestKindName(o))}" draggable="false"><b>${esc(o.code||'')}</b></div>`; });
  if(L==='frag') lyList('frag').forEach(f => { const st = fragState(f), u = fragIcon(fragType(f));
    html += u ? `<div class="mfrag fi fs-${st.k} ${isSel('frag',f.id)?'sel':''}" data-lo="frag:${f.id}" style="left:${f.x*100}%;top:${f.y*100}%" title="${esc(fragLabel(f))}｜${esc(st.t)}"><img src="${u}" alt="" draggable="false"><b>${esc(f.code||'')}</b></div>`
      : `<div class="mfrag fs-${st.k} ${isSel('frag',f.id)?'sel':''}" data-lo="frag:${f.id}" style="left:${f.x*100}%;top:${f.y*100}%" title="${esc(fragLabel(f))}｜${esc(st.t)}">◆ ${esc(f.code||'')}</div>`; });
  /* 選取中的分區／動線：拖角、加角 */
  const o = lyCur();
  if(ed && o && o.pts && !MV.tool && !(sel.t==='zone' && MV_LOCK)){
    const P = o.pts, closed = sel.t==='zone';
    if(sel.t!=='mark') P.forEach((q,i) => { if(!closed && i===P.length-1) return; const r = P[(i+1)%P.length]; html += `<i class="mmid" data-lmid="${i}" title="拖曳可多加一個${closed?'角':'轉彎點'}" style="left:${(q[0]+r[0])*50}%;top:${(q[1]+r[1])*50}%">+</i>`; });
    P.forEach((q,i) => { html += `<i class="mvtx" data-lvtx="${i}" title="拖曳調整；連點兩下刪除" style="left:${q[0]*100}%;top:${q[1]*100}%"></i>`; });
  }
  /* 分區自己一層；「文字在顏色上」開著時用相乘疊色：白底變分區顏色，底稿的黑字、線條留在上面（底稿本身不加工，字不會糊） */
  return `${zbody?`<svg class="lysvg lyzs ${lyZoneMul()?'mul':''}" viewBox="0 0 1000 ${VH.toFixed(1)}" preserveAspectRatio="none">${zbody}</svg>`:''}<svg class="lysvg" viewBox="0 0 1000 ${VH.toFixed(1)}" preserveAspectRatio="none"><defs>${defs}</defs>${body}</svg>${html}`;
}
function lyRedraw(){ const ov = $('#lyOv'), m = lyMap(); if(ov && m) ov.innerHTML = lyOverlay(m); const c = $('#lyCnt'); if(c) c.textContent = MV.poly ? MV.poly.pts.length : 0; }
function lySide(){ const s = $('#mSide'); if(s){ s.innerHTML = layerSideHTML(); hydrate(s); if(MV.sel && MV.mode==='view' && window.innerWidth<900 && !NO_SIDE_SCROLL) s.scrollIntoView({behavior:'smooth', block:'start'}); } lyRedraw(); }

/* ---- 平面圖上的操作：畫分區、畫箭頭、畫標記、放易碎品、拖曳移動、改角 ---- */
function layerBind(){
  const inner = $('#mapInner'), view = $('#mapView'); if(!inner) return;
  const frac = e => { const b = inner.getBoundingClientRect(); return { x:clamp01((e.clientX-b.left)/b.width), y:clamp01((e.clientY-b.top)/b.height) }; };
  const objOf = el => { const s = el && el.closest && el.closest('[data-lo]'); if(!s) return null; const [t,id] = s.dataset.lo.split(':'); const o = lyGet(t,id); return o ? {t, o} : null; };
  let drag = null;
  inner.onpointerdown = e => {
    if(e.button!==0) return;
    const p = frac(e), hit = objOf(e.target), ed = MV.mode==='edit', o = lyCur(), T = MV.tool;
    if(T==='zpoly' || T==='fline') drag = {k:'click'};
    else if(T==='zrect') drag = {k:'draw'};
    else if(T==='mark') drag = {k:'mark'};
    else if(T==='frag') drag = {k:'place'};
    else if(T==='pest') drag = {k:'pest'};
    else if(ed && o && e.target.dataset.lmid!==undefined){ const i = +e.target.dataset.lmid + 1; o.pts.splice(i, 0, [p.x, p.y]); drag = {k:'vtx', o, i, added:true}; lyRedraw(); }
    else if(ed && o && e.target.dataset.lvtx!==undefined) drag = {k:'vtx', o, i:+e.target.dataset.lvtx};
    else if(ed && hit && !(hit.t==='zone' && MV_LOCK)) drag = {k:'mv', h:hit, o: hit.t==='frag'||hit.t==='pest' ? {x:hit.o.x, y:hit.o.y} : hit.o.pts.map(q=>q.slice())};
    else drag = {k:'pan', cx:e.clientX, cy:e.clientY, sl:view.scrollLeft, st:view.scrollTop, hit};
    if(T==='zrect' || T==='mark'){ const q = mapSnap(p, e); drag.s = {x:q.x, y:q.y}; } else drag.s = p;
    drag.moved = false; inner.setPointerCapture(e.pointerId); e.preventDefault();
  };
  inner.onpointerleave = () => snapShow(null);
  inner.onpointermove = e => {
    if(!drag){ if(SNAP_TOOLS.includes(MV.tool)) snapShow(mapSnap(frac(e), e)); return; }
    if(drag.k==='pan'){ const dx = e.clientX-drag.cx, dy = e.clientY-drag.cy; if(Math.abs(dx)+Math.abs(dy)>4) drag.moved = true; view.scrollLeft = drag.sl-dx; view.scrollTop = drag.st-dy; return; }
    let p = frac(e);
    if(drag.k==='draw' || drag.k==='mark' || drag.k==='vtx'){ p = mapSnap(p, e, drag.k==='vtx' ? {o:drag.o, i:drag.i} : null); if(drag.k==='mark') p = lyStraight([drag.s.x, drag.s.y], p, e); snapShow(p); }
    const dx = p.x-drag.s.x, dy = p.y-drag.s.y; if(Math.abs(dx)+Math.abs(dy)>0.005) drag.moved = true;
    if(!drag.moved) return;
    if(drag.k==='draw'){ const d = $('#mDraw'); d.hidden = false; Object.assign(d.style,{left:Math.min(p.x,drag.s.x)*100+'%',top:Math.min(p.y,drag.s.y)*100+'%',width:Math.abs(dx)*100+'%',height:Math.abs(dy)*100+'%'}); }
    if(drag.k==='mark'){ MV.tmp = [[drag.s.x,drag.s.y],[p.x,p.y]]; lyRedraw(); }
    if(drag.k==='vtx'){ drag.o.pts[drag.i] = [p.x, p.y]; lyRedraw(); }
    if(drag.k==='mv'){ const h = drag.h;
      if(h.t==='frag'||h.t==='pest'){ h.o.x = clamp01(drag.o.x+dx); h.o.y = clamp01(drag.o.y+dy); }
      else { const xs = drag.o.map(q=>q[0]), ys = drag.o.map(q=>q[1]);
        const ddx = Math.max(-Math.min(...xs), Math.min(1-Math.max(...xs), dx)), ddy = Math.max(-Math.min(...ys), Math.min(1-Math.max(...ys), dy));
        h.o.pts = drag.o.map(q=>[q[0]+ddx, q[1]+ddy]); }
      lyRedraw(); }
  };
  inner.onpointercancel = () => { drag = null; MV.tmp = null; const d = $('#mDraw'); if(d) d.hidden = true; lyRedraw(); };
  inner.onpointerup = async e => {
    const d = drag; drag = null; if(!d) return;
    let p = frac(e); snapShow(null);
    if(d.k==='click' || d.k==='draw' || d.k==='mark') p = mapSnap(p, e);
    if(d.k==='mark') p = lyStraight([d.s.x, d.s.y], p, e);
    if(d.k==='click' && MV.poly && MV.poly.pts.length) p = lyStraight(MV.poly.pts[MV.poly.pts.length-1], p, e);
    if(d.k==='click'){
      if(d.moved) return;
      const P = MV.poly, b = inner.getBoundingClientRect(), near = q => Math.hypot((p.x-q[0])*b.width, (p.y-q[1])*b.height) < 14;
      if(MV.tool==='zpoly' && P.pts.length>=3 && near(P.pts[0])){ lyPolyFinish(); return; }
      if(MV.tool==='fline' && P.pts.length>=2 && near(P.pts[P.pts.length-1])){ lyPolyFinish(); return; }
      P.pts.push([p.x, p.y]); lyRedraw(); return;
    }
    if(d.k==='draw'){
      $('#mDraw').hidden = true;
      const x = Math.min(p.x,d.s.x), y = Math.min(p.y,d.s.y), w = Math.abs(p.x-d.s.x), h = Math.abs(p.y-d.s.y);
      if(w<0.02 || h<0.02){ say('範圍太小了，請在平面圖上「按住拖曳」畫出分區。'); return; }
      lyAdd('zone', {kind:MV.zk, name:'', desc:'', pts:[[x,y],[x+w,y],[x+w,y+h],[x,y+h]]}, true); return;
    }
    if(d.k==='mark'){
      MV.tmp = null;
      const len = Math.hypot(p.x-d.s.x, p.y-d.s.y), pts = len<0.01 ? [[clamp01(p.x-0.015),p.y],[clamp01(p.x+0.015),p.y]] : [[d.s.x,d.s.y],[p.x,p.y]];
      lyAdd('mark', {kind:MV.fk, note:'', pts}, false); return;
    }
    if(d.k==='pest'){ if(d.moved) return; lyAdd('pest', Object.assign({kind:MV.pk, code:pestNextCode(MV.pk, MV.pki||'dot'), note:'', x:p.x, y:p.y}, MV.pk==='other' ? (pestRemember(MV.pkn, MV.pki||'dot'), {name:(MV.pkn||'').trim()||'其它病媒設施', ico:MV.pki||'dot'}) : {}), false); return; }
    if(d.k==='place'){
      /* 跟病媒一樣：點一下就放好，名稱先用種類，之後在右邊改 */
      if(d.moved) return;
      const k = MV.ftk, T0 = FT[k];
      const f = {kind:'frag', ft:k, code:fragNextCode(), name:T0 ? (T0.name || T0.t) : '其它易碎品', mat:T0 ? T0.mat : '', qty:1, where:'', months:'', photos:[], x:p.x, y:p.y};
      lyAdd('frag', f, false);
      if(!T0){ const i = $('#fgName'); if(i){ i.focus(); i.select(); } }
      return;
    }
    if(d.k==='vtx'){
      if(!d.moved && !d.added){
        const now = Date.now(), L = MV.lastVtx;
        if(L && L.id===d.o.id && L.i===d.i && now-L.t<500){
          MV.lastVtx = null; const min = MV.sel.t==='zone' ? 3 : 2;
          if(d.o.pts.length<=min){ say(MV.sel.t==='zone'?'至少要留 3 個角。':'至少要留起點和終點。'); return; }
          d.o.pts.splice(d.i,1); saveMap(); lyRedraw(); flash('已刪除一個點'); return;
        }
        MV.lastVtx = {id:d.o.id, i:d.i, t:now}; return;
      }
      saveMap(); lyRedraw(); return;
    }
    if(d.k==='mv'){ if(d.moved) saveMap(); MV.sel = {t:d.h.t, id:d.h.o.id}; lySide(); return; }
    if(d.k==='pan' && !d.moved){ MV.sel = d.hit ? {t:d.hit.t, id:d.hit.o.id} : null; lySide(); }
  };
}
/* 接近水平或垂直（8 度以內）就拉直；按住 Alt 不拉直 */
function lyStraight(prev, q, e){
  const m = lyMap(); if(!prev || !m || (e && e.altKey)) return q;
  const dx = Math.abs(q.x-prev[0])*(m.w||1), dy = Math.abs(q.y-prev[1])*(m.h||1); if(dx+dy < 1) return q;
  const ang = Math.atan2(dy, dx)*180/Math.PI;
  if(ang < 8) return Object.assign({}, q, {y:prev[1]});
  if(ang > 82) return Object.assign({}, q, {x:prev[0]});
  return q;
}
/* 標記（門、冷氣…）以中心點轉 90 度：用平面圖實際比例算，轉完長度不變 */
function lyRotate(id){
  const o = lyGet('mark', id), m = lyMap(); if(!o || !m) return;
  const W = m.w||1, H = m.h||1, b = lyBox(o.pts), cx = b.x+b.w/2, cy = b.y+b.h/2;
  let pts = o.pts.map(q => { const vx = (q[0]-cx)*W, vy = (q[1]-cy)*H; return [cx - vy/W, cy + vx/H]; });
  const nb = lyBox(pts), sx = Math.max(-nb.x, Math.min(1-nb.x-nb.w, 0)), sy = Math.max(-nb.y, Math.min(1-nb.y-nb.h, 0));
  o.pts = pts.map(q=>[q[0]+sx, q[1]+sy]); saveMap(); lyRedraw(); flash('已轉 90°');
}
function lyUndo(){ if(MV.poly && MV.poly.pts.length){ MV.poly.pts.pop(); lyRedraw(); } }
function lyAdd(t, o, stop){
  o.id = mapUid(t.slice(0,2)); o.mapId = MV.mapId; MAPD[LY_ARR[t]] = MAPD[LY_ARR[t]] || []; MAPD[LY_ARR[t]].push(o);
  if(!saveMap()){ MAPD[LY_ARR[t]].pop(); return; }
  if(stop){ MV.tool = ''; MV.poly = null; }
  MV.sel = {t, id:o.id};
  if(stop) renderMap(); else { lySide(); }
  flash(t==='zone'?'已新增'+(ZK[o.kind]||{}).t : t==='frag'?'已放置'+(FT[o.ft]?FT[o.ft].t:'易碎品')+' '+o.code+'，可以繼續放' : t==='pest'?'已放置'+PK[o.kind].t+' '+o.code+'，可以繼續放' : t==='flow'?'已新增'+FK[o.kind].t+'，可以繼續畫下一條' : '已新增'+MK[o.kind].t+'，可以繼續畫');
}
function lyPolyFinish(){
  const P = MV.poly; if(!P) return;
  if(MV.tool==='zpoly'){
    if(P.pts.length<3){ say('多邊形至少要點 3 個角。'); return; }
    const b = lyBox(P.pts); if(b.w<0.01 || b.h<0.01){ say('範圍太小了，請再畫一次。'); return; }
    lyAdd('zone', {kind:MV.zk, name:'', desc:'', pts:P.pts.map(q=>q.slice())}, true); return;
  }
  if(MV.tool==='fline'){
    if(P.pts.length<2){ say('箭頭至少要點起點和終點兩個點。'); return; }
    const pts = P.pts.map(q=>q.slice()); MV.poly = {pts:[]};
    lyAdd('flow', {kind:MV.fk, note:'', pts}, false); return;
  }
}

function pestGroups(ps){ const out = Object.entries(PK).filter(([k])=>k!=='other').map(([k,v])=>({k, t:v.t.replace(/（.*）/,''), n:ps.filter(o=>o.kind===k).length})), m = new Map();

  return out; }
function pestLegend(all){ const ps = lyList('pest'), out = Object.entries(PK).filter(([k])=>k!=='other' && (all || !ps.length || ps.some(o=>o.kind===k))).map(([k,v])=>({k, t:v.t})), seen = new Set();
  ps.filter(o=>o.kind==='other').forEach(o => { const k = pestIcoKey(o), t = o.name||'其它病媒設施', id = k+'|'+t; if(!seen.has(id)){ seen.add(id); out.push({k, t}); } });

  const was = pestPre(o.kind, o.ico||'dot'), now = pestPre(kind, ico||'dot'), keep = code!==o.code;   /* 自己改過編號就照你打的 */
  Object.assign(o, {kind, code, note:$('#lpNote').value.trim()});

  /* 圖示＋編號這一整組的中間對準位置，跟畫面上完全一樣（比例照畫面：圖示 36、字 11、內距 4、重疊 3） */

    const ik = ICON[pestIcoKey(o)]; if(ik) g.drawImage(ik, left, cy-sz/2, sz, sz);

/* ---------- 🧲 磁鐵：畫多邊形、拖角時，輕輕吸到附近的角、對齊其他角、平面圖上的線條與色塊邊界 ---------- */
let MV_SNAP = lyLS('mapSnap')!=='0';
function mapSnapToggle(){ MV_SNAP = !MV_SNAP; lyLS('mapSnap', MV_SNAP?'1':'0'); renderMap(); flash(MV_SNAP?'🧲 磁鐵已開啟':'磁鐵已關閉'); }
const SNAP = { key:'', w:0, h:0, gx:null, gy:null };
/* 平面圖的「線條強度」：左右（gx）、上下（gy）顏色差多少；第一次用到時算一次 */
function snapEdges(){
  const im = $('#mapImg'); if(!im || !im.complete || !im.naturalWidth) return null;
  const key = MV.mapId+'|'+im.naturalWidth+'x'+im.naturalHeight+'|'+(im.src||'').length;
  if(SNAP.key===key) return SNAP;
  const w = im.naturalWidth, h = im.naturalHeight, c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d', {willReadFrequently:true}); g.drawImage(im, 0, 0);
  let d; try{ d = g.getImageData(0, 0, w, h).data; }catch(e){ return null; }
  const gx = new Uint8Array(w*h), gy = new Uint8Array(w*h), W4 = w*4;
  for(let y=1; y<h-1; y++) for(let x=1; x<w-1; x++){
    const i = (y*w+x)*4, l = i-4, r = i+4, u = i-W4, dn = i+W4;
    gx[y*w+x] = Math.max(Math.abs(d[l]-d[r]), Math.abs(d[l+1]-d[r+1]), Math.abs(d[l+2]-d[r+2]));
    gy[y*w+x] = Math.max(Math.abs(d[u]-d[dn]), Math.abs(d[u+1]-d[dn+1]), Math.abs(d[u+2]-d[dn+2]));
  }
  Object.assign(SNAP, {key, w, h, gx, gy}); return SNAP;
}
/* 地圖上所有的角（缺失區域、清潔分區、正在畫的點），skip：拖曳中的那個角不算 */
function snapPts(skip){
  const out = [], add = (o, pts) => pts.forEach((q,i) => { if(!(skip && skip.o===o && skip.i===i)) out.push(q); });
  mapAreas().forEach(a => add(a, a.pts || [[a.x,a.y],[a.x+a.w,a.y],[a.x+a.w,a.y+a.h],[a.x,a.y+a.h]]));
  lyList('zone').forEach(z => add(z, z.pts));
  if(MV.poly && MV.poly.pts) add(MV.poly, MV.poly.pts);
  return out;
}
const SNAP_R = 10;   /* 弱磁鐵：螢幕上 10px 以內才會吸 */
function mapSnap(p, e, skip){
  const inner = $('#mapInner');
  if(!MV_SNAP || (e && e.altKey) || !inner) return {x:p.x, y:p.y};
  const b = inner.getBoundingClientRect(); if(!b.width) return {x:p.x, y:p.y};
  const V = snapPts(skip);
  /* 1. 靠近別的角：直接吸到那個角 */
  let best = null, bd = 1e9;
  V.forEach(q => { const dd = Math.hypot((q[0]-p.x)*b.width, (q[1]-p.y)*b.height); if(dd < bd){ bd = dd; best = q; } });
  if(best && bd <= SNAP_R) return {x:best[0], y:best[1], sx:1, sy:1, v:1};
  /* 2. 左右、上下各自找最近的：對齊別的角，或平面圖上的線條 */
  let x = p.x, y = p.y, dx = SNAP_R/b.width, dy = SNAP_R/b.height, sx = 0, sy = 0;
  V.forEach(q => { const ax = Math.abs(q[0]-p.x), ay = Math.abs(q[1]-p.y); if(ax < dx){ dx = ax; x = q[0]; sx = 1; } if(ay < dy){ dy = ay; y = q[1]; sy = 1; } });
  const E = snapEdges();
  if(E){
    const ix = Math.round(p.x*E.w), iy = Math.round(p.y*E.h), rx = Math.max(2, Math.round(SNAP_R*E.w/b.width)), ry = Math.max(2, Math.round(SNAP_R*E.h/b.height));
    const spy = Math.max(3, Math.round(6*E.h/b.height)), spx = Math.max(3, Math.round(6*E.w/b.width));
    let bs = 0, bx = -1;
    for(let cx = ix-rx; cx <= ix+rx; cx++){ if(cx<1 || cx>=E.w-1) continue; let t = 0, n = 0;
      for(let yy = iy-spy; yy <= iy+spy; yy++){ if(yy<1 || yy>=E.h-1) continue; t += E.gx[yy*E.w+cx]; n++; }
      t = n ? t/n : 0; if(t > bs + 0.5 || (Math.abs(t-bs) <= 0.5 && Math.abs(cx-ix) < Math.abs(bx-ix))){ bs = t; bx = cx; } }
    if(!sx && bx >= 0 && bs >= 40){ const f = bx/E.w; if(Math.abs(f-p.x) <= SNAP_R/b.width){ x = f; sx = 1; } }   /* 已經對齊到別的角就以角為準，線才會筆直 */
    let bt = 0, by = -1;
    for(let cy = iy-ry; cy <= iy+ry; cy++){ if(cy<1 || cy>=E.h-1) continue; let t = 0, n = 0;
      for(let xx = ix-spx; xx <= ix+spx; xx++){ if(xx<1 || xx>=E.w-1) continue; t += E.gy[cy*E.w+xx]; n++; }
      t = n ? t/n : 0; if(t > bt + 0.5 || (Math.abs(t-bt) <= 0.5 && Math.abs(cy-iy) < Math.abs(by-iy))){ bt = t; by = cy; } }
    if(!sy && by >= 0 && bt >= 40){ const f = by/E.h; if(Math.abs(f-p.y) <= SNAP_R/b.height){ y = f; sy = 1; } }
  }
  return {x:clamp01(x), y:clamp01(y), sx, sy};
}
/* 游標旁的小圓點：吸到時變橘色，並畫出對齊虛線 */
function snapShow(q){
  const m = $('#mSnap'), gx = $('#mSnapX'), gy = $('#mSnapY'); if(!m) return;
  if(!q || !MV_SNAP){ m.hidden = true; if(gx) gx.hidden = true; if(gy) gy.hidden = true; return; }
  m.hidden = false; m.className = 'msnap'+(q.sx||q.sy?' on':''); Object.assign(m.style, {left:q.x*100+'%', top:q.y*100+'%'});
  if(gx){ gx.hidden = !q.sx; gx.style.left = q.x*100+'%'; } if(gy){ gy.hidden = !q.sy; gy.style.top = q.y*100+'%'; }
}

/* ---------- 廠區地圖鍵盤快捷鍵：Delete 刪除、Ctrl+C 複製、Ctrl+V 貼上、Ctrl+Z 復原、Esc 取消 ---------- */
let MAP_CLIP = null, MAP_UNDO = [], MAP_MOUSE = null, MAP_LASTPASTE = null;
const LY_LAYER = { zone:'zone', flow:'flow', mark:'flow', frag:'frag', pest:'pest' };
const LY_NAME = o => o.t==='zone' ? (ZK[o.o.kind]||{}).t : o.t==='flow' ? (FK[o.o.kind]||{}).t : o.t==='mark' ? (MK[o.o.kind]||{}).t : o.t==='pest' ? pestLabel(o.o) : fragLabel(o.o);
document.addEventListener('pointermove', e => {
  const i = $('#mapInner'); if(!i){ MAP_MOUSE = null; return; }
  const b = i.getBoundingClientRect(), x = (e.clientX-b.left)/b.width, y = (e.clientY-b.top)/b.height;
  MAP_MOUSE = (x>=0 && x<=1 && y>=0 && y<=1) ? {x, y} : null;
}, {passive:true});
document.addEventListener('keydown', e => {
  if(!$('#mapInner') || !$('#mSide') || document.querySelector('.modal')) return;
  const t = e.target, tag = (t && t.tagName) || '';
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(tag) || (t && t.isContentEditable) || (t && t.closest && t.closest('.pzone'))) return;
  const k = (e.key||'').toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if(k==='escape'){ if(MV.tool){ MV.tool = ''; MV.poly = null; MV.tmp = null; renderMap(); } else if(MV.sel){ MV.sel = null; mapSide(); } return; }
  if((k==='delete' || k==='backspace') && !mod){ if(!MV.sel) return; e.preventDefault(); mapKeyDelete(); return; }
  if(mod && k==='c'){ if(!MV.sel || String(window.getSelection ? window.getSelection() : '')) return; e.preventDefault(); mapKeyCopy(); return; }
  if(mod && k==='v'){ if(!MAP_CLIP) return; e.preventDefault(); mapKeyPaste(); return; }
  if(k==='r' && !mod && MV.sel && MV.sel.t==='mark'){ if(MV.mode!=='edit'){ flash('切到「✏️ 編輯模式」才能旋轉'); return; } e.preventDefault(); lyRotate(MV.sel.id); return; }
  if(mod && k==='z' && !e.shiftKey){ if(!MAP_UNDO.length) return; e.preventDefault(); mapKeyUndo(); return; }
});
function mapKeyDelete(){
  const sel = MV.sel;
  if(MV.mode!=='edit'){ flash('切到「✏️ 編輯模式」才能刪除'); return; }
  if(sel.t==='area'){ mapAreaDel(sel.id); return; }   /* 缺失區域、位置有案件，照原本的方式先確認 */
  if(sel.t==='loc'){ mapLocDel(sel.id); return; }
  const arr = MAPD[LY_ARR[sel.t]] || [], i = arr.findIndex(x=>x.id===sel.id); if(i<0) return;
  const o = arr[i]; arr.splice(i, 1); if(!saveMap()){ arr.splice(i, 0, o); return; }
  MAP_UNDO.push({k:'del', t:sel.t, o, i}); if(MAP_UNDO.length>30) MAP_UNDO.shift();
  MV.sel = null; renderMap(); flash(`已刪除「${LY_NAME({t:sel.t, o})}」，按 Ctrl+Z 可以復原`);
}
function mapKeyCopy(){
  const sel = MV.sel;
  if(sel.t==='area' || sel.t==='loc'){ flash('缺失區域和位置不能複製（名稱不能重複），請用「新增」'); return; }
  const o = lyGet(sel.t, sel.id); if(!o) return;
  MAP_CLIP = {t:sel.t, o:JSON.parse(JSON.stringify(o))}; MAP_LASTPASTE = null;
  flash(`已複製「${LY_NAME(MAP_CLIP)}」，按 Ctrl+V 貼上（貼在滑鼠位置）`);
}
function mapKeyPaste(){
  if(!MV.mapId) return;
  if(MV.mode!=='edit'){ flash('切到「✏️ 編輯模式」才能貼上'); return; }
  const c = MAP_CLIP, o = JSON.parse(JSON.stringify(c.o)), pt = !!o.pts;
  const box = pt ? lyBox(o.pts) : {x:o.x, y:o.y, w:0, h:0}, cx = box.x+box.w/2, cy = box.y+box.h/2;
  /* 貼在滑鼠位置；滑鼠沒動（或不在地圖上）就往右下錯開一點，才不會疊在一起 */
  let to = MAP_MOUSE && !(MAP_LASTPASTE && Math.hypot(MAP_MOUSE.x-MAP_LASTPASTE.m.x, MAP_MOUSE.y-MAP_LASTPASTE.m.y) < 0.004) ? {x:MAP_MOUSE.x, y:MAP_MOUSE.y} : null;
  if(!to){ const b = MAP_LASTPASTE ? MAP_LASTPASTE.at : {x:cx, y:cy}; to = {x:b.x+0.02, y:b.y+0.02}; }
  const dx = Math.max(-box.x, Math.min(1-box.x-box.w, to.x-cx)), dy = Math.max(-box.y, Math.min(1-box.y-box.h, to.y-cy));
  if(pt) o.pts = o.pts.map(q=>[q[0]+dx, q[1]+dy]); else { o.x = clamp01(o.x+dx); o.y = clamp01(o.y+dy); }
  MAP_LASTPASTE = {m: MAP_MOUSE ? {x:MAP_MOUSE.x, y:MAP_MOUSE.y} : {x:-1, y:-1}, at:{x:cx+dx, y:cy+dy}};
  o.id = mapUid(c.t.slice(0,2)); o.mapId = MV.mapId;
  if(c.t==='frag') o.code = fragNextCode();
  if(c.t==='pest') o.code = pestNextCode(o.kind, o.ico);
  MAPD[LY_ARR[c.t]] = MAPD[LY_ARR[c.t]] || []; MAPD[LY_ARR[c.t]].push(o);
  if(!saveMap()){ MAPD[LY_ARR[c.t]].pop(); return; }
  MAP_UNDO.push({k:'add', t:c.t, id:o.id}); if(MAP_UNDO.length>30) MAP_UNDO.shift();
  if(MV.layer!==LY_LAYER[c.t]){ MV.layer = LY_LAYER[c.t]; lyLS('mapLayer', MV.layer); }
  MV.tool = ''; MV.poly = null; MV.sel = {t:c.t, id:o.id}; renderMap();
  flash(`已貼上「${LY_NAME({t:c.t, o})}」${c.t==='frag'||c.t==='pest'?'（新編號 '+o.code+'）':''}`);
}
function mapKeyUndo(){
  const u = MAP_UNDO.pop(); if(!u) return; const k = LY_ARR[u.t]; MAPD[k] = MAPD[k] || [];
  if(u.k==='del'){ MAPD[k].splice(Math.min(u.i, MAPD[k].length), 0, u.o); MV.sel = u.o.mapId===MV.mapId ? {t:u.t, id:u.o.id} : null; }
  else { MAPD[k] = MAPD[k].filter(x=>x.id!==u.id); MV.sel = null; }
  saveMap(); renderMap(); flash(u.k==='del' ? '已復原刪除' : '已取消貼上');
}

/* ---------- 常用選項頁 ---------- */

const OPT_PH = { area:'例：包裝區', people:'例：品保 王小明', dept:'例：生產課' };

function holCard(){

    <div class="grid" style="grid-template-columns:1fr 1fr;gap:6px;margin-top:8px"><div><label class="f">從</label><input type="date" id="hoF"></div><div><label class="f">到（只有一天可以不填）</label><input type="date" id="hoT"></div></div>
    <div class="oadd" style="margin-top:6px"><input type="text" id="hoN" placeholder="名稱（例：春節連假、颱風假）" onkeydown="if(event.key==='Enter')holAdd()"><button class="primary" onclick="holAdd()">新增</button></div>
    <div class="muted small" style="margin-top:4px">連假選「從～到」一次加好；六日不用加。</div></div>`;

function holAdd(){
  const f = $('#hoF').value, t = $('#hoT').value || f, n = $('#hoN').value.trim();
  if(!f){ say('請選休假日期。'); return; } if(t < f){ say('「到」不能比「從」早。'); return; }
  if(daysBetween(f, t) > 60){ say('一次最多加 60 天。'); return; }
  const add = []; for(let d = f; d <= t; d = addDays(d,1)){ const w = new Date(d+'T00:00').getDay(); if(w!==0 && w!==6) add.push({d, n}); }
  if(!add.length){ say('選的日子都是六日，本來就不算，不用加。'); return; }
  const old = OPTS.holidays; OPTS.holidays = holList([...(OPTS.holidays||[]), ...add]); if(!saveOpts()){ OPTS.holidays = old; return; }
  renderOpts(); flash(`已加入 ${add.length} 天休假日`);
}
async function holDel(d){ if(!(await ask(`刪除休假日 ${fmtDate(d)}？`))) return; OPTS.holidays = (OPTS.holidays||[]).filter(x=>x.d!==d); saveOpts(); renderOpts(); }
function optCard(k){

    ${L.length ? `<ul class="optl">${L.map((x,i)=>`<li><span>${esc(x)}</span>
      <button onclick="optMove('${k}',${i},-1)" ${i?'':'disabled'} aria-label="上移">↑</button>
      <button onclick="optMove('${k}',${i},1)" ${i<L.length-1?'':'disabled'} aria-label="下移">↓</button>
      <button onclick="optEdit('${k}',${i})">編輯</button>
      <button class="danger" onclick="optDel('${k}',${i})">刪除</button></li>`).join('')}</ul>` : '<div class="muted small" style="margin:10px 0">還沒有常用選項。</div>'}
    ${k==='dept'?'<div class="muted small" style="margin-bottom:8px">下拉選單最後一定會有「其它（自己打字）」，不在清單上的單位可以直接打字。</div>':''}
    <div class="oadd"><input type="text" id="oi_${k}" placeholder="${OPT_PH[k]}" onkeydown="if(event.key==='Enter')optAdd('${k}')"><button class="primary" onclick="optAdd('${k}')">新增</button></div></div>`;

/* 輸入框對話視窗（claude.ai 不能用 prompt） */
function askText(title, value){
  return new Promise(res => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="box" role="dialog" aria-modal="true"><div class="msg"></div><input type="text" id="atIn" style="margin-bottom:12px"><div class="row"><button id="atNo">取消</button><button class="primary" id="atOk">確定</button></div></div>`;
    m.querySelector('.msg').textContent = title; const inp = m.querySelector('#atIn'); inp.value = value;
    const done = v => { m.remove(); res(v); };
    m.querySelector('#atOk').onclick = () => done(inp.value.trim());
    m.querySelector('#atNo').onclick = () => done(null);
    inp.onkeydown = e => { if(e.key==='Enter') done(inp.value.trim()); if(e.key==='Escape') done(null); };
    document.body.appendChild(m); inp.focus(); inp.select();
  });
}
/* 開啟時整理：常用清單裡只差全形半形、空白的視為同一個；舊案件的寫法統一成清單上的 */
function optUnify(){
  let raw = {}; try{ raw = JSON.parse(localStorage.getItem(KEY_O)||'{}') || {}; }catch(e){}
  const changedOpts = Object.keys(OPT_KINDS).some(k => Array.isArray(raw[k]) && raw[k].length !== OPTS[k].length);
  if(changedOpts) saveOpts();
  let n = 0;
  records.forEach(r => Object.entries(OPT_FIELDS).forEach(([k, fs]) => fs.forEach(f => {
    const v = r[f]; if(!v) return; const c = optFind(k, v); if(c && c!==v){ r[f] = c; n++; } })));
  if(n) persistAll();
  return n;
}
/* 改名：清單改掉；已存的案件裡「完全相同」的值，問過後一起改 */
const OPT_FIELDS = { area:['area'], dept:['ownerDept','improveDept'], people:['finder','ownerNote','notifyTarget','improveNote','closedBy'] };
async function optEdit(k,i){
  const old = OPTS[k][i], v = await askText('修改「'+old+'」為：', old);
  if(v===null || v===old) return;
  if(!v){ say('名稱不能空白。'); return; }
  if(v==='其它'){ say('「其它」不能加入常用。'); return; }
  const dup = OPTS[k].find((x,j)=>j!==i && nkey(x)===nkey(v));
  if(dup){ /* 改成清單裡已經有的名稱 → 合併成一個，舊案件一起改 */
    const hit = records.filter(r => OPT_FIELDS[k].some(f=>nkey(r[f])===nkey(old)));
    if(!(await ask(`清單裡已經有「${dup}」。\n要把「${old}」合併到「${dup}」嗎？${hit.length?`\n用到「${old}」的 ${hit.length} 件案件會一起改成「${dup}」，統計就會合在一起。`:''}`))) return;
    OPTS[k].splice(i,1); if(!saveOpts()) return;
    hit.forEach(r => OPT_FIELDS[k].forEach(f=>{ if(nkey(r[f])===nkey(old)) r[f] = dup; }));
    if(k==='people') records.forEach(r=>(r.reviews||[]).forEach(x=>{ if(nkey(x.by)===nkey(old)) x.by = dup; }));
    if(k==='area') MAPD.areas.forEach(a=>{ if(nkey(a.name)===nkey(old)) a.name = dup; }), saveMap();
    if(persistAll()) flash(`已合併到「${dup}」${hit.length?'，更新 '+hit.length+' 件案件':''}`);
    renderOpts(); return;
  }
  OPTS[k][i] = v; if(!saveOpts()){ OPTS[k][i] = old; return; }
  const hit = records.filter(r => OPT_FIELDS[k].some(f=>r[f]===old) || (k==='people' && (r.reviews||[]).some(x=>x.by===old)));
  if(hit.length && await ask(`已存的案件中有 ${hit.length} 件用到「${old}」，要一起改成「${v}」嗎？\n（選「取消」只改清單，舊案件維持原樣）`)){
    hit.forEach(r => { OPT_FIELDS[k].forEach(f=>{ if(r[f]===old) r[f]=v; }); if(k==='people') (r.reviews||[]).forEach(x=>{ if(x.by===old) x.by=v; }); });
    if(persistAll()) flash('已更新 '+hit.length+' 件案件');
  }
  renderOpts();
}
function optAdd(k){
  const inp = $('#oi_'+k), v = inp.value.trim();
  if(!v) return;
  if(v==='其它'){ say('「其它」不能加入常用。'); return; }
  if(optFind(k, v)){ say('「'+optFind(k, v)+'」已經在清單裡了。'); return; }
  OPTS[k].push(v); if(!saveOpts()){ OPTS[k].pop(); return; }
  renderOpts(); $('#oi_'+k).focus();
}
function optMove(k,i,d){ const L = OPTS[k]; [L[i],L[i+d]] = [L[i+d],L[i]]; saveOpts(); renderOpts(); }
async function optDel(k,i){
  if(!(await ask('確定從常用選項移除「'+OPTS[k][i]+'」？（已經存好的案件不會改變）'))) return;
  OPTS[k].splice(i,1); saveOpts(); renderOpts();
}

/* ---------- 最近刪除頁 ---------- */
function trashList(){ return records.filter(r=>r.deleted).sort((a,b)=>(b.deletedAt||'').localeCompare(a.deletedAt||'') || b.id.localeCompare(a.id)); }
function ymdNum(d){ const [y,m,dd]=d.split('-').map(Number); return Date.UTC(y,m-1,dd); }
function daysLeft(r){ return Math.round((ymdNum(addDays(r.deletedAt||today(),30)) - ymdNum(today()))/86400000); }

function trashToggle(el){ const id=el.dataset.id; if(el.checked) trashSel.add(id); else trashSel.delete(id); renderTrash(); }

function trashNone(){ trashSel = new Set(); renderTrash(); }
function trashRestore(){
  if(!trashSel.size) return;
  const ids = [...trashSel]; const done = [];
  records.forEach(r => { if(ids.includes(r.id) && r.deleted){ r.deleted=false; delete r.deletedAt; done.push(r); } });
  if(!persistAll()){ done.forEach(r=>{ r.deleted=true; r.deletedAt=today(); }); return; }

async function trashPerm(){
  const n = trashSel.size; if(!n) return;
  if(!(await ask(`確定要永久刪除選取的 ${n} 筆嗎？永久刪除後無法復原。`))) return;
  const ids = new Set(trashSel), oldR = records, oldT = tombs.slice();
  records.filter(r=>ids.has(r.id)).forEach(r => tombs.push({id:r.id, foundDate:r.foundDate, deletedAt:r.deletedAt||today(), purgedAt:today()}));
  records = records.filter(r=>!ids.has(r.id));
  if(!persistAll()){ records = oldR; tombs = oldT; return; }

}
function purgeExpired(){
  const exp = records.filter(r => r.deleted && r.deletedAt && today() > addDays(r.deletedAt,30));
  if(!exp.length) return;
  const ids = new Set(exp.map(r=>r.id));
  exp.forEach(r => tombs.push({id:r.id, foundDate:r.foundDate, deletedAt:r.deletedAt, purgedAt:today()}));
  records = records.filter(r=>!ids.has(r.id));

/* ---------- 統計：圖表下載成 PNG ---------- */
async function chartPng(fig){
  const sv = fig.querySelector('svg[role=img]'); if(!sv) throw new Error('沒有圖表');
  const title = fig.dataset.title || '', vb = sv.viewBox.baseVal, W = vb.width, H = vb.height, tH = 36, lH = 30;
  const F = 'Microsoft JhengHei,PingFang TC,Noto Sans TC,sans-serif';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W+24}" height="${H+tH+lH}" viewBox="0 0 ${W+24} ${H+tH+lH}" font-family="${F}"><rect width="100%" height="100%" fill="#ffffff"/>`+
    `<text x="14" y="25" font-size="15" font-weight="700" fill="#16213a">${esc(title)}</text>`+
    `<g transform="translate(12,${tH})">${sv.innerHTML}</g>`+
    `<line x1="20" y1="${H+tH+16}" x2="46" y2="${H+tH+16}" stroke="#16213a" stroke-width="3"/><text x="52" y="${H+tH+20}" font-size="13" fill="#16213a">總件數（新增）</text>`+
    `<line x1="170" y1="${H+tH+16}" x2="196" y2="${H+tH+16}" stroke="#c0392b" stroke-width="3" stroke-dasharray="7 4"/><text x="202" y="${H+tH+20}" font-size="13" fill="#16213a">逾期件數</text></svg>`;
  const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); await img.decode();
  const k = 2, c = document.createElement('canvas'); c.width = (W+24)*k; c.height = (H+tH+lH)*k;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
  return await new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error('圖片產生失敗')),'image/png'));
}
async function dlChart(btn){
  const fig = btn.closest('figure'), msg = btn.nextElementSibling; btn.disabled = true; msg.textContent = '產生中…';

/* ---------- 統計頁右側：處理狀態圓餅、類別、負責單位（今年） ---------- */

/* ---------- 統計頁折線圖：每月趨勢（一張圖一個量；顏色依固定順序；線尾直接標名稱；滑過看數字、點圓點看案件） ---------- */

/* 依實際寬度畫（字固定大小，不會縮到看不見） */

/* ---------- 統計報表下載成 Word（.docx）：把畫面上的統計內容轉成 Word，claude.ai 版也能用 ---------- */
function zipStore(files, type='application/vnd.openxmlformats-officedocument.wordprocessingml.document'){
  /* 不壓縮的 zip（.docx 就是 zip） */
  const T = zipStore.t || (zipStore.t = Array.from({length:256},(_,n)=>{ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; return c>>>0; }));
  const crc = d => { let c = 0xFFFFFFFF; for(let i=0;i<d.length;i++) c = T[(c^d[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
  const enc = new TextEncoder(), parts = [], cen = []; let off = 0;
  const u16 = v => [v&255, v>>>8&255], u32 = v => [v&255, v>>>8&255, v>>>16&255, v>>>24&255];
  files.forEach(([name, data]) => {
    const nb = enc.encode(name), d = typeof data==='string' ? enc.encode(data) : data, c = crc(d);
    const common = [...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(c), ...u32(d.length), ...u32(d.length), ...u16(nb.length), ...u16(0)];
    const loc = new Uint8Array([...u32(0x04034b50), ...common]);
    parts.push(loc, nb, d);
    cen.push(new Uint8Array([...u32(0x02014b50), ...u16(20), ...common, ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off)]), nb);
    off += loc.length + nb.length + d.length;
  });
  const cenLen = cen.reduce((a,b)=>a+b.length,0);
  return new Blob([...parts, ...cen, new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(cenLen), ...u32(off), ...u16(0)])],
    {type});
}
function wx(t){ return String(t??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function wRun(t, o={}){ return `<w:r><w:rPr><w:rFonts w:ascii="Microsoft JhengHei" w:hAnsi="Microsoft JhengHei" w:eastAsia="Microsoft JhengHei"/>${o.b?'<w:b/>':''}${o.color?`<w:color w:val="${o.color}"/>`:''}<w:sz w:val="${o.sz||21}"/></w:rPr><w:t xml:space="preserve">${wx(t)}</w:t></w:r>`; }
function wPara(t, o={}){ return `<w:p><w:pPr>${o.keep?'<w:keepNext/>':''}${o.jc?`<w:jc w:val="${o.jc}"/>`:''}<w:spacing w:before="${o.before||0}" w:after="${o.after??80}"/>${o.shade?`<w:shd w:val="clear" w:color="auto" w:fill="${o.shade}"/>`:''}</w:pPr>${wRun(t,o)}</w:p>`; }
function wTable(rows, head=true){
  const B = ['top','left','bottom','right','insideH','insideV'].map(k=>`<w:${k} w:val="single" w:sz="4" w:color="C9BDA6"/>`).join('');
  return `<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>${B}</w:tblBorders><w:tblCellMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr>`+
    rows.map((r,i)=>`<w:tr>${r.map(c=>`<w:tc><w:tcPr>${head&&i===0?'<w:shd w:val="clear" w:color="auto" w:fill="F3ECE0"/>':''}<w:vAlign w:val="center"/></w:tcPr>${wPara(c,{b:head&&i===0, sz:19, after:0, jc:'center'})}</w:tc>`).join('')}</w:tr>`).join('')+'</w:tbl>'+wPara('',{after:60});
}
async function dlStatsWord(){
  const box = $('#statBody'), btn = $('#wordBtn'); if(!box) return;
  btn.disabled = true; const old = btn.textContent; btn.textContent = '產生中…';
  try{
    const rg = periodRange(statView,statY,stA()), name = statView==='month'?'月報':statView==='quarter'?'季報':'年報';
    const txt = el => el.textContent.replace(/\s+/g,' ').trim();
    let body = wPara('衛生缺失統計'+name, {b:1, sz:32, jc:'center', after:60}) + wPara(rg.label+'　產出日期：'+fmtDate(today()), {jc:'center', sz:20, color:'5D6779', after:200});
    const media = [];
    for(const el of box.children){
      if(el.classList.contains('st-sum')) body += wPara(txt(el), {b:1, shade:el.classList.contains('warn')?'FDECEA':'E6F5EC', after:120});
      else if(el.classList.contains('st-tiles')){ const t=[...el.querySelectorAll('.st-tile')]; body += wTable([t.map(x=>txt(x.querySelector('.l'))), t.map(x=>txt(x.querySelector('.n'))+' 件'), t.map(x=>txt(x.querySelector('.d'))), t.map(x=>x.querySelector('.tchg')?txt(x.querySelector('.tchg')):'')]); }
      else if(el.classList.contains('st-extra')) body += wTable([...el.querySelectorAll('.box')].map(x=>[txt(x.querySelector('.l')), txt(x.querySelector('.n'))+' 件', txt(x.querySelector('.st-note'))]), false);
      else if(el.classList.contains('st-note')) body += wPara(txt(el), {sz:17, color:'5D6779'});
      else if(el.classList.contains('st-sec')) body += wPara(txt(el), {b:1, sz:24, before:200, after:80, color:'16213A', keep:1});
      else if(el.classList.contains('st-bar')){
        /* 區域長條：連續幾列合成一張表 */
        if(!(el.previousElementSibling && el.previousElementSibling.classList.contains('st-bar'))){
          const rows=[['缺失區域','件數','比上期']]; let n=el; while(n && n.classList.contains('st-bar')){ rows.push([txt(n.children[0]), txt(n.querySelector('.v')), n.querySelector('.c')?txt(n.querySelector('.c')):'']); n=n.nextElementSibling; }
          body += wTable(rows);
        }
      }
      else if(el.matches('table') || (el.matches('.st-scroll') && el.querySelector('table'))){ const tb=el.matches('table')?el:el.querySelector('table'); body += wTable([...tb.rows].map(r=>[...r.cells].map(txt))); }
      else if(el.classList.contains('st-block')){
        const sec = el.querySelector('.st-sec'), fig = el.querySelector('figure');
        if(sec) body += wPara(txt(sec), {b:1, sz:24, before:200, after:80, color:'16213A', keep:1});
        try{
          const blob = await chartPng(fig), png = new Uint8Array(await blob.arrayBuffer());
          const bm = await createImageBitmap(blob), cx = 5040000, cy = Math.round(cx*bm.height/bm.width), id = media.length+1;
          media.push(png);
          body += `<w:p><w:r><w:drawing><wp:inline><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${id}" name="chart${id}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${id}" name="chart${id}.png"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rImg${id}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
        }catch(e){ body += wPara('（趨勢圖無資料）', {sz:19, color:'5D6779'}); }
      }
      else if(txt(el)) body += wPara(txt(el), {sz:19, color:'5D6779'});
    }
    body += wPara('Casevoras 衛生缺失追蹤助手．本報表依本機資料產生', {sz:16, color:'888888', before:120, jc:'center'});
    const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr></w:body></w:document>`;
    const files = [
      ['[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>'],
      ['_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'],
      ['word/_rels/document.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+media.map((_,i)=>`<Relationship Id="rImg${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/chart${i+1}.png"/>`).join('')+'</Relationships>'],
      ['word/document.xml', doc],
      ...media.map((m,i)=>[`word/media/chart${i+1}.png`, m])
    ];
    const fn = `Casevoras_衛生缺失統計${name}_${rg.label}`.replace(/\s+/g,'').replace(/[\\/:*?"<>|：（）]+/g,'_') + '.docx';
    await download(zipStore(files), fn, 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
    flash('已送出下載：Word 報表');
  }catch(e){ say('Word 報表產生失敗，請重試。'); }
  btn.disabled = false; btn.textContent = old;
}

/* ---------- 列印單筆報表 ---------- */
async function printReport(){
  if(inClaude()){ say('claude.ai 版無法開啟列印視窗。請到網址版按「列印／存成 PDF」。'); return; }
  if(dirty && !(await ask('有尚未儲存的修改，列印內容會包含這些修改（但尚未儲存）。要繼續嗎？'))) return;
  const r = cur;
  await preloadPhotos([r]);
  const row = (k,v) => `<tr><th>${k}</th><td>${v||''}</td></tr>`;
  const imgs = arr => arr.length ? arr.map(p=>`<img src="${phSync(p)}">`).join('') : '無';
  $('#print').innerHTML = `
    <h1>衛生缺失改善追蹤紀錄</h1>
    <div style="text-align:center;margin-bottom:10px">編號：${esc(r.id)}　狀態：${statusOf(r).t}${isOverdue(r)?'（逾期）':''}　列印日期：${fmtDate(today())}</div>
    <h3>一、缺失基本資料</h3><table>
      ${row('發現日期',fmtDate(r.foundDate))}${row('缺失區域',esc(r.area))}${row('巡檢人員',esc(r.finder))}
      ${row('缺失類別',esc(typeName(r.defType)||'未選類別'))}${row('缺失等級',esc(CAT[r.category]||'未判定'))}
      ${row('發生情形',[r.consecutive?'相同缺失連續兩天發生':'', r.recurred?'已通知改善後再次發生':''].filter(Boolean).join('；')||'—')}
      ${row('負責單位／人員',esc(ownerText(r)))}${row('改善期限',fmtDate(r.deadline))}
      ${row('已通知對象',esc(r.notifyTarget))}
      ${row('缺失描述',nl2br(r.rawDesc))}
      ${row('缺失照片',imgs(r.photos))}</table>
    <h3>二、缺失單與追蹤要求</h3><table>
      ${row('缺失單編號（＝案件編號）',esc(r.id))}
      ${row('風險控制措施',nl2br(r.riskControl))}${row('發生原因',nl2br(r.causeAnalysis))}${row('預防再發措施',nl2br(r.prevention))}</table>
    <h3>三、實際改善情形</h3><table>
      ${row('如何改善',nl2br(r.improveContent))}${row('預計改善完成日期',fmtDate(r.improveDate))}
      ${row('改善執行單位／人員',esc(improveByText(r)))}${row('改善後照片',imgs(r.improvePhotos))}</table>
    <h3>四、複查紀錄</h3>
    ${r.reviews.length?`<table><tr><th style="width:auto">次數</th><th style="width:auto">日期</th><th style="width:auto">複查人員</th><th style="width:auto">結果</th><th style="width:auto">說明</th></tr>
      ${r.reviews.map((v,i)=>`<tr><td>第${i+1}次</td><td>${fmtDate(v.date)}</td><td>${esc(v.by)}</td><td>${REVIEW_RESULT[v.result]}</td><td>${nl2br(v.note)}</td></tr>`).join('')}</table>`:'<p>尚無複查紀錄</p>'}
    <h3>五、結案確認</h3><table>
      ${row('結案依據',r.closeBasis==='other'?'其它':'複查通過')}${row('結案人員（品管）',esc(r.closedBy))}${row('結案日期',fmtDate(r.closedDate))}${row('結案說明',nl2br(r.closeNote))}</table>
    <div class="sign"><span>負責單位簽名：＿＿＿＿＿＿＿＿</span><span>品保：＿＿＿＿＿＿＿＿</span><span>品管確認：＿＿＿＿＿＿＿＿</span></div>`;
  setTimeout(()=>window.print(), 100);
}

/* ---------- 啟動 ---------- */
/* 捲動超過一點點就把標題列縮小 */
(function(){
  let on = false;
  const tick = () => { const c = window.scrollY > 40; if(c!==on){ on = c; const h = document.querySelector('header.topbar'); if(h) h.classList.toggle('compact', c); } };
  window.addEventListener('scroll', tick, {passive:true}); tick();
})();
(async function init(){
  try{ const lg = document.querySelector('header .logo'); if(lg) $('#sbLogo').src = lg.src; }catch(e){}
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }
  catch(e){ say('注意：目前瀏覽器無法保存資料（可能是無痕模式或已封鎖網站資料），關閉後資料會遺失。'); }
  purgeExpired();
  optUnify();
  $('#app').innerHTML = '<div class="empty">資料載入中…</div>';
  if(await phOpen()){
    try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
    const hasOld = records.some(r => (r.photos||[]).concat(r.improvePhotos||[]).some(p => typeof p==='string' && p.startsWith('data:')));
    if(hasOld){
      $('#app').innerHTML = '<div class="empty">第一次使用新版：正在把照片搬到大容量儲存空間，請稍候，不要關閉頁面…</div>';
      const before = JSON.stringify(records);
      try{ if(await phMoveOut(records)) persistAll(); }
      catch(e){ records = JSON.parse(before); say('照片搬移沒有完成，資料維持原樣，下次打開會再試一次。'); }
    }
    phCleanup();
  }
  showList();
})();
