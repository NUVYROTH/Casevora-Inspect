}


/* ---------- 統計報表（月／季／年） ---------- */
let statView='month', statY=null, statM=null, statQ=null;
const pad2 = n => String(n).padStart(2,'0');
const lastDay = (y,m) => new Date(y,m,0).getDate();
function stInit(){ if(statY===null){ const t=today(); statY=+t.slice(0,4); statM=+t.slice(5,7); statQ=Math.ceil(statM/3); } }
function stA(){ return statView==='month'?statM:statView==='quarter'?statQ:0; }
function periodRange(view,y,a){
  if(view==='month') return {start:`${y}-${pad2(a)}-01`, end:`${y}-${pad2(a)}-${pad2(lastDay(y,a))}`, label:`${y} 年 ${a} 月`, short:`${a}月`, y, a};
  if(view==='quarter'){ const m1=(a-1)*3+1, m3=a*3; return {start:`${y}-${pad2(m1)}-01`, end:`${y}-${pad2(m3)}-${pad2(lastDay(y,m3))}`, label:`${y} 年第 ${a} 季（${m1}～${m3} 月）`, short:`${y} Q${a}`, y, a}; }
  return {start:`${y}-01-01`, end:`${y}-12-31`, label:`${y} 年`, short:`${y}`, y, a:0};
}
function shiftPeriod(view,y,a,k){
  if(view==='month'){ const t=y*12+(a-1)+k; return {y:Math.floor(t/12), a:t%12+1}; }
  if(view==='quarter'){ const t=y*4+(a-1)+k; return {y:Math.floor(t/4), a:t%4+1}; }
  return {y:y+k, a:0};
}
/* 實際完成日：第一次「複查通過」的日期；若是以「其它」依據結案，則用結案日 */
function doneDate(r){
  const p = r.reviews.find(v=>v.result==='pass' && v.date);
  if(p) return p.date;
  return (r.closed && r.closedDate) ? r.closedDate : '';
}
function daysBetween(a,b){ const [y1,m1,d1]=a.split('-').map(Number), [y2,m2,d2]=b.split('-').map(Number); return Math.round((new Date(y2,m2-1,d2)-new Date(y1,m1-1,d1))/86400000); }
function statCompute(range){
  const t = today();
  const L = range.end < t ? range.end : t;               // 本期最後一個有效日
  const nx = addDays(range.end,1), asOf = nx < t ? nx : t; // 期限早於此日 = 已過期
  const inP = d => d && d >= range.start && d <= range.end;
  const done = r => { const c=doneDate(r); return c && c<=L; };
  const late = r => r.deadline && r.deadline < asOf;
  const cases = live().filter(r=>inP(r.foundDate));
  const g = {done:[], open:[], over:[]};
  cases.forEach(r=>{
    const c = doneDate(r);
    if(c && c<=L && (!r.deadline || c<=r.deadline)) g.done.push(r);
    else if(late(r)) g.over.push(r);
    else g.open.push(r);
  });
  const cross = live().filter(r=>r.foundDate && r.foundDate<range.start && !done(r) && late(r))
      .sort((a,b)=>a.deadline<b.deadline?-1:1);
  const dm = new Map();
  records.filter(r=>r.deleted).forEach(r=>dm.set(r.id,r.foundDate));
  tombs.forEach(tb=>dm.set(tb.id,tb.foundDate));
  let del = 0; dm.forEach(fd=>{ if(inP(fd)) del++; });
  const area = new Map();
  cases.forEach(r=>{ const k=(r.area||'').trim()||'（未填）'; area.set(k,(area.get(k)||0)+1); });
  const areaList = [...area.entries()].sort((a,b)=>b[1]-a[1] || (a[0]<b[0]?-1:1));
  const overSet = new Set(g.over.map(r=>r.id));
  const types = TYPES.concat([['','未選類別','']]).map(([k,n])=>{
    const rs = cases.filter(r=>(r.defType||'')===k);
    return {name:k?k+' '+n:n, n:rs.length, over:rs.filter(r=>overSet.has(r.id)).length};
  }).filter(x=>x.n>0).sort((a,b)=>b.n-a.n || b.over-a.over);
  const cats = [['general',CAT.general],['schedule',CAT.schedule],['major',CAT.major],['', '未判定']].map(([k,n])=>{
    const rs = cases.filter(r=>(r.category||'')===k);

async function chartPng(fig){
  const sv = fig.querySelector('svg[role=img]'); if(!sv) throw new Error('沒有圖表');
  const title = fig.dataset.title || '', vb = sv.viewBox.baseVal, W = vb.width, H = vb.height, tH = 36, lH = 30;
  const F = 'Microsoft JhengHei,PingFang TC,Noto Sans TC,sans-serif';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W+24}" height="${H+tH+lH}" viewBox="0 0 ${W+24} ${H+tH+lH}" font-family="${F}"><rect width="100%" height="100%" fill="#ffffff"/>`+
    `<text x="14" y="25" font-size="15" font-weight="700" fill="#16213a">${esc(title)}</text>`+
    `<g transform="translate(12,${tH})">${sv.innerHTML}</g>`+
    `<line x1="20" y1="${H+tH+16}" x2="46" y2="${H+tH+16}" stroke="#16213a" stroke-width="3"/><text x="52" y="${H+tH+20}" font-size="13" fill="#16213a">總件數（新增）</text>`+
    `<line x1="170" y1="${H+tH+16}" x2="196" y2="${H+tH+16}" stroke="#c0392b" stroke-width="3" stroke-dasharray="7 4"/><text x="202" y="${H+tH+20}" font-size="13" fill="#16213a">逾期件數</text></svg>`;
  const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); await img.decode();
  const k = 2, c = document.createElement('canvas'); c.width = (W+24)*k; c.height = (H+tH+lH)*k;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
  return await new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error('圖片產生失敗')),'image/png'));
}

/* ---------- 統計報表下載成 Word（.docx）：把畫面上的統計內容轉成 Word，claude.ai 版也能用 ---------- */
function zipStore(files, type='application/vnd.openxmlformats-officedocument.wordprocessingml.document'){

  const crc = d => { let c = 0xFFFFFFFF; for(let i=0;i<d.length;i++) c = T[(c^d[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
  const enc = new TextEncoder(), parts = [], cen = []; let off = 0;
  const u16 = v => [v&255, v>>>8&255], u32 = v => [v&255, v>>>8&255, v>>>16&255, v>>>24&255];
  files.forEach(([name, data]) => {
    const nb = enc.encode(name), d = typeof data==='string' ? enc.encode(data) : data, c = crc(d);
    const common = [...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(c), ...u32(d.length), ...u32(d.length), ...u16(nb.length), ...u16(0)];
    const loc = new Uint8Array([...u32(0x04034b50), ...common]);
    parts.push(loc, nb, d);
    cen.push(new Uint8Array([...u32(0x02014b50), ...u16(20), ...common, ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off)]), nb);
    off += loc.length + nb.length + d.length;
  });
  const cenLen = cen.reduce((a,b)=>a+b.length,0);
  return new Blob([...parts, ...cen, new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(cenLen), ...u32(off), ...u16(0)])],
    {type});
}
function wx(t){ return String(t??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function wRun(t, o={}){ return `<w:r><w:rPr><w:rFonts w:ascii="Microsoft JhengHei" w:hAnsi="Microsoft JhengHei" w:eastAsia="Microsoft JhengHei"/>${o.b?'<w:b/>':''}${o.color?`<w:color w:val="${o.color}"/>`:''}<w:sz w:val="${o.sz||21}"/></w:rPr><w:t xml:space="preserve">${wx(t)}</w:t></w:r>`; }
function wPara(t, o={}){ return `<w:p><w:pPr>${o.keep?'<w:keepNext/>':''}${o.jc?`<w:jc w:val="${o.jc}"/>`:''}<w:spacing w:before="${o.before||0}" w:after="${o.after??80}"/>${o.shade?`<w:shd w:val="clear" w:color="auto" w:fill="${o.shade}"/>`:''}</w:pPr>${wRun(t,o)}</w:p>`; }
function wTable(rows, head=true){
  const B = ['top','left','bottom','right','insideH','insideV'].map(k=>`<w:${k} w:val="single" w:sz="4" w:color="C9BDA6"/>`).join('');
  return `<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>${B}</w:tblBorders><w:tblCellMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr>`+
    rows.map((r,i)=>`<w:tr>${r.map(c=>`<w:tc><w:tcPr>${head&&i===0?'<w:shd w:val="clear" w:color="auto" w:fill="F3ECE0"/>':''}</w:tcPr>${wPara(c,{b:head&&i===0, sz:19, after:0})}</w:tc>`).join('')}</w:tr>`).join('')+'</w:tbl>'+wPara('',{after:60});
}
async function dlStatsWord(){
  const box = $('#statBody'), btn = $('#wordBtn'); if(!box) return;
  btn.disabled = true; const old = btn.textContent; btn.textContent = '產生中…';
  try{
    const rg = periodRange(statView,statY,stA()), name = statView==='month'?'月報':statView==='quarter'?'季報':'年報';
    const txt = el => el.textContent.replace(/\s+/g,' ').trim();
    let body = wPara('衛生缺失統計'+name, {b:1, sz:32, jc:'center', after:60}) + wPara(rg.label+'　產出日期：'+fmtDate(today()), {jc:'center', sz:20, color:'5D6779', after:200});
    const media = [];
    for(const el of box.children){
      if(el.classList.contains('st-sum')) body += wPara(txt(el), {b:1, shade:el.classList.contains('warn')?'FDECEA':'E6F5EC', after:120});
      else if(el.classList.contains('st-tiles')){ const t=[...el.querySelectorAll('.st-tile')]; body += wTable([t.map(x=>txt(x.querySelector('.l'))), t.map(x=>txt(x.querySelector('.n'))+' 件'), t.map(x=>txt(x.querySelector('.d')))]); }
      else if(el.classList.contains('st-extra')) body += wTable([...el.querySelectorAll('.box')].map(x=>[txt(x.querySelector('.l')), txt(x.querySelector('.n'))+' 件', txt(x.querySelector('.st-note'))]), false);
      else if(el.classList.contains('st-note')) body += wPara(txt(el), {sz:17, color:'5D6779'});
      else if(el.classList.contains('st-sec')) body += wPara(txt(el), {b:1, sz:24, before:200, after:80, color:'16213A', keep:1});
      else if(el.classList.contains('st-bar')){
        /* 區域長條：連續幾列合成一張表 */
        if(!(el.previousElementSibling && el.previousElementSibling.classList.contains('st-bar'))){
          const rows=[['缺失區域','件數']]; let n=el; while(n && n.classList.contains('st-bar')){ rows.push([txt(n.children[0]), txt(n.querySelector('.v'))]); n=n.nextElementSibling; }
          body += wTable(rows);
        }
      }
      else if(el.matches('table') || (el.matches('.st-scroll') && el.querySelector('table'))){ const tb=el.matches('table')?el:el.querySelector('table'); body += wTable([...tb.rows].map(r=>[...r.cells].map(txt))); }
      else if(el.classList.contains('st-block')){
        const sec = el.querySelector('.st-sec'), fig = el.querySelector('figure');
        if(sec) body += wPara(txt(sec), {b:1, sz:24, before:200, after:80, color:'16213A', keep:1});
        try{
          const blob = await chartPng(fig), png = new Uint8Array(await blob.arrayBuffer());
          const bm = await createImageBitmap(blob), cx = 5040000, cy = Math.round(cx*bm.height/bm.width), id = media.length+1;
          media.push(png);
          body += `<w:p><w:r><w:drawing><wp:inline><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${id}" name="chart${id}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${id}" name="chart${id}.png"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rImg${id}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
        }catch(e){ body += wPara('（趨勢圖無資料）', {sz:19, color:'5D6779'}); }
      }
      else if(txt(el)) body += wPara(txt(el), {sz:19, color:'5D6779'});
    }
    body += wPara('Casevoras 衛生缺失追蹤助手．本報表依本機資料產生', {sz:16, color:'888888', before:120, jc:'center'});
    const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr></w:body></w:document>`;
    const files = [
      ['[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>'],
      ['_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'],
      ['word/_rels/document.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+media.map((_,i)=>`<Relationship Id="rImg${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/chart${i+1}.png"/>`).join('')+'</Relationships>'],
      ['word/document.xml', doc],
      ...media.map((m,i)=>[`word/media/chart${i+1}.png`, m])
    ];
    const fn = `Casevoras_衛生缺失統計${name}_${rg.label}`.replace(/\s+/g,'').replace(/[\\/:*?"<>|：（）]+/g,'_') + '.docx';
    await download(zipStore(files), fn, 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
    flash('已送出下載：Word 報表');
  }catch(e){ say('Word 報表產生失敗，請重試。'); }
  btn.disabled = false; btn.textContent = old;
}

/* ---------- 列印單筆報表 ---------- */
async function printReport(){
  if(inClaude()){ say('claude.ai 版無法開啟列印視窗。請到網址版按「列印／存成 PDF」。'); return; }
  if(dirty && !(await ask('有尚未儲存的修改，列印內容會包含這些修改（但尚未儲存）。要繼續嗎？'))) return;
  const r = cur;
  await preloadPhotos([r]);
  const row = (k,v) => `<tr><th>${k}</th><td>${v||''}</td></tr>`;
  const imgs = arr => arr.length ? arr.map(p=>`<img src="${phSync(p)}">`).join('') : '無';
  $('#print').innerHTML = `
    <h1>衛生缺失改善追蹤紀錄</h1>
    <div style="text-align:center;margin-bottom:10px">編號：${esc(r.id)}　狀態：${statusOf(r).t}${isOverdue(r)?'（逾期）':''}　列印日期：${fmtDate(today())}</div>
    <h3>一、缺失基本資料</h3><table>
      ${row('發現日期',fmtDate(r.foundDate))}${row('缺失區域',esc(r.area))}${row('巡檢人員',esc(r.finder))}
      ${row('缺失類別',esc(typeName(r.defType)||'未選類別'))}${row('缺失等級',esc(CAT[r.category]||'未判定'))}
      ${row('發生情形',[r.consecutive?'相同缺失連續兩天發生':'', r.recurred?'已通知改善後再次發生':''].filter(Boolean).join('；')||'—')}
      ${row('負責單位／人員',esc(ownerText(r)))}${row('改善期限',fmtDate(r.deadline))}
      ${row('已通知對象',esc(r.notifyTarget))}
      ${row('缺失描述',nl2br(r.rawDesc))}
      ${row('缺失照片',imgs(r.photos))}</table>
    <h3>二、缺失單與追蹤要求</h3><table>
      ${row('缺失單編號（＝案件編號）',esc(r.id))}
      ${row('風險控制措施',nl2br(r.riskControl))}${row('發生原因',nl2br(r.causeAnalysis))}${row('預防再發措施',nl2br(r.prevention))}</table>
    <h3>三、實際改善情形</h3><table>
      ${row('如何改善',nl2br(r.improveContent))}${row('預計改善完成日期',fmtDate(r.improveDate))}
      ${row('改善執行單位／人員',esc(improveByText(r)))}${row('改善後照片',imgs(r.improvePhotos))}</table>
    <h3>四、複查紀錄</h3>
    ${r.reviews.length?`<table><tr><th style="width:auto">次數</th><th style="width:auto">日期</th><th style="width:auto">複查人員</th><th style="width:auto">結果</th><th style="width:auto">說明</th></tr>
      ${r.reviews.map((v,i)=>`<tr><td>第${i+1}次</td><td>${fmtDate(v.date)}</td><td>${esc(v.by)}</td><td>${REVIEW_RESULT[v.result]}</td><td>${nl2br(v.note)}</td></tr>`).join('')}</table>`:'<p>尚無複查紀錄</p>'}
    <h3>五、結案確認</h3><table>
      ${row('結案依據',r.closeBasis==='other'?'其它':'複查通過')}${row('結案人員（品管）',esc(r.closedBy))}${row('結案日期',fmtDate(r.closedDate))}${row('結案說明',nl2br(r.closeNote))}</table>
    <div class="sign"><span>負責單位簽名：＿＿＿＿＿＿＿＿</span><span>品保：＿＿＿＿＿＿＿＿</span><span>品管確認：＿＿＿＿＿＿＿＿</span></div>`;
  setTimeout(()=>window.print(), 100);
}

/* ---------- 啟動 ---------- */
/* 捲動超過一點點就把標題列縮小 */
(function(){
  let on = false;
  const tick = () => { const c = window.scrollY > 40; if(c!==on){ on = c; const h = document.querySelector('header.topbar'); if(h) h.classList.toggle('compact', c); } };
  window.addEventListener('scroll', tick, {passive:true}); tick();
})();
(async function init(){
  try{ const lg = document.querySelector('header .logo'); if(lg) $('#sbLogo').src = lg.src; }catch(e){}
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }
  catch(e){ say('注意：目前瀏覽器無法保存資料（可能是無痕模式或已封鎖網站資料），關閉後資料會遺失。'); }
  purgeExpired();
  $('#app').innerHTML = '<div class="empty">資料載入中…</div>';
  if(await phOpen()){
    try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
    const hasOld = records.some(r => (r.photos||[]).concat(r.improvePhotos||[]).some(p => typeof p==='string' && p.startsWith('data:')));
    if(hasOld){
      $('#app').innerHTML = '<div class="empty">第一次使用新版：正在把照片搬到大容量儲存空間，請稍候，不要關閉頁面…</div>';
      const before = JSON.stringify(records);
      try{ if(await phMoveOut(records)) persistAll(); }
      catch(e){ records = JSON.parse(before); say('照片搬移沒有完成，資料維持原樣，下次打開會再試一次。'); }
    }
    phCleanup();
  }
  showList();
})();
