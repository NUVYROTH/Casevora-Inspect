<style>
:root{
  /* Casevoras 品牌色：深藍、米色、金色 */
  --bg:#f5efe3; --card:#fffdf8; --ink:#16213a; --muted:#5d6779; --line:#e3d9c6;
  --brand:#16213a; --brand-soft:#f3ece0; --gold:#b8955a; --field:#c9bda6; --warn:#b45309; --warn-soft:#fff4e0;
  --bad:#b42318; --bad-soft:#fdecea; --ok:#167a3e; --ok-soft:#e6f5ec; --info:#1d4f91; --info-soft:#e8f0fb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;font-size:15px;line-height:1.65}
header.topbar{background:var(--brand);color:#fffdf8;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:50;transition:box-shadow .2s}
/* 往下捲動時，標題列縮小並固定在最上方 */
header.topbar.compact{box-shadow:0 2px 10px rgba(0,0,0,.25)}
header.topbar .tbin,header.topbar .logo,header.topbar .bname,header.topbar .bsub{transition:all .2s}
header.topbar.compact .tbin{padding-top:6px;padding-bottom:6px}
header.topbar.compact .logo{width:42px;height:42px}
header.topbar.compact .bname{font-size:28px}
header.topbar.compact .bsub{font-size:13px;letter-spacing:.12em}
@media(max-width:600px){header.topbar.compact .tbmeta{display:none}}
@media (prefers-reduced-motion:reduce){header.topbar,header.topbar .tbin,header.topbar .logo,header.topbar .bname,header.topbar .bsub{transition:none}}
.tbin{max-width:1320px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:16px}
.logo{width:76px;height:76px;border-radius:50%;flex:none;display:block;box-shadow:0 0 0 1px rgba(184,149,90,.5),0 2px 8px rgba(0,0,0,.35)}
.bname{font:400 46px/1.05 "Pinyon Script",Georgia,"Times New Roman",serif;color:#e2c891;letter-spacing:.01em}
.bsub{font-size:17px;font-weight:700;opacity:.92;letter-spacing:.18em;margin-top:2px}
.tbmeta{font-size:12.5px;opacity:.85;display:flex;align-items:center;gap:10px}
.ver{border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:0 8px;font-size:11.5px}
@media(max-width:600px){.logo{width:60px;height:60px}.bname{font-size:38px}.bsub{font-size:14.5px;letter-spacing:.14em}}
.alert{display:flex;gap:12px;align-items:flex-start;background:#fdecea;color:#8a1c12;border:1px solid #e3a59c;border-left:5px solid #8a1c12;border-radius:8px;padding:12px 14px;margin:6px 0 12px;font-size:14px;line-height:1.7}
.alert1{align-items:center;flex-wrap:wrap}
.alert1 .a1{flex:1 1 260px;font-weight:700}
.alink{flex:none;background:transparent;border:1px solid #e3a59c;color:#8a1c12;font-size:13px;padding:4px 10px}
.alink:hover{background:#fff}
.gh{margin:10px 0 4px;font-size:14px;border-left:3px solid var(--gold);padding-left:6px}
#guide summary{font-size:15px}
.alert .atitle{font-weight:700;font-size:15px;color:var(--ink);margin-bottom:2px}
.atag{flex:none;background:#8a1c12;color:#fff;font-weight:700;font-size:12.5px;border-radius:4px;padding:2px 8px;margin-top:2px;letter-spacing:.1em}
.honest{font-weight:700;font-size:17px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:8px 12px;margin-bottom:16px}
main{max-width:1440px;margin:0 auto;padding:20px 16px 100px}
/* 版型：左側選單＋內容（比照 Casevoras 客訴分析助手） */
.appg{display:grid;grid-template-columns:184px minmax(0,1fr);gap:18px;align-items:start}
.appg>*{min-width:0}
.snav{position:sticky;top:84px;height:calc(100vh - 104px);min-height:300px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px}
.snav button{display:flex;align-items:center;gap:10px;text-align:left;border:0;border-radius:10px;padding:10px 12px;background:none;color:var(--muted);font-weight:600}
.snav button:hover{background:#f3ece0;color:var(--ink)}
.snav button.on,.snav button.on:hover{background:var(--brand);color:#fffdf8}
.snav .ic{width:26px;height:26px;border-radius:8px;background:#efe6d5;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none;color:var(--ink)}

button.pillnew:hover{background:#22304f}
@media(max-width:899px){ .hc-mode{align-items:flex-start} .hc-bot .ptools{justify-content:flex-start} }
/* 清單頁標題區：左邊標題，右邊提醒＋本機資料模式，下面按鈕 */
.hhead{display:flex;gap:16px 20px;flex-wrap:wrap;align-items:stretch;margin:0 0 14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.hhead .ptitle{flex:1 1 380px;min-width:0}
.hcrumb{font-size:13px;color:var(--muted);margin-top:6px}
.hcrumb b{color:var(--ink)}
.hright{flex:1 1 520px;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.hstat{display:flex;align-items:center;gap:10px}
.hstat .alert{flex:1;min-width:0;margin:0}
.hright .ptools{justify-content:flex-end}
@media(max-width:899px){ .hstat{flex-wrap:wrap} .hstat .alert{flex:1 1 100%} .hstat .lbadge{order:-1} .hright .ptools{justify-content:flex-start} }
.phead .ptitle{flex:1 1 440px;min-width:0}
.ptools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
button.lite{background:var(--card);border-color:var(--line);color:var(--ink);font-size:13.5px;padding:6px 12px}
button.lite:hover{background:#f3ece0}
button.pnew{font-size:13.5px;padding:6px 12px;border:1px solid var(--brand)}
.case{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;background:var(--card)}
.case .cinfo{display:flex;gap:12px;align-items:flex-start;flex:1 1 100%;min-width:0}
.case .cinfo>div{min-width:0}
.case .xsel{flex:none;width:18px;height:18px;margin:4px 0 0;accent-color:var(--brand)}
.case .cths{display:flex;gap:6px;flex:none}
.case .cth{width:64px;height:64px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-align:center;line-height:1.3}
.case .cth img{width:100%;height:100%;object-fit:cover;display:block}
.case .tg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.tag{font-size:12px;background:var(--bg);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:0 9px}
.tag.cat{color:var(--brand);border-color:var(--brand)}
.tag.lv-schedule{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.lv-major{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;font-size:12px;color:var(--muted);margin:4px 0 2px}
.steps span.done{color:var(--ink)}
.steps span.done::before{content:"✓ "}
.steps span.now{color:#fffdf8;background:var(--brand);border-radius:10px;padding:1px 8px;font-weight:600}
.steps span.now.trk{background:var(--warn)}
.steps i{font-style:normal;color:var(--gold)}
.case .ti{font-weight:600;font-size:16px;cursor:pointer;overflow-wrap:anywhere}
.case .mt{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:0 14px}
.case .mt span{white-space:nowrap}
.case .ac{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-left:auto}
.case .ac button{padding:5px 12px;font-size:13px}
.age{font-size:12.5px;font-weight:700;white-space:nowrap}
.age.late{color:var(--bad)}
.age.ok{color:var(--muted)}
.selall{display:inline-flex;align-items:center;gap:6px;font-size:14px}
.selall input{width:18px;height:18px;accent-color:var(--brand)}
.flowh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.flowh b{font-size:16px}
.flowh span{font-size:13px;color:var(--muted)}
.fsteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.fstep{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff}
.fno{font-size:11.5px;font-weight:800;letter-spacing:.12em;color:var(--gold);margin-bottom:6px}
.fstep b{font-size:14.5px}
.fstep p{margin:6px 0 0;font-size:12.5px;color:var(--muted);line-height:1.6}
@media(min-width:900px){
  header.topbar{display:none}
  body{padding-left:248px}
  .appg{display:block}
  .sbrand{display:flex;align-items:center;gap:12px;padding:6px 8px 18px}
  .sbrand img{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 1px rgba(184,149,90,.6)}
  .sbn{font:400 28px/1 "Pinyon Script",Georgia,serif;color:#e2c891}
  .sbs{font-size:10.5px;letter-spacing:.16em;color:#9fb0cf;margin-top:4px}
  .slab{display:block;font-size:11px;letter-spacing:.14em;color:#8796b3;padding:0 10px 8px}
  .sfoot{display:block;border-top:1px solid rgba(255,255,255,.12);margin-top:12px;padding:12px 10px 4px;font-size:12px;line-height:1.7;color:#9fb0cf}
  .sfoot b{color:#d6deec;font-weight:600;letter-spacing:.04em}
  .snav{position:fixed;left:0;top:0;bottom:0;width:248px;height:auto;min-height:0;z-index:20;overflow:auto;background:#1a2a44;border:0;border-radius:0;padding:18px 14px}
  .snav button{color:#d6deec;padding:11px 12px;white-space:nowrap}
  .snav button:hover{background:rgba(255,255,255,.08);color:#fff}
  .snav button.on,.snav button.on:hover{background:#2c4166;color:#fff}
  .snav .ic{background:rgba(255,255,255,.1);color:#fff}
  .snav button.on .ic{background:var(--gold)}
  .crumb{margin:-4px -2px 14px;padding:0 0 12px;border-bottom:1px solid var(--line)}
  .savebar{left:248px}
  .split .side{top:16px;max-height:calc(100vh - 100px)}
}
@media(max-width:899px){ .crumb{display:none} .phead .ptitle{flex-basis:100%} .ptools{justify-content:flex-start} }
@media(max-width:600px){ .kpi{padding-right:40px} .kic{width:26px;height:26px;top:10px;right:8px} .kic svg{width:15px;height:15px} .ptitle.big h1{font-size:24px} .eyebrow{font-size:11px} .eyebrow.eb2{font-size:11px;letter-spacing:.14em;gap:10px} .eyebrow.eb2::before{width:26px} .case .cth{width:52px;height:52px} }
.seg{display:inline-flex;gap:2px;background:#f3ece0;border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 18px;font-weight:700;color:var(--muted)}
.seg button.on,.seg button.on:hover{background:var(--brand);color:#fffdf8}
.chartfig{margin:0}
.donut{display:flex;justify-content:center}
.dleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);margin-top:6px}
.dleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:minmax(70px,140px) 1fr 30px;gap:8px;align-items:center;font-size:13px;margin:7px 0}
.hb .b{height:12px;background:#efe6d5;border-radius:4px}
.hb .b i{display:block;height:12px;border-radius:0 4px 4px 0;background:var(--brand);min-width:3px}
.hb .v{text-align:right;font-weight:700}
input.lsearch{background:#f3ece0;border-color:var(--line)}
.lfilter{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 6px}
.lfilter select{background:#f3ece0;border-color:var(--line)}
.lcount{font-size:13px;color:var(--muted);margin:2px 0 8px}
@media(max-width:600px){ .lfilter{grid-template-columns:1fr 1fr} }
#tableBox table{min-width:760px}
#tableBox td.nw{white-space:nowrap}
#tableBox td.desc{min-width:140px}
.lv{display:inline-block;margin-top:3px;padding:0 7px;border-radius:999px;font-size:11.5px;font-weight:700;background:#efe7d8;color:var(--ink)}
.lv-schedule{background:var(--warn-soft);color:var(--warn)}
.lv-major{background:var(--bad-soft);color:var(--bad)}
.lv-none{color:var(--muted)}
.chip{font-size:13px;padding:4px 10px;border-radius:999px;background:#f3ece0;text-align:left}
.aires .sheet{border:1px solid var(--line);border-top:3px solid var(--brand);border-radius:8px;background:#fff;padding:10px 12px;margin-top:10px}
.aires .sheet-t{font-weight:700;margin-bottom:6px}
.aires .draft{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.filters select{width:auto;padding:6px 8px}
.pager{margin-top:10px}
.pager select{width:auto;padding:4px 6px}
/* 案件頁：電腦上左右並排（左：案件內容，右：文字整理），手機上下排列 */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
main:has(.split){max-width:1320px}
.split .side{position:sticky;top:76px;max-height:calc(100vh - 150px);overflow:auto}
@media (max-width:900px){ .split{grid-template-columns:1fr} .split .side{position:static;max-height:none;overflow:visible} }
#print{display:none}

/* ---------- 統計頁 ---------- */
.st-head{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.st-title{font-size:20px;font-weight:700;margin:0}
.st-sum{border-radius:8px;padding:12px 14px;font-size:16px;font-weight:700;margin:8px 0 14px;line-height:1.5}
.st-sum.ok{background:var(--ok-soft);color:#0f5a2d}
.st-sum.warn{background:var(--warn-soft);color:#7a3d06}
.st-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.st-tile{border:1px solid var(--line);border-radius:10px;padding:12px 10px;text-align:center;background:#fff}
.st-tile .n{font-size:34px;font-weight:700;line-height:1.1}
.st-tile .l{font-size:14px;font-weight:700;margin-top:4px}
.st-tile .d{font-size:12px;color:var(--muted);margin-top:2px}
.st-tile.t-done .n{color:var(--ok)} .st-tile.t-open .n{color:var(--info)} .st-tile.t-over .n{color:var(--bad)}
.st-tile.t-over{border-color:#e7b4ae;background:var(--bad-soft)}
.st-extra{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.st-extra .box{flex:1 1 240px;border:2px dashed #e7b4ae;border-radius:10px;padding:10px 14px;background:#fff}
.st-extra .box.del{border-color:var(--field)}
.st-extra .n{font-size:26px;font-weight:700;color:var(--bad)} .st-extra .del .n{color:var(--ink)}
.st-extra .l{font-weight:700}
.st-note{font-size:12px;color:var(--muted);margin:2px 0 10px}
.st-sec{margin:18px 0 6px;font-size:16px;font-weight:700;border-left:4px solid var(--brand);padding-left:8px;break-after:avoid}
.st-bar{display:grid;grid-template-columns:minmax(80px,170px) 1fr 44px;gap:8px;align-items:center;margin:4px 0;font-size:14px}
.st-bar .b{background:#efe7d8;border-radius:4px;height:16px}
.st-bar .b i{display:block;height:16px;background:var(--brand);border-radius:4px;min-width:2px}
.st-bar .v{text-align:right;font-weight:700}
.st-chart svg{width:100%;min-width:560px;height:auto;display:block}
.st-scroll{overflow-x:auto}
.st-leg{display:flex;gap:16px;font-size:13px;margin:4px 0}
.st-leg span::before{content:"";display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px}
.st-leg .a::before{border-color:var(--brand)} .st-leg .c::before{border-color:var(--bad);border-top-style:dashed}
@media (max-width:640px){ .st-tiles{grid-template-columns:repeat(2,1fr)} .st-tile .n{font-size:30px} }
@page{margin:12mm}
@media print{
  body{background:#fff;font-size:12px}
  header,main,.savebar{display:none!important}
  #print{display:block}
  #print h1{font-size:18px;text-align:center;margin:0 0 4px}
  #print table{font-size:12px;margin-bottom:10px}
  #print th,#print td{border:1px solid #999;padding:5px 6px}
  #print th{background:#eee;width:130px;color:#000}
  #print h3{font-size:14px;margin:12px 0 4px}
  #print img{width:120px;height:120px;object-fit:cover;margin:2px;border:1px solid #ccc}
  .sign{display:flex;justify-content:space-between;margin-top:30px}
  #print .st-tile,#print .st-extra .box,#print .st-sum{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print .st-bar .b i,#print .st-chart svg{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print .st-table th,#print .st-table td{border:1px solid #999;padding:4px 6px}
  #print .st-table th{width:auto;background:#eee}
  #print .st-chart svg{min-width:0;max-height:300px}
  #print .st-block{break-inside:avoid}
  #print .dlbtn{display:none}
  #print .st-scroll{overflow:visible}
  #print .st-sec,#print .st-chart,#print .st-bar{break-inside:avoid}
}
</style>

<script>
/* =========================================================

const KEY = 'qaHygieneTracker_v1';
const KEY_T = 'qaHygieneTracker_v1_tombs';

let tombs = loadTombs();
let trashSel = new Set();
let listSel = new Set();

let dirty = false;   // 是否有未儲存的修改

function loadAll(){

}

    return false;
  }

function storageUsedMB(){
  try{ return ((localStorage.getItem(KEY)||'').length*2/1024/1024).toFixed(2); }catch(e){ return '?'; }
}

/* =========================================================
   照片：存在瀏覽器的大容量空間 IndexedDB（一樣只在這台電腦、這個瀏覽器）
   案件資料裡只記「ph:編號」，照片本身另外存；不能用 IndexedDB 時，照樣存在案件資料裡
   ========================================================= */
const PH = { db:null, ok:false, cache:new Map() };
const isRef = p => typeof p==='string' && p.startsWith('ph:');
function phOpen(){
  return new Promise(res => {
    try{
      const rq = indexedDB.open('qaHygienePhotos', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('p');
      rq.onsuccess = () => { PH.db = rq.result; PH.ok = true; res(true); };
      rq.onerror = () => res(false); rq.onblocked = () => res(false);
    }catch(e){ res(false); }
  });
}
function phReq(mode, fn){
  return new Promise((res, rej) => {
    try{ const r = fn(PH.db.transaction('p', mode).objectStore('p')); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
    catch(e){ rej(e); }
  });
}
function phNewId(){ return 'ph:' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8); }
async function phPut(id, data){ await phReq('readwrite', st => st.put(data, id)); PH.cache.set(id, data); }
async function phGet(id){
  if(!isRef(id)) return id;
  if(PH.cache.has(id)) return PH.cache.get(id);
  if(!PH.ok) return '';
  try{ const v = await phReq('readonly', st => st.get(id)) || ''; if(v) PH.cache.set(id, v); return v; }catch(e){ return ''; }
}
const phSync = p => isRef(p) ? (PH.cache.get(p) || '') : p;
/* 畫面上的 <img data-ph> 先顯示空白，再從 IndexedDB 補上照片 */
async function hydrate(root){
  const imgs = [...(root||document).querySelectorAll('img[data-ph]')];
  for(const im of imgs){ const v = await phGet(im.dataset.ph); if(v) im.src = v; else im.alt = '（照片找不到）'; }
}
async function preloadPhotos(rs){
  await Promise.all(rs.flatMap(r => r.photos.concat(r.improvePhotos)).filter(isRef).map(phGet));
}
/* 舊資料：把存在案件資料裡的照片搬進 IndexedDB */
async function phMoveOut(list){
  let moved = 0;
  for(const r of list){
    for(const f of ['photos','improvePhotos']){
      const arr = r[f] || [];
      for(let i=0;i<arr.length;i++){
        if(typeof arr[i]==='string' && arr[i].startsWith('data:')){ const id = phNewId(); await phPut(id, arr[i]); arr[i] = id; moved++; }
      }
    }
  }
  return moved;
}
/* 刪掉沒有任何案件用到的照片（一天內新增的先不刪，可能是別的分頁還沒儲存的） */
async function phCleanup(){
  try{
    const used = new Set(records.flatMap(r => (r.photos||[]).concat(r.improvePhotos||[])).filter(isRef).concat(MAPD.maps.map(m=>m.img)));
    const keys = await phReq('readonly', st => st.getAllKeys());
    const dayAgo = Date.now() - 86400000;
    for(const k of keys){
      const t = parseInt(String(k).slice(3).split('-')[0], 36);
      if(!used.has(k) && t < dayAgo){ await phReq('readwrite', st => st.delete(k)); PH.cache.delete(k); }
    }
  }catch(e){}
}
async function storageWarn(){
  try{
    if(!navigator.storage || !navigator.storage.estimate || window.__warned) return;
    const e = await navigator.storage.estimate();
    if(e.quota && e.usage/e.quota > 0.8){ window.__warned = true; say('提醒：瀏覽器的儲存空間已用約 80% 以上。請盡快按「下載備份」，並封存舊的已結案案件。'); }
  }catch(e){}
}
async function storageText(){
  const el = $('#usedMB'); if(!el) return;
  try{ const e = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null; el.textContent = e ? (e.usage/1024/1024).toFixed(1)+' MB' : storageUsedMB()+' MB'; }catch(x){ el.textContent = storageUsedMB()+' MB'; }
}

/* ---------- 小工具 ---------- */
const $ = s => document.querySelector(s);
/* 頁面內的提示與確認視窗（claude.ai 版不會顯示瀏覽器的 alert／confirm 視窗） */
function dialog(msg, okText, cancelText){
  return new Promise(res => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="box" role="dialog" aria-modal="true"><div class="msg"></div><div class="row">${cancelText?`<button id="dlgNo">${cancelText}</button>`:''}<button class="primary" id="dlgYes">${okText}</button></div></div>`;
    m.querySelector('.msg').textContent = msg;
    const done = v => { m.remove(); res(v); };
    m.querySelector('#dlgYes').onclick = () => done(true);
    if(cancelText) m.querySelector('#dlgNo').onclick = () => done(false);
    document.body.appendChild(m); m.querySelector('#dlgYes').focus();
  });
}
const ask = msg => dialog(msg, '確定', '取消');
const say = msg => { dialog(msg, '知道了'); };
const inClaude = () => typeof claude !== 'undefined';
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function today(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
/* ---------- 常用選項（使用者自己設定的下拉清單，只存在這個瀏覽器；下載備份會一起帶走） ---------- */
const KEY_O = 'qaHygieneTracker_v1_opts';
const OPT_KINDS = { area:'缺失區域', people:'人員', dept:'單位' };
function optList(a){ return Array.isArray(a) ? [...new Set(a.map(x=>String(x??'').trim()).filter(x=>x && x!=='其它'))] : []; }
function loadOpts(){ let o = {}; try{ o = JSON.parse(localStorage.getItem(KEY_O)||'{}') || {}; }catch(e){}
  return { area:optList(o.area), people:optList(o.people), dept: Array.isArray(o.dept) ? optList(o.dept) : ['生產課','儲運'] }; }
let OPTS = loadOpts();
function saveOpts(){ try{ localStorage.setItem(KEY_O, JSON.stringify(OPTS)); return true; }catch(e){ say('常用選項存不進去，瀏覽器的儲存空間可能已滿。'); return false; } }
/* 下拉選常用；選「其它（自己打字）」才出現輸入框。值仍存在原本的欄位（data-f 或 id） */
function combo(kind, v, attr, ph, dis){
  v = v || '';
  return `<div class="combo" data-kind="${kind}"><select class="cmsel lockable" aria-label="${OPT_KINDS[kind]}常用選項" onchange="comboPick(this)" ${dis?'disabled':''}>${comboOpts(kind, comboSel(kind,v))}</select>
    <div class="cmrow" ${comboSel(kind,v)==='__o'?'':'hidden'}><input type="text" ${attr} value="${esc(v)}" placeholder="${esc(ph||'')}" ${dis?'disabled':''}><button type="button" class="cmadd lockable" onclick="comboAdd(this)" ${dis?'disabled':''}>＋加入常用</button></div></div>`;
}
function comboSel(kind, v){ return v ? (OPTS[kind].includes(v) ? v : '__o') : (OPTS[kind].length ? '' : '__o'); }
function comboOpts(kind, sel){ return `<option value="">— 請選擇 —</option>${OPTS[kind].map(x=>`<option value="${esc(x)}" ${x===sel?'selected':''}>${esc(x)}</option>`).join('')}<option value="__o" ${sel==='__o'?'selected':''}>其它（自己打字）</option>`; }
function comboPick(sel){
  const row = sel.closest('.combo').querySelector('.cmrow'), inp = row.querySelector('input'), other = sel.value==='__o';
  row.hidden = !other;
  inp.value = other ? '' : sel.value;
  inp.dispatchEvent(new Event('input', {bubbles:true}));
  if(other) inp.focus();
}
/* 把下拉的選取狀態對回輸入框目前的值（清單變動、程式改值之後用） */
function comboSync(box){
  const kind = box.dataset.kind, inp = box.querySelector('input'), sel = box.querySelector('select'), k = comboSel(kind, inp.value);
  sel.innerHTML = comboOpts(kind, k); box.querySelector('.cmrow').hidden = k!=='__o';
}
function comboAdd(btn){
  const box = btn.closest('.combo'), kind = box.dataset.kind, v = box.querySelector('input').value.trim();
  if(!v){ say('請先在框裡輸入要加入的'+OPT_KINDS[kind]+'。'); return; }
  if(v==='其它'){ say('「其它」不能加入常用。'); return; }
  if(!OPTS[kind].includes(v)){ OPTS[kind].push(v); if(!saveOpts()){ OPTS[kind].pop(); return; } }
  document.querySelectorAll(`.combo[data-kind=${kind}]`).forEach(comboSync);
  flash('已加入常用：'+v);
}
function whoText(d,n){ return [d,n].filter(x=>x&&String(x).trim()).join('／'); }
function ownerText(r){ return whoText(r.ownerDept,r.ownerNote); }
function improveByText(r){ return whoText(r.improveDept,r.improveNote); }
function migrate(r){
  /* 舊的 20 類換成新的 14 類（寫在函式裡，因為載入資料時這個函式會比下面的常數先執行） */
  const V1 = {'01':'01','02':'02','03':'03','04':'03','05':'04','06':'05','07':'06','08':'07','09':'07','10':'08','11':'09','12':'10','13':'10','14':'02','15':'01','16':'11','17':'08','18':'13','19':'12','20':'14'};
  if(r.defType && r.defTypeV===undefined){ r.defType = V1[r.defType] || '14'; r.defTypeV = 2; }
  /* v2 的「14 其他衛生缺失」在 v3 變成 15 */
  if(r.defType && r.defTypeV===2 && r.defType==='14') r.defType = '15';
  r.defTypeV = 3;
  if(r.formalDesc){ r.rawDesc=r.formalDesc; r.formalDesc=''; }
  if(r.owner && !r.ownerDept){ r.ownerDept='其它'; r.ownerNote=r.owner; }
  if(r.improveBy && !r.improveDept){ r.improveDept='其它'; r.improveNote=r.improveBy; }
  delete r.owner; delete r.improveBy; return r;
}
function deptSel(f,label,idAttr,r){
  /* 單位：下拉選常用，選「其它（自己打字）」可輸入，也能「＋加入常用」；舊資料的「其它」照樣顯示 */
  return `<div><label class="f" ${idAttr?`id="${idAttr}"`:''}>${label}</label>${combo('dept', r[f], `data-f="${f}"`, '例：品保課、支援組')}</div>`; }
function cfld(kind, f, label, opt={}){ return `<div><label class="${opt.req?'f req':'f'}">${label}</label>${combo(kind, cur[f], `data-f="${f}"`, opt.ph)}</div>`; }
function addDays(ymd,n){ const [y,m,d]=ymd.split('-').map(Number); const t=new Date(y,m-1,d+n); return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); }
let showDlErr=false;
/* 改善期限預設：限期改善缺失 20 天，其他 7 天（從發現日期起算）；使用者自己改過的日期不會被蓋掉 */
function dlDays(cat){ return cat==='schedule' ? 20 : 7; }
function dlHint(cat){ return cat==='schedule' ? '（限期改善缺失預設 20 天，從發現日期起算）' : '（預設一週改善，從發現日期起算）'; }
function dlIsDefault(r, found){ return !r.deadline || [7,20].some(n => r.deadline===addDays(found,n)); }
function dlApplyDefault(){
  if(!cur.foundDate || !dlIsDefault(cur, cur.foundDate)) return;
  cur.deadline = addDays(cur.foundDate, dlDays(cur.category));
  const el = document.querySelector('[data-f=deadline]'); if(el) el.value = cur.deadline;
}
function dlError(r){ if(!r.deadline) return '請填改善期限'; if(r.foundDate && r.deadline<r.foundDate) return '改善期限不能早於發現日期'; return ''; }
function fmtDate(s){ if(!s) return ''; const [y,m,d]=s.split('-'); return `${y}/${m}/${d}`; }
/* 搜尋欄輸入日期時，比對發現日期：2026/10/26、10/26、2026/10（整月）；/ - . 都可以 */
function dateQuery(q){
  const m = q.match(/^(\d{1,4})[\/\-.](\d{1,2})(?:[\/\-.](\d{1,2}))?$/); if(!m) return null;
  const a=+m[1], b=+m[2], c=m[3]?+m[3]:0;
  const eq = (y,mo,d) => s => { if(!s) return false; const [Y,M,D]=s.split('-').map(Number); return (!y||Y===y) && M===mo && (!d||D===d); };
  if(c) return eq(a,b,c);
  if(m[1].length===4) return eq(a,b,0);
  return eq(0,a,b);
}
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }

/* 缺失等級（嚴重程度，由品管判定） */
const CAT = {
  general:  '一般缺失（可立即改善）',

};
/* 缺失類別（屬於哪一類，必填）。v3＝15 類；舊的 20 類（v1）、14 類（v2）在載入時自動換成新編號 */
const TYPES = [
  ['01','人員衛生管理','個人衛生、健康管理、手部清潔、工作服帽、口罩及防護用品穿戴'],

  ['04','清潔與消毒管理','清潔消毒作業、清潔頻率、消毒劑使用、清潔工具管理及效果確認'],
  ['05','病媒防治管理','蚊蠅、蟑螂、鼠害、防蟲設施、捕蟲燈及病媒監測'],
  ['06','原物料與產品衛生','原物料、半成品、成品的污染防止、覆蓋、接觸面及衛生保護'],
  ['07','製程與交叉污染防治','生熟食區隔、作業動線、過敏原、異物防止及製程衛生'],

  ['09','洗手與衛生設施管理','洗手台、消毒設備、洗手用品、廁所、更衣室及相關衛生設施'],
  ['10','廢棄物與排水管理','垃圾清除、廢棄物容器、排水溝、積水、污水及異味'],
  ['11','化學品管理','清潔劑、消毒劑及其他化學品的標示、存放與使用'],
  ['12','外來人員與區域管制','訪客管理、進出管制、區域區隔及進入作業區的衛生要求'],
  ['13','衛生紀錄與制度管理','清潔紀錄、巡檢紀錄、溫度紀錄、衛生程序及教育訓練紀錄'],
  ['14','原物料標示及效期管理','原物料、半成品、成品的標示、有效日期、先進先出、過期或標示不清物料的管制'],
  ['15','其他衛生／管理缺失','無法歸入以上類別的衛生或管理缺失']
];
const typeName = k => { const t = TYPES.find(x=>x[0]===k); return t ? t[0]+' '+t[1] : ''; };
const typeHint = k => { const t = TYPES.find(x=>x[0]===k); return t ? '分類範圍：'+t[2] : '請依缺失內容選擇類別，選好後這裡會顯示分類範圍。'; };
const REVIEW_RESULT = { pass:'通過', fail:'未通過', recur:'缺失再次發生' };

function blankRecord(){
  return {
    id:'', createdAt:'', updatedAt:'',
    foundDate: today(), area:'', finder:'', rawDesc:'', defType:'', defTypeV:3,
    category:'', consecutive:false, recurred:false, areaId:'', locId:'',
    ownerDept:'', ownerNote:'', deadline: addDays(today(),7), notifyTarget:'',
    photos:[],
    riskControl:'', causeAnalysis:'', prevention:'',
    improveContent:'', improveDate: addDays(today(),7), improveDept:'', improveNote:'', improveEvidence:'', improvePhotos:[],
    reviews:[],
    closed:false, closedBy:'', closedDate:'', closeNote:'', closeBasis:''
  };
}
function genId(){
  const d = today().replace(/-/g,'');
  const pre = 'QA-'+d+'-';
  let mx = 0;
  records.concat(tombs).forEach(r => { if(r.id && r.id.startsWith(pre)){ const n = parseInt(r.id.slice(pre.length),10); if(n>mx) mx=n; } });
  return `${pre}${String(mx+1).padStart(3,'0')}`;
}

/* ---------- 規則判斷（依使用者提供之管理程序） ---------- */
function lastReview(r){ return r.reviews.length ? r.reviews[r.reviews.length-1] : null; }
function isOverdue(r){ return !r.closed && r.deadline && r.deadline < today() && !(lastReview(r) && lastReview(r).result==='pass'); }

function statusOf(r){
  if(r.closed) return {t:'已結案', c:'s-closed'};
  const lr = lastReview(r);
  if(lr && lr.result==='pass') return {t:'待品管確認結案', c:'s-ready'};
  if(lr) return {t:'持續追蹤（複查'+REVIEW_RESULT[lr.result]+'）', c:'s-track'};
  if(r.improveContent) return {t:'待複查', c:'s-review'};
  return {t:'待改善', c:'s-todo'};
}
function badges(r){
  const s = statusOf(r);
  let h = `<span class="badge ${s.c}">${s.t}</span>`;
  if(isOverdue(r)) h += ` <span class="badge s-over">逾期</span>`;
  return h;
}

function ruleHints(r){
  const h = [];
  if(!r.category) h.push('尚未選擇缺失等級。等級請由品管／品保人員判定，系統不會自動判斷。');
  if(r.category==='general') h.push('一般缺失：記錄問題、通知相關人員改善，並確認改善結果。');
  if(r.category==='schedule') h.push('需安排時間改善：須記錄負責單位、改善期限及追蹤情形。');
  if(r.category==='major') h.push('重大缺失：應立即通知相關單位，並要求先採取必要的風險控制措施。');
  if(r.consecutive) h.push('相同缺失連續兩天發生：應追蹤改善。');
  if(r.recurred) h.push('已通知改善後再次發生：應確認發生原因，並追蹤改善。');
  return h;
}

let closeBasisUI='pass';
function closeChecks(r){
  const c = [];
  const add = (ok, t) => c.push({ok:!!ok, t});
  add(r.category, '已由品管／品保人員選擇缺失等級');
    if(r.category==='schedule'){ add(ownerText(r), '已填寫負責單位'); add(r.deadline, '已填寫改善期限'); }
  if(r.category==='major') add(r.riskControl.trim(), '已記錄風險控制措施');
  if(r.recurred){ add(r.causeAnalysis.trim(), '已確認發生原因'); ; }
  add(r.improveContent.trim(), '已填寫如何改善');
  const lr = lastReview(r);
  if(closeBasisUI==='other'){ const nt = ($('#clNote') ? $('#clNote').value : r.closeNote)||''; add(nt.trim(), '結案依據選「其它」，並已填寫結案說明'); }
  else add(lr && lr.result==='pass', '最近一次複查結果為「通過」（或下方結案依據選「其它」並填寫說明）');
  return c;
}

function stepsHTML(r){
  const L = ['待改善','待複查','待品管確認','已結案'], t = statusOf(r).t;

  return '<div class="steps">'+L.map((x,i)=>`<span class="${i<now?'done':i===now?'now'+(trk&&i===1?' trk':''):''}">${trk&&i===1?'持續追蹤':x}</span>`).join('<i>›</i>')+'</div>';
}

  if(r.closed || !r.deadline) return '';

async function deleteOne(id){
  const r = records.find(x=>x.id===id); if(!r || r.closed) return;
  if(!(await ask('確定要刪除嗎？'))) return;

  if(!persistAll()){ r.deleted = false; delete r.deletedAt; return; }
  showList(); flash('已移到「最近刪除」');
}
function flowHTML(){
  const S = [['案件建檔','記錄缺失區域、描述、類別與現場照片。'],['通知改善','指定負責單位與改善期限，通知相關人員。'],['改善執行','負責單位完成改善，上傳改善後照片。'],['複查確認','品管複查改善效果，未通過持續追蹤。'],['品管結案','確認結案，納入統計與趨勢回顧。']];
  return `<div class="card"><div class="flowh"><div><b>標準處理流程</b><br><span>用一致流程管理每一筆缺失</span></div><button onclick="openGuide()">查看作業指南 →</button></div>
    <div class="fsteps">${S.map(([t,d],i)=>`<div class="fstep"><div class="fno">STEP ${String(i+1).padStart(2,'0')}</div><b>${t}</b><p>${d}</p></div>`).join('')}</div></div>`;
}
function setSide(v){ document.querySelectorAll('#side button[data-v]').forEach(b=>b.classList.toggle('on', b.dataset.v===v)); }
function tab(k, t, n){ return `<button class="${listFilter===k?'on':''}" onclick="listFilter='${k}';listPage=1;showList()">${t}（${n}）</button>`; }

/* 年份、月份（依發現日期） */
function inPeriod(rs){
  return rs.filter(r => {
    const d = r.foundDate || '';
    if(listYear && d.slice(0,4)!==listYear) return false;
    if(listMonth && d.slice(5,7)!==listMonth) return false;
    if(listType && r.defType!==listType) return false;
    return true;
  });
}
function filteredRecords(){
  let rs = inPeriod(live());
  if(listFilter==='open') rs = rs.filter(r=>!r.closed);
  if(listFilter==='over') rs = rs.filter(isOverdue);
  if(listFilter==='ready') rs = rs.filter(r=>!r.closed && lastReview(r)?.result==='pass');
  if(listFilter==='closed') rs = rs.filter(r=>r.closed);
  const q = listSearch.trim().toLowerCase();
  const dq = dateQuery(q);
  if(dq) rs = rs.filter(r => dq(r.foundDate));
  /* 文字搜尋只看：編號、缺失區域、負責單位／負責人、改善執行單位／執行人 */
  else if(q) rs = rs.filter(r => [r.id,r.area,ownerText(r),improveByText(r)].join(' ').toLowerCase().includes(q));
  return rs.sort((a,b)=> (b.foundDate||'').localeCompare(a.foundDate||'') || b.id.localeCompare(a.id));
}
function renderTable(){
  const all = filteredRecords();

  if(listPage<1) listPage = 1;
  const rs = all.slice((listPage-1)*pageSize, listPage*pageSize);
  const vis = new Set(rs.map(r=>r.id));
  listSel = new Set([...listSel].filter(id=>vis.has(id)));
  if(!rs.length){ $('#tableBox').innerHTML = `<div class="lcount">共 0 件</div><div class="empty">${live().length?'沒有符合條件的紀錄':'目前還沒有紀錄，請按「新增衛生缺失」開始'}</div>`; return; }
  const n = listSel.size;
  const nDel = [...listSel].filter(id=>{ const r=records.find(x=>x.id===id); return r && !r.closed; }).length;
  const allOn = rs.length && rs.every(r=>listSel.has(r.id));
  $('#tableBox').innerHTML = `<div class="lcount">共 ${all.length} 件</div><div class="row" style="margin-bottom:8px">

function thumb(p){ return p ? `<img class="thumb" src="${phSync(p)}" ${isRef(p)?`data-ph="${p}"`:''} alt="">` : '<span class="muted small">—</span>'; }
/* 換頁時，勾選會自動取消（避免刪除看不到的案件） */
function goPage(d){ listPage += d; listSel = new Set(); renderTable(); }
function setPageSize(v){
  pageSize = parseInt(v,10) || 20; listPage = 1; listSel = new Set();
  try{ localStorage.setItem('qaHygieneTracker_pageSize', String(pageSize)); }catch(e){}
  renderTable();
}
function listAll(on){
  const all = filteredRecords();
  all.slice((listPage-1)*pageSize, listPage*pageSize).forEach(r => on ? listSel.add(r.id) : listSel.delete(r.id));
  renderTable();
}
function listToggle(el){ const id=el.dataset.id; if(el.checked) listSel.add(id); else listSel.delete(id); renderTable(); }
async function listDelete(){
  const ids = [...listSel].filter(id=>{ const r=records.find(x=>x.id===id); return r && !r.closed && !r.deleted; });
  if(!ids.length) return;
  if(!(await ask(`確定要刪除選取的 ${ids.length} 筆嗎？`))) return;
  const done = [];
  records.forEach(r => { if(ids.includes(r.id)){ r.deleted = true; r.deletedAt = today(); done.push(r); } });
  if(!persistAll()){ done.forEach(r=>{ r.deleted=false; delete r.deletedAt; }); return; }
  listSel = new Set(); showList(); flash('已移到「最近刪除」（'+done.length+' 筆）');
}

/* 依目前內容更新提醒、條件區塊、狀態等 */
function refresh(){
  const r = cur;
  $('#stBadge').innerHTML = r.id ? badges(r) : '';
  $('#dirtyMark').innerHTML = dirty ? '<span class="dirty">● 有尚未儲存的修改</span>' : '';

  const hints = ruleHints(r);
  let hintHtml = hints.length ? `<div class="notice ${r.category==='major'?'bad':'warn'}"><b>依管理程序應辦理：</b><ul>${hints.map(h=>`<li>${esc(h)}</li>`).join('')}</ul></div>` : '';
  if(isOverdue(r)) hintHtml += `<div class="notice bad"><b>已逾期：</b>改善期限 ${fmtDate(r.deadline)} 已過，尚未複查通過，請持續追蹤。</div>`;
  $('#ruleHint').innerHTML = hintHtml;

  $('#ownerLab').classList.toggle('req', r.category==='schedule');
  $('#deadlineLab').classList.add('req');
  const de = showDlErr ? dlError(r) : '';
  $('#errDeadline').textContent = de;
  document.querySelector('[data-f=deadline]').classList.toggle('bad', !!de);

  const show = { risk: r.category==='major', cause: r.recurred };
  document.querySelectorAll('[data-show]').forEach(el => el.hidden = !show[el.dataset.show]);
  // 未要求時仍可填寫：若已有內容則顯示
  if(!show.risk && r.riskControl) document.querySelector('[data-show=risk]').hidden=false;
  if(!show.cause && r.causeAnalysis) document.querySelector('[data-show=cause]').hidden=false;

  if($('#typeHint')) $('#typeHint').textContent = typeHint(r.defType);
  const rv = $('#rvDate');
  if(rv){ rv.max = today(); if(r.foundDate) rv.min = r.foundDate; else rv.removeAttribute('min'); }
  renderReviews();
  renderClose();
  applyLock();
}

  const allOk = cs.every(c=>c.ok);
  $('#closeArea').innerHTML = `

    <ul class="checks">${cs.map(c=>`<li>${c.ok?'<span style="color:var(--ok)">✔</span>':'<span style="color:var(--bad)">✘</span>'} ${esc(c.t)}</li>`).join('')}</ul>
    ${!r.id?'<div class="notice warn small">請先儲存此筆紀錄。</div>':''}

/* ---------- 照片 ---------- */
function addPhotos(field, input){
  const files = [...input.files]; input.value='';
  addPhotoFiles(field, files);
}
function addPhotoFiles(field, files){
  if(cur.closed){ say('已結案的案件不能再加照片。'); return; }
  if(!files.length) return;
  if(files.some(f=>!/^image\//.test(f.type))){ say('請上傳圖檔'); return; }
  if(cur[field].length + files.length > 10){ say('每個照片區最多 10 張'); return; }
  files.forEach(file => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 900, s = Math.min(1, max/Math.max(img.width,img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        const url = c.toDataURL('image/jpeg',0.6);
        if(PH.ok){
          const id = phNewId();
          phPut(id, url).then(() => { cur[field].push(id); dirty = true; renderPhotoBox(field); refresh(); })
            .catch(() => say('照片存不進去，瀏覽器的儲存空間可能已滿。請先「下載備份」，並封存舊的已結案案件。'));
          return;
        }
        cur[field].push(url);
        dirty = true; renderPhotoBox(field); refresh();
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function tidy(s){
  s = String(s||'').trim().replace(/\s+/g,' ').replace(/,/g,'，').replace(/;/g,'；');
  if(s && !/[。！？.!?]$/.test(s)) s += '。';
  return s;
}
/* 去掉先前範本整理加上的開頭，避免再按時一層層疊上去 */
function stripPrefix(t){
  return String(t||'').trim().replace(/^(?:(?:\d{4}\/\d{1,2}\/\d{1,2}|【待補：發現日期】)於「[^」]*」巡查時發現：\s*)+/, '');
}

const AI_SYS = `你是食品工廠衛生稽核及缺失改善追蹤助手。請像稽核老師開立缺失單一樣，依據現場缺失事實、食品安全風險及工廠管理要求，替下面這筆衛生缺失判斷「缺失類別」、撰寫「缺失描述」，並依「缺失等級判定規則」建議缺失等級。

   範例：「經現場查核，發現丸子於製程作業期間大量掉落地面，顯示產品防護及製程作業衛生管理未落實，存在產品污染風險。請立即管制掉落產品，依不合格品管制程序辦理，並檢討掉落原因及改善措施，以防止類似情形再次發生。」
5. 缺失類別要依「這筆缺失反映出哪一個管理面沒做好」來判斷，不是只看在哪裡發生：

   - 人員穿戴、手部清潔、健康 → 01；冷藏冷凍、溫度、堆放 → 08；紀錄、程序、教育訓練 → 13

7. 「待人工確認事項」列出判定等級或撰寫描述所缺的資訊，包含這五點中沒提供的：①哪裡（區域＋設備或作業點）②看到什麼 ③多少（大概的量就好，例如一點點、一大片；不要求精確數字）④當時狀態（作業中、清洗後或停機）⑤附近有沒有產品、包材或食品接觸面；以及產品是否已隔離、是否流入後續製程或出貨等影響等級的事項。

缺失等級判定規則：
一、缺失等級固定為三種
1. 一般缺失（可立即改善）
2. 限期改善缺失（需安排改善）
3. 重大缺失

不得自行新增等級，不得將缺失類別與缺失等級混為一談。

二、一般缺失（可立即改善）的判定條件
- 缺失程度輕微，影響範圍有限。
- 未發現明顯食品安全危害或重大污染風險。
- 屬偶發性或單一項目異常。
- 現場可立即完成改善。
- 改善後可確認異常已排除，且產品與製程仍在有效管制下。

若涉及食品污染、重要管制失效或其他重大風險，不得只因已立即改善而判定為一般缺失。

三、限期改善缺失（需安排改善）的判定條件
- 缺失涉及設備、設施、作業流程或管理制度不足。
- 需要安排維修、更換、採購、人力調度或跨部門協調。
- 相同缺失重複發生，顯示改善措施或預防再發機制不足。
- 需要原因分析、正式改善計畫、佐證資料或後續複查。
- 目前尚未達重大缺失程度，且暫時管制措施能有效控制食品安全風險。

如暫時管制無法有效控制風險，須立即採取更高強度的風險管制，不得僅以限期改善處理。

四、重大缺失的判定條件
符合下列任一重大風險情形時，應優先評估為重大缺失：
- 已發生嚴重食品污染或存在明確的重大食品安全風險。
- 食品遭受可能危害安全的生物性、化學性或物理性污染。
- 產品掉落地面後被回收投入製程或作為食品使用，造成污染風險。
- HACCP 重要管制點失控，且未依程序採取必要處置。
- 不合格產品未有效隔離，仍可能持續流入後續製程或出貨。
- 關鍵食品安全管制失效，或無法確認受影響產品的安全性。
- 其他依適用法規、驗證基準或工廠程序應立即採取重大風險管制的情形。

重大缺失應立即控制風險，必要時停止相關作業、隔離產品、通報主管，並評估影響範圍及後續處置。

五、判定必須考慮的因素
1. 食品安全風險。
2. 污染程度及污染來源。
3. 食品或食品接觸面的接觸情形。
4. 產品是否已隔離、流入後續製程或出貨。
5. 缺失發生頻率及是否重複發生。
6. 影響範圍及涉及批次。
7. 現有管制措施的有效性。
8. 改善難度及是否需要跨部門處理。
9. 改善及複查結果。
10. 適用法規、CAS 驗證基準、HACCP 計畫及工廠內部規定。

六、重要判定原則
- 不得單憑缺失名稱、數量或是否立即改善決定等級。
- 不得將所有重複缺失自動判定為重大缺失。
- 不得因產品尚未包裝，就直接認定沒有污染風險。
- 不得在缺乏證據時推測污染已發生或已排除。
- 若資訊不足，須列出待確認事項，並建議暫時風險管制及人工複核。
- 重大食品安全風險優先於改善所需時間。
- 缺失等級與改善狀態分開記錄；已改善不等於原缺失等級自動降低。
- 最終分級仍須依適用規範及工廠核定的缺失分級標準確認。

稽核用語庫（撰寫時優先採用這些說法）：
【現場常用】現場髒污→現場環境衛生維護未臻完善；產品掉落地面→製程作業期間產品防護措施未落實，存在污染風險；設備髒污→設備清潔維護未落實，請依規定執行清潔並確認清潔效果；器具未清潔→作業器具清潔及衛生管理未落實；人員未戴帽→作業人員未依規定穿戴防護用品；洗手不確實→作業人員手部清潔及消毒程序未確實執行；生熟食混放→生熟食區隔管理未落實，存在交叉污染風險；原料落地→原物料離地存放及污染防範措施未落實；垃圾未清理→廢棄物清除及環境衛生管理未落實；排水溝髒污→排水設施清潔維護未落實；病媒或鼠跡→病媒防治及監測管理應加強；冷藏溫度異常→冷藏溫度管制未符合內部規定，請確認異常原因並採取改善措施；紀錄漏填→相關作業紀錄填寫不完整，請依規定確實執行並留存紀錄；相同缺失重複發生→相同缺失再次發生，顯示既有改善措施或預防再發機制仍有不足。
【要求立即改善】請立即改善現場異常情形，並落實後續衛生管理。／請立即清除污染源，並確認相關區域及接觸面之清潔狀況。／請依不合格品管制程序辦理，避免異常產品流入後續製程。
【要求限期改善】請於規定期限內完成改善，並提供相關佐證資料。／請針對缺失原因提出改善措施，並落實預防再發。／請評估現行作業方式及管制措施之適切性，提出具體改善方案。
【重複缺失】經查核發現相同缺失再次發生，請重新檢討根本原因。／原改善措施未能有效防止缺失再發，請提出具體矯正及預防措施。／請相關單位加強日常自主檢查，並由權責主管確認執行情形。
缺失類別（後面是分類範圍）：
${TYPES.map(t=>t[0]+' '+t[1]+'：'+t[2]).join('\n')}

const PII_RE = /09\d{2}[-\s]?\d{3}[-\s]?\d{3}|[A-Z][12]\d{8}/;
let aiBusy = false, aiLast = null;
async function aiAnalyze(){
  const r = cur;
  if(aiBusy) return;
  if(!r.rawDesc.trim()){ say('請先填寫「缺失描述」，再按「產生分析」。'); return; }
  const text = [r.area, r.finder, r.rawDesc, r.ownerNote, r.notifyTarget].join(' ');
  if(PII_RE.test(text)){ say('偵測到疑似電話或身分證字號。請先刪除個人資料，改用代稱後再分析。'); return; }
  const st = $('#aiStatus');
  let sample = null;
  try{ sample = (typeof claude!=='undefined' && claude && claude.use) ? await claude.use('sample') : null; }catch(e){}
  if(!sample){ st.textContent = 'AI 分析目前僅限 claude.ai 版使用；此版本請改用「範本整理」或「複製 AI 提示詞」。'; return; }
  aiBusy = true; $('#aiGo').disabled = true; st.textContent = '分析中，請稍候…（第一次使用時，claude.ai 會詢問是否允許）';
  const data = `【發現日期】${r.foundDate?fmtDate(r.foundDate):'（未填）'}\n【目前選的缺失類別】${typeName(r.defType)||'（未選）'}\n【缺失區域】${r.area||'（未填）'}\n【缺失描述】${r.rawDesc}\n【缺失等級（品管判定）】${CAT[r.category]||'（未判定）'}\n【相同缺失連續兩天發生】${r.consecutive?'是':'否'}\n【已通知改善後再次發生】${r.recurred?'是':'否'}\n【負責單位】${r.ownerDept||'（未填）'}\n【改善期限】${r.deadline||'（未填）'}\n【照片】${r.photos.length?r.photos.length+' 張（未傳送，請勿描述照片內容）':'無'}`;
  try{
    const res = await sample(AI_SYS + '\n\n' + data, {cache:false});
    const j = JSON.parse(res.text.replace(/```json|```/g,'').trim().replace(/^[^{]*/,'').replace(/[^}]*$/,''));
    aiLast = j; renderAI(j); st.textContent = '';
  }catch(e){
    st.textContent = e && e.code==='not_granted' ? '你沒有允許使用 AI，所以無法分析。可改用「範本整理」或「複製 AI 提示詞」。'
      : '分析失敗（'+((e&&(e.message||e.code))||'格式錯誤')+'），請重試，或改用「範本整理」。';
  }
  aiBusy = false; $('#aiGo').disabled = false;
}

  const fact = j.fact || j.draft || '';

async function applyAISheet(k, lv){
  const okType = TYPES.some(t=>t[0]===k), okLv = !!CAT[lv];
  const text = $('#aiDraft').value.trim();
  const parts = [okType && cur.defType && cur.defType!==k ? '缺失類別（目前是「'+typeName(cur.defType)+'」）' : '',
    text && cur.rawDesc.trim() ? '缺失描述' : '',
    okLv && cur.category && cur.category!==lv ? '缺失等級（目前是「'+CAT[cur.category]+'」）' : ''].filter(Boolean);
  const msg = (parts.length ? parts.join('、')+'已有內容，套用後會被取代。\n' : '') + (okLv ? '缺失等級將設為「'+CAT[lv]+'」，請確認判定依據合理。\n' : '') + '確定要套用嗎？';
  if(!(await ask(msg))) return;
  if(okType){ cur.defType = k; const el = document.querySelector('[data-f=defType]'); if(el) el.value = k; }
  if(text){ cur.rawDesc = text; document.querySelector('[data-f=rawDesc]').value = text; }
  if(okLv){ cur.category = lv; const el = document.querySelector('[data-f=category]'); if(el) el.value = lv; dlApplyDefault(); const h = $('#dlHint'); if(h) h.textContent = dlHint(lv); }
  dirty = true; refresh(); flash('已套用缺失單，記得按「儲存」');
}
function copyPrompt(){
  const ta = $('#promptText'); ta.select();
  const ok = () => $('#copyMsg').textContent = '已複製到剪貼簿';
  const fallback = () => { try{ document.execCommand('copy') ? ok() : ($('#copyMsg').textContent='請手動全選複製'); }catch(e){ $('#copyMsg').textContent='請手動全選複製'; } };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(ta.value).then(ok, fallback); else fallback();
}

/* ---------- 儲存 / 刪除 ---------- */
function saveRecord(silent){
  const r = cur, miss = [];
  if(!r.foundDate) miss.push('發現日期');
  if(!r.area.trim()) miss.push('缺失區域');
  if(!r.rawDesc.trim()) miss.push('缺失描述');
  if(!r.defType) miss.push('缺失類別');
  if(!r.category) miss.push('缺失等級');
  { const a = areaByName(r.area); r.areaId = a ? a.id : ''; if(r.locId && !(a && mapAreaLocs(a.id).some(l=>l.id===r.locId))) r.locId = ''; }
  if(miss.length){ say('請先填寫：' + miss.join('、')); return false; }
  if(dlError(r)){
    showDlErr = true; refresh();
    const el = document.querySelector('[data-f=deadline]'); el.scrollIntoView({block:'center'}); el.focus();
    return false;
  }
  const isNew = !r.id;
  if(isNew){ r.id = genId(); r.createdAt = new Date().toLocaleString('zh-TW'); }
  r.updatedAt = new Date().toLocaleString('zh-TW');
  const backupList = records.slice();
  const i = records.findIndex(x=>x.id===r.id);
  const copy = JSON.parse(JSON.stringify(r));
  if(i>=0) records[i] = copy; else records.push(copy);
  if(!persist()){ records = backupList; if(isNew) r.id=''; return false; }
  dirty = false;
  try{ const used = (localStorage.getItem(KEY)||'').length + (localStorage.getItem(KEY_T)||'').length;
    if(used > 4000000 && !window.__warned){ window.__warned = true; say('提醒：本機儲存空間已用約 80% 以上。請盡快按「下載備份」，並考慮減少照片。'); } }catch(e){}
  storageWarn();
  if(isNew && !silent){ showList(); flash('已儲存 '+r.id); return true; }
  renderDetail();
  if(!silent) flash('已儲存');
  return true;
}
async function deleteRecord(){
  if(!(await ask('確定要刪除嗎？'))) return;
  const rec = records.find(x=>x.id===cur.id);
  if(!rec) return;
  rec.deleted = true; rec.deletedAt = today();
  if(!persistAll()){ rec.deleted = false; delete rec.deletedAt; return; }
  dirty = false; showList(); flash('已移到「最近刪除」');
}
function flash(t){
  const d = document.createElement('div');
  d.textContent = t;
  d.style.cssText = 'position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#16213a;color:#fffdf8;padding:8px 20px;border-radius:6px;z-index:99;box-shadow:0 2px 8px rgba(0,0,0,.2)';
  document.body.appendChild(d); setTimeout(()=>d.remove(),1500);
}

const RV_PHRASES = [

  '經複查，原缺失仍未改善完成，請持續改善並於期限內重新提出佐證。',

function addRvPhrase(i){
  const ta = $('#rvNote'); if(!ta || ta.disabled) return;
  const t = RV_PHRASES[i]; ta.value = ta.value.trim() ? ta.value.replace(/\s+$/,'') + '\n' + t : t;
  ta.focus();
}
function addReview(){
  if(!cur.improveContent.trim()){ say('請先填寫「如何改善」，再新增複查紀錄。'); return; }
  const date = $('#rvDate').value, result = $('#rvResult').value;
  if(!date || !result){ say('請填寫複查日期與複查結果。'); return; }
  if(date > today()){ say('複查日期不能晚於今天。'); return; }
  if(cur.foundDate && date < cur.foundDate){ say('複查日期不能早於發現日期。'); return; }
  cur.reviews.push({date, by:$('#rvBy').value.trim(), result, note:$('#rvNote').value.trim()});
  if(saveRecord(true)) flash('已新增複查紀錄並儲存'); else cur.reviews.pop();
}
async function delReview(i){
  if(!(await ask(`確定刪除第 ${i+1} 次複查紀錄？`))) return;
  cur.reviews.splice(i,1); saveRecord(true);
}

async function doClose(){
  { const bad=closeChecks(cur).filter(c=>!c.ok); if(bad.length){ say('尚未符合結案條件，還缺：\n- '+bad.map(c=>c.t).join('\n- ')); return; } }
  const by = $('#clBy').value.trim(), date = $('#clDate').value;
  if(!by || !date){ say('請填寫結案確認人員與結案日期。'); return; }
  if(!$('#clConfirm').checked){ say('請勾選品管人員確認聲明。'); return; }
  if(!(await ask('確定要結案嗎？結案後內容會鎖定'))) return;
  Object.assign(cur, {closed:true, closedBy:by, closedDate:date, closeNote:$('#clNote').value.trim(), closeBasis:closeBasisUI});
  const cid=cur.id; if(saveRecord(true)){ showList(); flash('已結案 '+cid); } else cur.closed=false;
}
async function reopen(){
  if(!(await ask('確定撤銷結案？撤銷後此紀錄將回到追蹤狀態，可再修改。'))) return;
  Object.assign(cur, {closed:false, closedBy:'', closedDate:'', closeNote:'', closeBasis:''}); closeBasisUI='pass';
  saveRecord(true); flash('已撤銷結案');
}

function xlsxPack(sheetName, sheet, printTitles, anchors=[], media=[]){

    ['xl/workbook.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${X}spreadsheetml/2006/main" xmlns:r="${ODR}"><sheets><sheet name="${xlText(sheetName)}" sheetId="1" r:id="rId1"/></sheets><definedNames><definedName name="_xlnm.Print_Titles" localSheetId="0">'${xlText(sheetName)}'!${printTitles}</definedName></definedNames></workbook>`],
    ['xl/_rels/workbook.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${REL}"><Relationship Id="rId1" Type="${ODR}/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${ODR}/styles" Target="styles.xml"/></Relationships>`],

/* 照片放進儲存格：每張一格，依原比例縮到 160×120 px 以內；回傳這些格子的 XML */
function xlCell(c,r,v,st){ return `<c r="${xlCol(c)}${r}" t="inlineStr" s="${st}"><is><t xml:space="preserve">${xlText(v)}</t></is></c>`; }
async function xlPhotos(arr, n, base, rn, tag, rid, media, anchors){
  const IMGW = 160, IMGH = 120, out = [];
  for(let i=0;i<n;i++){
    const u = arr[i] ? phSync(arr[i]) : '', b = u && dataUrlBytes(u);
    if(!b){ out.push(xlCell(base+i, rn, i===0 && !arr.length ? '（無照片）' : (i===0 && arr.length ? '（照片找不到）' : ''), 2)); continue; }
    let w = IMGW, h = IMGH;
    try{ const im = new Image(); im.src = u; await im.decode(); const s = Math.min(IMGW/im.naturalWidth, IMGH/im.naturalHeight); w = Math.round(im.naturalWidth*s); h = Math.round(im.naturalHeight*s); }catch(e){}
    media.push(b); const id = media.length;
    anchors.push(`<xdr:oneCellAnchor><xdr:from><xdr:col>${base+i}</xdr:col><xdr:colOff>57150</xdr:colOff><xdr:row>${rn-1}</xdr:row><xdr:rowOff>57150</xdr:rowOff></xdr:from><xdr:ext cx="${w*9525}" cy="${h*9525}"/><xdr:pic><xdr:nvPicPr><xdr:cNvPr id="${id+1}" name="${tag}${i+1}_${xlText(rid)}"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr><xdr:blipFill><a:blip r:embed="rImg${id}"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill><xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${w*9525}" cy="${h*9525}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:oneCellAnchor>`);
    out.push(xlCell(base+i, rn, '', 2));
  }
  return out;
}
/* ---------- 改善前後報告（Excel .xlsx，照片直接放在儲存格裡） ---------- */
function xlCol(i){ let s=''; i++; while(i){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=(i-m-1)/26; } return s; }
function xlText(t){ return wx(String(t??'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'')); }
function dataUrlBytes(u){ const m = /^data:([^;,]+)?(;base64)?,(.*)$/s.exec(u||''); if(!m) return null;
  const bin = m[2] ? atob(m[3]) : decodeURIComponent(m[3]), a = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return { bytes:a, ext: /png/.test(m[1]||'') ? 'png' : 'jpeg' }; }
/* 民國日期：2026-10-20 → 115.10.20 */
function rocDate(d){ if(!d) return ''; const [y,m,dd]=d.split('-'); return `${+y-1911}.${m}.${dd}`; }
/* 衛生檢查改善通知單（.xlsx）：照公司表單排版，「備註」改放缺失前後照片 */
async function beforeAfterExcel(){
  const picked = listSel.size ? records.filter(r=>listSel.has(r.id) && !r.deleted) : filteredRecords();
  if(!picked.length){ say('目前沒有案件可以做通知單。'); return; }

  try{
    const rs = picked.slice().sort((a,b)=> (a.foundDate||'').localeCompare(b.foundDate||'') || a.id.localeCompare(b.id));
    await preloadPhotos(rs);
    /* 第 2 行的年月：全部同一個月就寫「115年 10 月」，跨月寫起訖 */
    const ym = d => d ? `${+d.slice(0,4)-1911}年 ${+d.slice(5,7)} 月` : '';
    const ds = rs.map(r=>r.foundDate).filter(Boolean), a = ds[0]||'', z = ds[ds.length-1]||'';
    const period = a.slice(0,7)===z.slice(0,7) ? ym(a) : ym(a)+' ～ '+ym(z);
    const cell = xlCell, blank = (c,r,st) => `<c r="${xlCol(c)}${r}" s="${st}"/>`, L = 'L';
    const IMGW = 120, IMGH = 90, GAP = 6;  /* 照片 120×90 px，一格一排放 2 張 */
    let rows = `<row r="1" ht="24" customHeight="1">${cell(0,1,'衛生檢查改善通知單',7)}</row>`+
      `<row r="2" ht="20" customHeight="1">${cell(0,2,'　　'+period,9)}</row>`+
      `<row r="3" ht="18" customHeight="1">${['類別','日期','不符合描述','權責單位'].map((h,i)=>cell(i,3,h,5)).join('')}${cell(4,3,'改善措施',5)}${blank(5,3,5)}${blank(6,3,5)}${cell(7,3,'改善確認',5)}${blank(8,3,5)}${blank(9,3,5)}${cell(10,3,'缺失前後照片',5)}${blank(11,3,5)}</row>`+
      `<row r="4" ht="18" customHeight="1">${[0,1,2,3].map(i=>blank(i,4,5)).join('')}${['負責人','改善措施','預計完成日期','負責人','確認事項','確認日期','改善前','改善後'].map((h,i)=>cell(i+4,4,h,5)).join('')}</row>`;
    const media = [], anchors = [];
    const place = async (arr, col, rn, tag, rid) => {
      let n = 0;
      for(const p of arr){
        const u = phSync(p), b = u && dataUrlBytes(u); if(!b) continue;
        let w = IMGW, h = IMGH;
        try{ const im = new Image(); im.src = u; await im.decode(); const s = Math.min(IMGW/im.naturalWidth, IMGH/im.naturalHeight); w = Math.round(im.naturalWidth*s); h = Math.round(im.naturalHeight*s); }catch(e){}
        media.push(b); const id = media.length, x = 4 + (n%2)*(IMGW+GAP), y = 4 + Math.floor(n/2)*(IMGH+GAP);
        anchors.push(`<xdr:oneCellAnchor><xdr:from><xdr:col>${col}</xdr:col><xdr:colOff>${x*9525}</xdr:colOff><xdr:row>${rn-1}</xdr:row><xdr:rowOff>${y*9525}</xdr:rowOff></xdr:from><xdr:ext cx="${w*9525}" cy="${h*9525}"/><xdr:pic><xdr:nvPicPr><xdr:cNvPr id="${id+1}" name="${tag}${n+1}_${xlText(rid)}"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr><xdr:blipFill><a:blip r:embed="rImg${id}"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill><xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${w*9525}" cy="${h*9525}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:oneCellAnchor>`);
        n++;
      }
      return n;
    };
    for(let k=0;k<rs.length;k++){
      const r = rs[k], rn = k+5, lr = lastReview(r);
      const unit = r.ownerDept==='其它' ? (r.ownerNote||'其它') : r.ownerDept;
      const nb = await place(r.photos, 10, rn, '改善前', r.id), na = await place(r.improvePhotos, 11, rn, '改善後', r.id);
      /* 列高：照片排數與描述行數取大的（描述欄一行約 16 字） */
      const phH = Math.ceil(Math.max(nb,na,1)/2)*(IMGH+GAP)*0.75 + 8, txH = Math.ceil(((r.rawDesc||'').length+1)/16)*17 + 10;
      const vals = [[(TYPES.find(t=>t[0]===r.defType)||[])[1]||'未選類別',5], [rocDate(r.foundDate),5], [r.rawDesc,6], [unit,5],
        [r.ownerDept==='其它'?'':r.ownerNote,5], [r.improveContent,6], [rocDate(r.improveDate),5],
        [lr?lr.by:'',5], [r.prevention,6], [lr?rocDate(lr.date):'',5],
        [nb?'':'（無照片）',5], [na?'':'（無照片）',5]];
      rows += `<row r="${rn}" ht="${Math.round(Math.max(60, phH, txH))}" customHeight="1">${vals.map(([v,st],i)=>cell(i,rn,v,st)).join('')}</row>`;
    }
    const f0 = rs.length+5;
    const notes = ['*類別：1為每月衛生管理查核之不符合事項、2為製程衛生檢查不符合事項。','*依每月衛生管理查核與製程衛生檢查日期，每月匯整為一個檔案。','每月結案(全數確認改善完成)審核：'];
    notes.forEach((t,i)=>{ rows += `<row r="${f0+i}" ht="18" customHeight="1">${cell(0,f0+i,t,i<2?8:9)}</row>`; });
    rows += `<row r="${f0+3}" ht="26" customHeight="1">${cell(0,f0+3,'品研主管：',9)}${cell(4,f0+3,'品研組長：',9)}${cell(7,f0+3,'衛生管理人員：',9)}</row>`;
    rows += `<row r="${f0+4}" ht="16" customHeight="1">${cell(0,f0+4,'4S-02-03',8)}${cell(5,f0+4,'版次：1.2',8)}${cell(11,f0+4,'頁次：1/1',8)}</row>`;
    const widths = [12,10,32,9,9,20,11,9,16,10,36,36];
    const merges = ['A1:L1','A2:L2','A3:A4','B3:B4','C3:C4','D3:D4','E3:G3','H3:J3','K3:L3', `A${f0}:L${f0}`, `A${f0+1}:L${f0+1}`, `A${f0+2}:L${f0+2}`, `A${f0+3}:D${f0+3}`, `E${f0+3}:G${f0+3}`, `H${f0+3}:L${f0+3}`];
    const sheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><sheetViews><sheetView workbookViewId="0"><pane ySplit="4" topLeftCell="A5" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${rows}</sheetData><autoFilter ref="A4:${L}${rs.length+4}"/><mergeCells count="${merges.length}">${merges.map(m=>`<mergeCell ref="${m}"/>`).join('')}</mergeCells><pageMargins left="0.3" right="0.3" top="0.4" bottom="0.4" header="0.2" footer="0.2"/><pageSetup orientation="landscape" paperSize="9" fitToWidth="1" fitToHeight="0"/>${media.length?'<drawing r:id="rId1"/>':''}</worksheet>`;
    const fn = `衛生檢查改善通知單_${period.replace(/\s+/g,'').replace(/～/g,'-')}_${today()}.xlsx`;
    await download(xlsxPack('衛生檢查改善通知單', sheet, '$3:$4', anchors, media), fn, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    flash('已產生通知單（共 '+rs.length+' 件）');
  }catch(e){ say('Excel 產生失敗，請重試。'); }
  btn.disabled = false; btn.textContent = old;
}

/* 先選年份／月份（依發現日期），預設帶入清單目前的篩選 */
function exportPick(){
  const all = live();
  if(!all.length){ say('目前沒有任何案件可以匯出。'); return; }
  const years = [...new Set(all.map(r=>(r.foundDate||'').slice(0,4)).filter(Boolean))].sort().reverse();
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-label="匯出報表"><div class="msg"><b>匯出報表（Excel）</b><br><span class="small muted">依「發現日期」選擇期間，可只匯出未結案或已結案；不含「最近刪除」。</span></div>
    <div class="grid" style="grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
      <select id="exY" aria-label="年份"><option value="">全部年份</option>${years.map(y=>`<option value="${y}" ${listYear===y?'selected':''}>${y} 年</option>`).join('')}</select>
      <select id="exM" aria-label="月份"><option value="">全部月份</option>${Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0')).map(v=>`<option value="${v}" ${listMonth===v?'selected':''}>${parseInt(v,10)} 月</option>`).join('')}</select>
    </div>
    <select id="exS" aria-label="結案狀態" style="margin-bottom:8px"><option value="">狀態：全部（未結案＋已結案）</option><option value="open" ${listFilter==='open'?'selected':''}>狀態：只要未結案</option><option value="closed" ${listFilter==='closed'?'selected':''}>狀態：只要已結案</option></select>
    <select id="exF" aria-label="格式" style="margin-bottom:8px"><option value="form">格式：公司表單（改善追蹤表）</option><option value="full">格式：完整資料（全部欄位）</option></select>
    <div class="small muted" id="exN" style="margin-bottom:12px"></div>
    <div class="row"><button id="exNo">取消</button><button class="primary" id="exGo">下載</button></div></div>`;

  const pick = () => exportRows($('#exY').value, $('#exM').value, $('#exS').value);

}
const EX_ST = { open:'未結案', closed:'已結案' };
function exportRows(y, mo, st=''){

/* 公司表單格式（.xlsx）：類別｜日期｜不符合描述｜權責單位｜改善措施（負責人、改善措施、預計完成日期）｜改善確認（改善執行單位、確認事項、負責人、確認日期） */
function exportPer(y, mo){ return y ? y+(mo?'年'+parseInt(mo,10)+'月':'年') : (mo?'歷年'+parseInt(mo,10)+'月':'全部'); }
async function exportForm(y='', mo='', st=''){
  const rs = exportRows(y, mo, st);

  const cell = xlCell, blank = (c,r,st) => `<c r="${xlCol(c)}${r}" s="${st}"/>`;
  /* 照片欄：改善前、改善後各依這次案件裡最多的張數開格子（最多 10） */
  const nB = Math.max(1, Math.min(10, Math.max(...rs.map(r=>r.photos.length)))), nA = Math.max(1, Math.min(10, Math.max(...rs.map(r=>r.improvePhotos.length))));
  const P0 = 11, N = P0 + nB + nA, last = xlCol(N-1), per = exportPer(y, mo);
  const top = ['類別','日期','不符合描述','權責單位'];
  const sub = ['負責人','改善措施','預計完成日期','改善執行單位','確認事項','負責人','確認日期'];

async function download(content, name, type){
  /* 檔案要準備一陣子（照片、圖表）時，瀏覽器會把「不是剛按下按鈕」的下載當成自動下載而擋掉；
     這時改成跳出「下載檔案」按鈕，讓使用者親手按一下再下載 */
  if(navigator.userActivation && !navigator.userActivation.isActive){
    const ok = await dialog('檔案已準備好：\n'+name, '⬇ 下載檔案', '取消');
    if(!ok) return;
  }
  try{
    const dl = (typeof claude!=='undefined' && claude && claude.use) ? await claude.use('downloads') : null;
    if(dl){ await dl.save({filename:name, data:new Blob([content],{type})}); return; }
  }catch(e){ if(e && e.code && e.code!=='unavailable') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content],{type}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- 備份 / 還原 ---------- */
async function backup(){
  /* 備份檔裡放照片本身（不是編號），換電腦還原時照片才會跟著過去 */
  const rs = live();
  await preloadPhotos(rs);
  const out = rs.map(r => Object.assign({}, r, { photos:r.photos.map(phSync).filter(Boolean), improvePhotos:r.improvePhotos.map(phSync).filter(Boolean) }));
  const mapImages = {}; for(const m of MAPD.maps){ mapImages[m.img] = await phGet(m.img); }
  download(JSON.stringify({app:'qaHygieneTracker', version:2, exportedAt:new Date().toISOString(), records:out, tombs, opts:OPTS, map:MAPD, mapImages}, null, 1),
    `hygiene_backup_${today()}.json`, 'application/json');
}
function restore(input){
  const file = input.files[0]; input.value='';
  if(!file) return;
  const fr = new FileReader();
  fr.onload = async () => {
    try{
      const data = JSON.parse(fr.result);
      if(!data || !Array.isArray(data.records)) throw 0;
      const incoming = data.records.filter(r=>!r.deleted);
      const trashN = records.filter(r=>r.deleted).length;
      if(!(await ask(`備份檔內有 ${incoming.length} 筆紀錄。\n還原會「取代」目前瀏覽器中的 ${live().length} 筆資料，目前「最近刪除」裡的 ${trashN} 筆案件也會一併被取代，${data.map&&Array.isArray(data.map.maps)&&data.map.maps.length?'\n備份裡的廠區地圖也會取代目前的地圖。':''}\n確定嗎？`))) return;
      const old = records, oldT = tombs.slice();
      const next = incoming.map(r=>Object.assign(blankRecord(), migrate(r)));
      if(PH.ok){ try{ await phMoveOut(next); }catch(e){ say('照片存不進去，瀏覽器的儲存空間可能已滿，還原已取消，目前資料沒有變動。'); return; } }
      records = next;
      const have = new Set(tombs.map(t=>t.id));
      (Array.isArray(data.tombs)?data.tombs:[]).forEach(t=>{ if(t && t.id && !have.has(t.id)) tombs.push(t); });
      if(!persistAll()){ records = old; tombs = oldT; return; }
      /* 常用選項：跟目前的合併，不會刪掉現有的 */
      if(data.opts){ Object.keys(OPT_KINDS).forEach(k=>{ OPTS[k] = optList([...OPTS[k], ...optList(data.opts[k])]); }); saveOpts(); }
      /* 備份裡有廠區地圖時，一起還原（取代目前的地圖） */
      if(data.map && Array.isArray(data.map.maps) && data.map.maps.length) await mapApply(data.map, data.mapImages);
      flash('還原完成'); showList();
    }catch(e){ say('無法讀取：這不是本工具的備份檔。'); }
  };
  fr.readAsText(file);
}

  g.onpointerdown = e => { st = {y:e.clientY, h:v.getBoundingClientRect().height}; g.setPointerCapture(e.pointerId); e.preventDefault(); };
  g.onpointermove = e => { if(st) mapSetH(st.h + e.clientY - st.y); };
  g.onpointerup = () => { const now = Date.now(); if(st && now-last<400) mapFitHeight(); last = now; st = null; };
  g.onpointercancel = () => { st = null; };
}

/* 平面圖上的拖曳：畫區域、放位置、移動、改大小、檢視模式拖曳平移 */
function mapBind(){
  const inner = $('#mapInner'), view = $('#mapView'); if(!inner) return;
  const frac = e => { const b = inner.getBoundingClientRect(); return { x:clamp01((e.clientX-b.left)/b.width), y:clamp01((e.clientY-b.top)/b.height) }; };
  let drag = null;
  inner.onpointerdown = e => {
    if(e.button!==0) return;
    const p = frac(e), aEl = e.target.closest('[data-aid]'), lEl = e.target.closest('.mpin');
    if(MV.tool==='poly'){ drag = {k:'poly', s:p}; }
    else if(MV.tool==='area'){ drag = {k:'draw', s:p}; }
    else if(!MV.tool && MV.mode==='edit' && e.target.dataset.mid!==undefined){ const a = areaById(e.target.dataset.aid), i = +e.target.dataset.mid + 1; a.pts.splice(i, 0, [p.x, p.y]); drag = {k:'vtx', a, i, el:e.target, s:p, added:true}; mapPolyDom(a, false); }
    else if(!MV.tool && MV.mode==='edit' && e.target.dataset.vtx!==undefined){ const a = areaById(e.target.dataset.aid); drag = {k:'vtx', a, i:+e.target.dataset.vtx, el:e.target, s:p}; }
    else if(!MV.tool && MV.mode==='edit' && aEl && areaById(aEl.dataset.aid) && areaById(aEl.dataset.aid).pts && !lEl){ const a = areaById(aEl.dataset.aid); drag = {k:'mvp', a, s:p, o:a.pts.map(q=>q.slice())}; }
    else if(MV.tool==='loc'){ drag = {k:'place', s:p}; }
    else if(MV.mode==='edit' && e.target.dataset.res){ const a = areaById(aEl.dataset.aid); drag = {k:'res', a, s:p, o:{w:a.w,h:a.h}}; }
    else if(MV.mode==='edit' && lEl){ const l = locById(lEl.dataset.lid); drag = {k:'mvl', l, s:p, o:{x:l.x,y:l.y}, el:lEl}; }
    else if(MV.mode==='edit' && aEl){ const a = areaById(aEl.dataset.aid); drag = {k:'mva', a, s:p, o:{x:a.x,y:a.y}, el:aEl}; }
    else drag = {k:'pan', cx:e.clientX, cy:e.clientY, sl:view.scrollLeft, st:view.scrollTop, aEl, lEl};
    drag.moved = false; inner.setPointerCapture(e.pointerId); e.preventDefault();
  };
  inner.onpointermove = e => {
    if(!drag) return;
    const p = frac(e);
    if(drag.k==='pan'){ const dx = e.clientX-drag.cx, dy = e.clientY-drag.cy; if(Math.abs(dx)+Math.abs(dy)>4) drag.moved = true; view.scrollLeft = drag.sl-dx; view.scrollTop = drag.st-dy; return; }
    const dx = p.x-drag.s.x, dy = p.y-drag.s.y; if(Math.abs(dx)+Math.abs(dy)>0.005) drag.moved = true;
    if(drag.k==='draw'){ const d = $('#mDraw'), x = Math.min(p.x,drag.s.x), y = Math.min(p.y,drag.s.y); d.hidden = false; Object.assign(d.style,{left:x*100+'%',top:y*100+'%',width:Math.abs(dx)*100+'%',height:Math.abs(dy)*100+'%'}); }
    if(drag.k==='mva'){ const a = drag.a; a.x = clamp01(Math.min(1-a.w, drag.o.x+dx)); a.y = clamp01(Math.min(1-a.h, drag.o.y+dy)); Object.assign(drag.el.style,{left:a.x*100+'%',top:a.y*100+'%'}); }
    if(drag.k==='res'){ const a = drag.a; a.w = Math.max(0.02, Math.min(1-a.x, drag.o.w+dx)); a.h = Math.max(0.02, Math.min(1-a.y, drag.o.h+dy)); const el = inner.querySelector(`[data-aid="${a.id}"]`); Object.assign(el.style,{width:a.w*100+'%',height:a.h*100+'%'}); }
    if(drag.k==='mvl'){ const l = drag.l; l.x = clamp01(drag.o.x+dx); l.y = clamp01(drag.o.y+dy); Object.assign(drag.el.style,{left:l.x*100+'%',top:l.y*100+'%'}); }
    if(drag.k==='vtx'){ drag.a.pts[drag.i] = [p.x, p.y]; Object.assign(drag.el.style,{left:p.x*100+'%',top:p.y*100+'%'}); mapPolyDom(drag.a, false); }
    if(drag.k==='mvp'){ const xs = drag.o.map(q=>q[0]), ys = drag.o.map(q=>q[1]);
      const ddx = Math.max(-Math.min(...xs), Math.min(1-Math.max(...xs), dx)), ddy = Math.max(-Math.min(...ys), Math.min(1-Math.max(...ys), dy));
      drag.a.pts = drag.o.map(q=>[q[0]+ddx, q[1]+ddy]); mapPolyDom(drag.a); }
  };
  inner.onpointercancel = () => { drag = null; const d = $('#mDraw'); if(d) d.hidden = true; };
  inner.onpointerup = async e => {
    const d = drag; drag = null; if(!d) return;
    const p = frac(e);
    if(d.k==='poly'){
      if(d.moved) return;
      const P = MV.poly, b = inner.getBoundingClientRect();
      if(P.pts.length>=3){ const f0 = P.pts[0]; if(Math.hypot((p.x-f0[0])*b.width, (p.y-f0[1])*b.height) < 14){ mapPolyFinish(); return; } }
      P.pts.push([p.x, p.y]); renderMap(); return;
    }
    if(d.k==='vtx' && !d.moved && !d.added){
      const now = Date.now(), L = MV.lastVtx;
      if(L && L.aid===d.a.id && L.i===d.i && now-L.t<500){
        MV.lastVtx = null;
        if(d.a.pts.length<=3){ say('至少要留 3 個角。'); return; }
        d.a.pts.splice(d.i,1); polyBox(d.a); saveMap(); renderMap(); flash('已刪除一個角'); return;
      }
      MV.lastVtx = {aid:d.a.id, i:d.i, t:now}; return;
    }
    if(d.k==='vtx' || d.k==='mvp'){ if(d.moved || d.k==='vtx'){ polyBox(d.a); saveMap(); } MV.sel = {t:'area', id:d.a.id}; renderMap(); return; }
    if(d.k==='draw'){
      $('#mDraw').hidden = true;
      const w = Math.abs(p.x-d.s.x), h = Math.abs(p.y-d.s.y);
      if(w<0.02 || h<0.02){ say('範圍太小了，請在平面圖上「按住拖曳」畫出區域。'); return; }
      const name = await askText('區域名稱（例：打漿區）：', '');
      if(!name) return;
      if(MAPD.areas.some(a=>a.name===name)){ say('已經有叫「'+name+'」的區域了，請換一個名稱。'); return; }
      const a = {id:mapUid('ar'), mapId:MV.mapId, name, unit:'', desc:'', color:'#b8955a', x:Math.min(p.x,d.s.x), y:Math.min(p.y,d.s.y), w, h};
      MAPD.areas.push(a); if(!saveMap()){ MAPD.areas.pop(); return; }
      addAreaOpt(name); MV.tool = ''; MV.sel = {t:'area', id:a.id}; renderMap(); flash('已新增區域：'+name);
      return;
    }
    if(d.k==='place'){
      const hit = areaAt(p);
      if(!hit){ say('位置要放在區域框裡面。請先畫好區域，再點在區域框內。'); return; }
      const n = mapAreaLocs(hit.id).length + 1;
      const t = await askText(`位置編號與名稱（放在「${hit.name}」，例：P0${n} 地面及排水溝）：`, `P${String(n).padStart(2,'0')} `);
      if(!t) return;
      const m = t.match(/^\s*([A-Za-z]*\d+[A-Za-z0-9-]*)\s*(.*)$/);
      const l = {id:mapUid('lc'), areaId:hit.id, code:m?m[1]:'', name:(m?m[2]:t).trim()||t, desc:'', x:p.x, y:p.y};
      MAPD.locs.push(l); if(!saveMap()){ MAPD.locs.pop(); return; }
      MV.tool = ''; MV.sel = {t:'loc', id:l.id}; renderMap(); flash('已新增位置：'+(l.code+' '+l.name).trim());
      return;
    }
    if(d.k==='mva' || d.k==='res' || d.k==='mvl'){
      if(d.moved){
        if(d.k==='mvl'){ const hit = areaAt({x:d.l.x, y:d.l.y}); if(hit && hit.id!==d.l.areaId){ d.l.areaId = hit.id; flash('位置改到「'+hit.name+'」'); } }
        saveMap();
      }
      MV.sel = d.k==='mvl' ? {t:'loc', id:d.l.id} : {t:'area', id:d.a.id}; mapSide(); return;
    }
    if(d.k==='pan' && !d.moved){
      if(d.lEl) MV.sel = {t:'loc', id:d.lEl.dataset.lid};
      else if(d.aEl) MV.sel = {t:'area', id:d.aEl.dataset.aid};
      else MV.sel = null;
      mapSide();
    }
  };
}
/* 修改範圍：切到編輯模式並選取；矩形先轉成 4 個角的多邊形，才能加角 */
function mapEditRange(aid){ const a = areaById(aid); if(!a) return; if(!a.pts) a.pts = [[a.x,a.y],[a.x+a.w,a.y],[a.x+a.w,a.y+a.h],[a.x,a.y+a.h]]; saveMap(); MV.mode = 'edit'; MV.tool = ''; MV.sel = {t:'area', id:aid}; renderMap(); }
function mapRectToPoly(aid){ mapEditRange(aid); flash('已改成可加角的範圍，拖邊中間的「＋」可以多加角'); }
/* 拖曳多邊形時只更新那一塊，不重畫整張圖 */
function mapPolyDom(a, handles=true){
  const pg = document.querySelector(`polygon[data-aid="${a.id}"]`); if(pg) pg.setAttribute('points', ptsAttr(a.pts));
  const lb = document.querySelector(`[data-lab="${a.id}"]`); if(lb) Object.assign(lb.style,{left:a.pts[0][0]*100+'%',top:a.pts[0][1]*100+'%'});
  if(handles) document.querySelectorAll(`.mvtx[data-aid="${a.id}"]`).forEach(v=>{ const q = a.pts[+v.dataset.vtx]; Object.assign(v.style,{left:q[0]*100+'%',top:q[1]*100+'%'}); });
}
function mapAreaLocs(aid){ return MAPD.locs.filter(l=>l.areaId===aid); }
/* 區域形狀：矩形（x,y,w,h）或多邊形（pts；另外保留外框 x,y,w,h 方便排序） */
function inArea(a,p){
  if(a.pts){ let c = false; for(let i=0,j=a.pts.length-1;i<a.pts.length;j=i++){ const [xi,yi]=a.pts[i], [xj,yj]=a.pts[j]; if((yi>p.y)!==(yj>p.y) && p.x < (xj-xi)*(p.y-yi)/(yj-yi)+xi) c = !c; } return c; }
  return p.x>=a.x && p.x<=a.x+a.w && p.y>=a.y && p.y<=a.y+a.h;
}
function areaAt(p){ return mapAreas().filter(a=>inArea(a,p)).sort((x,y)=>x.w*x.h-y.w*y.h)[0]; }
function polyBox(a){ const xs = a.pts.map(q=>q[0]), ys = a.pts.map(q=>q[1]); a.x = Math.min(...xs); a.y = Math.min(...ys); a.w = Math.max(...xs)-a.x; a.h = Math.max(...ys)-a.y; }
const ptsAttr = pts => pts.map(q=>(q[0]*100).toFixed(3)+','+(q[1]*100).toFixed(3)).join(' ');
/* 多邊形：一個角點一下，點回第一個點或按「完成」結束 */
function mapPolyStart(aid){ MV.tool = 'poly'; MV.poly = {pts:[], areaId:aid||''}; renderMap(); }
function mapPolyCancel(){ MV.tool = ''; MV.poly = null; renderMap(); }
async function mapPolyFinish(){
  const P = MV.poly; if(!P) return;
  if(P.pts.length < 3){ say('多邊形至少要點 3 個角。'); return; }
  const tmp = {pts:P.pts.map(q=>q.slice())}; polyBox(tmp);
  if(tmp.w<0.01 || tmp.h<0.01){ say('範圍太小了，請再畫一次。'); return; }
  if(P.areaId){ const a = areaById(P.areaId); a.pts = tmp.pts; polyBox(a); saveMap(); MV.tool = ''; MV.poly = null; MV.sel = {t:'area', id:a.id}; renderMap(); flash('已更新「'+a.name+'」的範圍'); return; }
  const name = await askText('區域名稱（例：成品倉庫）：', '');
  if(!name) return;
  if(MAPD.areas.some(a=>a.name===name)){ say('已經有叫「'+name+'」的區域了，請換一個名稱。'); return; }
  const a = {id:mapUid('ar'), mapId:MV.mapId, name, unit:'', desc:'', color:'#b8955a', pts:tmp.pts};
  polyBox(a); MAPD.areas.push(a); if(!saveMap()){ MAPD.areas.pop(); return; }
  addAreaOpt(name); MV.tool = ''; MV.poly = null; MV.sel = {t:'area', id:a.id}; renderMap(); flash('已新增區域：'+name);
}

/* 上傳／換平面圖：縮到最長邊 2400px 存進照片資料庫 */
function mapUpload(input, mid){
  const f = input.files[0]; input.value = ''; if(!f) return;
  if(!/^image\/(jpeg|png)$/.test(f.type)){ say('平面圖請用 JPG 或 PNG 圖檔。'); return; }
  if(f.size > 25*1024*1024){ say('圖片太大（超過 25MB），請先縮小後再上傳。'); return; }
  const fr = new FileReader();
  fr.onerror = () => say('圖片讀取失敗，請換一張再試。');
  fr.onload = () => { const img = new Image();
    img.onerror = () => say('圖片讀取失敗，請換一張再試。');
    img.onload = async () => {
      const s = Math.min(1, 2400/Math.max(img.width,img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
      const url = c.toDataURL('image/jpeg',0.85);
      if(mid){ const m = MAPD.maps.find(x=>x.id===mid);
        if(!(await ask('換圖片後，原本畫的區域和位置會保留在相同比例的位置上；如果新圖的範圍或比例不同，請再檢查區域是否對齊。確定要換嗎？'))) return;
        const id = phNewId(); try{ await phPut(id, url); }catch(e){ say('平面圖存不進去，瀏覽器的儲存空間可能已滿。'); return; }
        m.img = id; m.w = c.width; m.h = c.height; saveMap(); renderMap(); flash('已換圖片'); return; }
      const name = await askText('地圖名稱（例：一樓、二樓、A 廠）：', '一樓'); if(!name) return;
      const id = phNewId(); try{ await phPut(id, url); }catch(e){ say('平面圖存不進去，瀏覽器的儲存空間可能已滿。'); return; }
      const m = {id:mapUid('mp'), name, img:id, w:c.width, h:c.height};
      MAPD.maps.push(m); if(!saveMap()){ MAPD.maps.pop(); return; }
      MV.mapId = m.id; MV.mode = 'edit'; MV.tool = 'area'; MV.zoom = 1; MV.sel = null; renderMap(); flash('已新增地圖，接著在平面圖上拖曳畫出第一個區域');
    };
    img.src = fr.result; };
  fr.readAsDataURL(f);
}
async function mapRename(){ const m = MAPD.maps.find(x=>x.id===MV.mapId); const v = await askText('地圖名稱：', m.name); if(v){ m.name = v; saveMap(); renderMap(); } }
async function mapDelete(){
  const m = MAPD.maps.find(x=>x.id===MV.mapId), as = mapAreas();
  if(!(await ask(`確定刪除地圖「${m.name}」？\n上面的 ${as.length} 個區域和它們的位置會一起刪除。\n已存的缺失紀錄不會被刪除。`))) return;
  const ids = new Set(as.map(a=>a.id));
  MAPD.locs = MAPD.locs.filter(l=>!ids.has(l.areaId)); MAPD.areas = MAPD.areas.filter(a=>a.mapId!==m.id); MAPD.maps = MAPD.maps.filter(x=>x.id!==m.id);
  saveMap(); MV.mapId = ''; MV.sel = null; showMap();
}
async function mapAreaSave(id){
  const a = areaById(id), old = a.name, name = $('#maName').value.trim();
  if(!name){ say('區域名稱不能空白。'); return; }
  if(name!==old && MAPD.areas.some(x=>x.name===name)){ say('已經有叫「'+name+'」的區域了。'); return; }
  a.unit = $('#maUnit').value.trim(); a.desc = $('#maDesc').value.trim(); a.color = $('#maColor').value;
  if(name!==old){
    a.name = name;
    const i = OPTS.area.indexOf(old); if(i>=0) OPTS.area[i] = name; else addAreaOpt(name); saveOpts();
    const hit = records.filter(r => r.areaId===id || (!areaById(r.areaId) && (r.area||'').trim()===old));
    if(hit.length && await ask(`有 ${hit.length} 件缺失的區域是「${old}」，要一起改成「${name}」嗎？\n（選「取消」只改地圖，舊案件維持原樣）`)){
      hit.forEach(r=>{ r.area = name; r.areaId = id; }); persistAll();
    }
  }
  saveMap(); renderMap(); flash('已儲存區域');
}
async function mapAreaDel(id){
  const a = areaById(id), n = recsForArea(a).length, nl = mapAreaLocs(id).length;

  MAPD.locs = MAPD.locs.filter(l=>l.areaId!==id); MAPD.areas = MAPD.areas.filter(x=>x.id!==id);
  saveMap(); MV.sel = null; renderMap();
}
function mapLocSave(id){

async function mapLocDel(id){

/* 匯出區域（或位置）重點缺失：上面是摘要與缺失類別排行，下面是明細（依類別件數由多到少；同類別內逾期、未結案在前），含改善前後照片 */
async function mapAreaExport(aid, lid){
  const a = areaById(aid), l = lid ? locById(lid) : null; if(!a) return;
  const rs = l ? recsForLoc(l) : recsForArea(a);
  if(!rs.length){ say('這裡還沒有缺失紀錄可以匯出。'); return; }
  const btn = $('#maXls'), old = btn.textContent; btn.disabled = true; btn.textContent = '產生中…';
  try{
    await preloadPhotos(rs);
    const title = l ? `${a.name}／${(l.code+' '+l.name).trim()}` : a.name;
    const tname = r => r.defType ? typeName(r.defType) : '未選類別';
    const st = mapStats(rs), groups = new Map();
    rs.forEach(r => { const k = tname(r); if(!groups.has(k)) groups.set(k, []); groups.get(k).push(r); });
    const rank = [...groups.entries()].map(([k,v])=>({k, v, n:v.length, open:v.filter(r=>!r.closed).length, over:v.filter(isOverdue).length}))
      .sort((x,y)=> y.n-x.n || y.over-x.over || y.open-x.open);
    const pr = r => isOverdue(r) ? 0 : !r.closed ? 1 : 2;
    const cell = xlCell, N = 12, last = xlCol(N-1);
    let rows = '', rn = 1; const merges = [], media = [], anchors = [];
    const line = (txt, sty, h) => { rows += `<row r="${rn}"${h?` ht="${h}" customHeight="1"`:''}>${cell(0,rn,txt,sty)}</row>`; merges.push(`A${rn}:${last}${rn}`); rn++; };
    line(`${title}　重點缺失`, 3, 26);
    line(`匯出日期：${fmtDate(today())}　累計 ${st.total} 件　未結案 ${st.open} 件　逾期 ${st.over} 件`, 0, 20);
    rn++;
    rows += `<row r="${rn}" ht="20" customHeight="1">${['缺失類別排行','件數','未結案','逾期'].map((h,i)=>cell(i,rn,h,4)).join('')}</row>`; rn++;
    rank.forEach(g => { rows += `<row r="${rn}">${[g.k, g.n, g.open, g.over].map((v,i)=>cell(i,rn,v,2)).join('')}</row>`; rn++; });
    rn++;
    const head = ['缺失類別','編號','發現日期','細部位置','缺失描述','缺失等級','狀態','負責單位／人員','改善期限','如何改善','改善前照片','改善後照片'];
    const hr = rn; rows += `<row r="${rn}" ht="22" customHeight="1">${head.map((h,i)=>cell(i,rn,h,4)).join('')}</row>`; rn++;
    const IMGW = 120, IMGH = 90, GAP = 6;
    const place = async (arr, col, rid, tag) => { let n = 0;
      for(const p of arr){ const u = phSync(p), b = u && dataUrlBytes(u); if(!b) continue;
        let w = IMGW, h = IMGH;
        try{ const im = new Image(); im.src = u; await im.decode(); const k = Math.min(IMGW/im.naturalWidth, IMGH/im.naturalHeight); w = Math.round(im.naturalWidth*k); h = Math.round(im.naturalHeight*k); }catch(e){}
        media.push(b); const id = media.length, x = 4 + (n%2)*(IMGW+GAP), y = 4 + Math.floor(n/2)*(IMGH+GAP);

function trashRestore(){
  if(!trashSel.size) return;
  const ids = [...trashSel]; const done = [];
  records.forEach(r => { if(ids.includes(r.id) && r.deleted){ r.deleted=false; delete r.deletedAt; done.push(r); } });

async function trashPerm(){
  const n = trashSel.size; if(!n) return;

  records.filter(r=>ids.has(r.id)).forEach(r => tombs.push({id:r.id, foundDate:r.foundDate, deletedAt:r.deletedAt||today(), purgedAt:today()}));

function purgeExpired(){
  const exp = records.filter(r => r.deleted && r.deletedAt && today() > addDays(r.deletedAt,30));
