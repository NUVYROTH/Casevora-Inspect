<style>
:root{
  /* Casevoras 品牌色：深藍、米色、金色 */
  --bg:#f5efe3; --card:#fffdf8; --ink:#16213a; --muted:#5d6779; --line:#e3d9c6;
  --brand:#16213a; --brand-soft:#f3ece0; --gold:#b8955a; --field:#c9bda6; --warn:#b45309; --warn-soft:#fff4e0;
  --bad:#b42318; --bad-soft:#fdecea; --ok:#167a3e; --ok-soft:#e6f5ec; --info:#1d4f91; --info-soft:#e8f0fb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;font-size:15px;line-height:1.65}
header.topbar{background:var(--brand);color:#fffdf8;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:50;transition:box-shadow .2s}
/* 往下捲動時，標題列縮小並固定在最上方 */
header.topbar.compact{box-shadow:0 2px 10px rgba(0,0,0,.25)}
header.topbar .tbin,header.topbar .logo,header.topbar .bname,header.topbar .bsub{transition:all .2s}
header.topbar.compact .tbin{padding-top:6px;padding-bottom:6px}
header.topbar.compact .logo{width:42px;height:42px}
header.topbar.compact .bname{font-size:28px}
header.topbar.compact .bsub{font-size:13px;letter-spacing:.12em}
@media(max-width:600px){header.topbar.compact .tbmeta{display:none}}
@media (prefers-reduced-motion:reduce){header.topbar,header.topbar .tbin,header.topbar .logo,header.topbar .bname,header.topbar .bsub{transition:none}}
.tbin{max-width:1320px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:16px}
.logo{width:76px;height:76px;border-radius:50%;flex:none;display:block;box-shadow:0 0 0 1px rgba(184,149,90,.5),0 2px 8px rgba(0,0,0,.35)}
.bname{font:400 46px/1.05 "Pinyon Script",Georgia,"Times New Roman",serif;color:#e2c891;letter-spacing:.01em}
.bsub{font-size:17px;font-weight:700;opacity:.92;letter-spacing:.18em;margin-top:2px}
.tbmeta{font-size:12.5px;opacity:.85;display:flex;align-items:center;gap:10px}
.ver{border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:0 8px;font-size:11.5px}
@media(max-width:600px){.logo{width:60px;height:60px}.bname{font-size:38px}.bsub{font-size:14.5px;letter-spacing:.14em}}
.alert{display:flex;gap:12px;align-items:flex-start;background:#fdecea;color:#8a1c12;border:1px solid #e3a59c;border-left:5px solid #8a1c12;border-radius:8px;padding:12px 14px;margin:6px 0 12px;font-size:14px;line-height:1.7}
.alert1{align-items:center;flex-wrap:wrap}
.alert1 .a1{flex:1 1 260px;font-weight:700}
.alink{flex:none;background:transparent;border:1px solid #e3a59c;color:#8a1c12;font-size:13px;padding:4px 10px}
.alink:hover{background:#fff}
.gh{margin:10px 0 4px;font-size:14px;border-left:3px solid var(--gold);padding-left:6px}
#guide summary{font-size:15px}
.alert .atitle{font-weight:700;font-size:15px;color:var(--ink);margin-bottom:2px}
.atag{flex:none;background:#8a1c12;color:#fff;font-weight:700;font-size:12.5px;border-radius:4px;padding:2px 8px;margin-top:2px;letter-spacing:.1em}
.honest{font-weight:700;font-size:17px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:8px 12px;margin-bottom:16px}
main{max-width:1440px;margin:0 auto;padding:20px 16px 100px}
body.wide main{max-width:none}
.mrecs{display:grid;gap:8px}
.mrec{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:8px 10px;background:var(--card);cursor:pointer}
.mrec:hover{background:var(--brand-soft)}.mrec.ov{border-left-color:var(--bad)}.mrec.done{border-left-color:var(--ok)}
.mr-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px;color:var(--muted)}.mr-h b{color:var(--ink)}
.mr-loc{background:#16213a;color:#fff;border-radius:9px;padding:0 7px;font-size:11.5px;font-weight:700}
.mr-st{margin-left:auto;font-weight:700;color:var(--warn)}.mrec.ov .mr-st{color:var(--bad)}.mrec.done .mr-st{color:var(--ok)}
.mr-d{font-size:14px;margin:4px 0 2px;line-height:1.55}.mr-f{font-size:12px;color:var(--muted)}

.crumb{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin:0 0 12px}
.crumb b{color:var(--ink)}
.lbadge{background:var(--ok-soft);color:var(--ok);border-radius:999px;padding:3px 12px;font-weight:700;font-size:12.5px;white-space:nowrap}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.18em;color:var(--gold);margin-bottom:2px}
.ptitle.big{display:block}
.ptitle.big h1{font-size:28px;margin:0 0 2px;line-height:1.3}
.eyebrow.eb2{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-size:12px;letter-spacing:.22em}
.eyebrow.eb2::before{content:"";width:28px;height:2px;background:var(--gold);border-radius:2px;flex:none}
.ptitle.big span{font-size:14.5px}
.kpi{padding-right:58px}
.kic{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:9px;background:#f3ece0;color:#8a6a35;display:flex;align-items:center;justify-content:center}
.kic.kw{background:var(--bad-soft);color:var(--bad)}
.kpi.ok:before{background:var(--ok)}
.kpi.info:before{background:var(--info)}
.kic.kok{background:var(--ok-soft);color:#1e9e52}
.kic.kin{background:var(--info-soft);color:var(--info)}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 14px}
/* 清單頁標題卡 */
.hcard{margin-bottom:14px}
.hcard .alert{margin:0}
.hc-top .lbadge{flex:none}
.hc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.hc-top .ptitle{flex:1 1 360px;min-width:0}
.eyebrow.eb3{margin:2px 0 6px;font-size:12.5px;letter-spacing:.06em;font-weight:600}
.hc-mode{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.bnote{display:flex;gap:12px;align-items:flex-start;background:#fdecea;border:1px solid #e3a59c;border-left:5px solid #8a1c12;border-radius:8px;padding:12px 14px;color:#8a1c12;font-size:14px;line-height:1.7}
.bnote svg{flex:none;color:#8a1c12;margin-top:2px}
.bnote b{display:block;color:#8a1c12;font-size:15px;margin-bottom:2px}
.linkbtn{border:0;background:none;padding:0 0 0 6px;color:#8a1c12;text-decoration:underline;font-size:13.5px}
.linkbtn:hover{background:none;color:#b42318}
.hc-bot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
button.pillnew{border-radius:999px;padding:8px 18px;background:var(--brand);border-color:var(--brand);color:#fffdf8;font-weight:600}
button.pillnew:hover{background:#22304f}
@media(max-width:899px){ .hc-mode{align-items:flex-start} .hc-bot .ptools{justify-content:flex-start} }
/* 清單頁標題區：左邊標題，右邊提醒＋本機資料模式，下面按鈕 */
.hhead{display:flex;gap:16px 20px;flex-wrap:wrap;align-items:stretch;margin:0 0 14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.hhead .ptitle{flex:1 1 380px;min-width:0}
.hcrumb{font-size:13px;color:var(--muted);margin-top:6px}
.hcrumb b{color:var(--ink)}
.hright{flex:1 1 520px;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.hstat{display:flex;align-items:center;gap:10px}
.hstat .alert{flex:1;min-width:0;margin:0}
.hright .ptools{justify-content:flex-end}
@media(max-width:899px){ .hstat{flex-wrap:wrap} .hstat .alert{flex:1 1 100%} .hstat .lbadge{order:-1} .hright .ptools{justify-content:flex-start} }
.phead .ptitle{flex:1 1 440px;min-width:0}
.ptools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
button.lite{background:var(--card);border-color:var(--line);color:var(--ink);font-size:13.5px;padding:6px 12px}
button.lite:hover{background:#f3ece0}
button.pnew{font-size:13.5px;padding:6px 12px;border:1px solid var(--brand)}
.case{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;background:var(--card)}
.case .cinfo{display:flex;gap:12px;align-items:flex-start;flex:1 1 100%;min-width:0}
.case .cinfo>div{min-width:0}
.case .xsel{flex:none;width:18px;height:18px;margin:4px 0 0;accent-color:var(--brand)}
.case .cths{display:flex;gap:6px;flex:none}
.case .cth{width:64px;height:64px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-align:center;line-height:1.3}
.case .cth img{width:100%;height:100%;object-fit:cover;display:block}
.case .tg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.tag{font-size:12px;background:var(--bg);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:0 9px}
.tag.cat{color:var(--brand);border-color:var(--brand)}
.tag.lv-schedule{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.lv-major{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;font-size:12px;color:var(--muted);margin:4px 0 2px}
.steps span.done{color:var(--ink)}
.steps span.done::before{content:"✓ "}
.steps span.now{color:#fffdf8;background:var(--brand);border-radius:10px;padding:1px 8px;font-weight:600}
.steps span.now.trk{background:var(--warn)}
.steps i{font-style:normal;color:var(--gold)}
.case .ti{font-weight:600;font-size:16px;cursor:pointer;overflow-wrap:anywhere}
.case .mt{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:0 14px}
.case .mt span{white-space:nowrap}
.case .ac{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-left:auto}
.case .ac button{padding:5px 12px;font-size:13px}
.age{font-size:12.5px;font-weight:700;white-space:nowrap}
.age.late{color:var(--bad)}
.age.ok{color:var(--muted)}
.selall{display:inline-flex;align-items:center;gap:6px;font-size:14px}
.selall input{width:18px;height:18px;accent-color:var(--brand)}
.flowh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.flowh b{font-size:16px}
.flowh span{font-size:13px;color:var(--muted)}
.fsteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.fstep{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff}
.fno{font-size:11.5px;font-weight:800;letter-spacing:.12em;color:var(--gold);margin-bottom:6px}
.fstep b{font-size:14.5px}
.fstep p{margin:6px 0 0;font-size:12.5px;color:var(--muted);line-height:1.6}
@media(min-width:900px){
  header.topbar{display:none}
  body{padding-left:248px}
  .appg{display:block}
  .sbrand{display:flex;align-items:center;gap:12px;padding:6px 8px 18px}
  .sbrand img{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 1px rgba(184,149,90,.6)}
  .sbn{font:400 28px/1 "Pinyon Script",Georgia,serif;color:#e2c891}
  .sbs{font-size:10.5px;letter-spacing:.16em;color:#9fb0cf;margin-top:4px}
  .slab{display:block;font-size:11px;letter-spacing:.14em;color:#8796b3;padding:0 10px 8px}
  .sfoot{display:block;border-top:1px solid rgba(255,255,255,.12);margin-top:12px;padding:12px 10px 4px;font-size:12px;line-height:1.7;color:#9fb0cf}
  .sfoot b{color:#d6deec;font-weight:600;letter-spacing:.04em}
  .snav{position:fixed;left:0;top:0;bottom:0;width:248px;height:auto;min-height:0;z-index:20;overflow:auto;background:#1a2a44;border:0;border-radius:0;padding:18px 14px}
  .snav button{color:#d6deec;padding:11px 12px;white-space:nowrap}
  .snav button:hover{background:rgba(255,255,255,.08);color:#fff}
  .snav button.on,.snav button.on:hover{background:#2c4166;color:#fff}
  .snav .ic{background:rgba(255,255,255,.1);color:#fff}
  .snav button.on .ic{background:var(--gold)}
  .crumb{margin:-4px -2px 14px;padding:0 0 12px;border-bottom:1px solid var(--line)}
  .savebar{left:248px}
  .split .side{top:16px;max-height:calc(100vh - 100px)}
}
@media(max-width:899px){ .crumb{display:none} .phead .ptitle{flex-basis:100%} .ptools{justify-content:flex-start} }
@media(max-width:600px){ .kpi{padding-right:40px} .kic{width:26px;height:26px;top:10px;right:8px} .kic svg{width:15px;height:15px} .ptitle.big h1{font-size:24px} .eyebrow{font-size:11px} .eyebrow.eb2{font-size:11px;letter-spacing:.14em;gap:10px} .eyebrow.eb2::before{width:26px} .case .cth{width:52px;height:52px} }
.seg{display:inline-flex;gap:2px;background:#f3ece0;border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 18px;font-weight:700;color:var(--muted)}
.seg button.on,.seg button.on:hover{background:var(--brand);color:#fffdf8}
/* 統計期間列：年度／每季／每月 ＋ ◀ 年 季(月) ▶ 一排 */
.pbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:#fffdf8;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.pseg{display:inline-flex;border:1px solid #c9bda6;border-radius:8px;overflow:hidden}
.pseg button{border:0;border-left:1px solid #c9bda6;background:#fff;border-radius:0;padding:8px 16px;font-size:15px;color:var(--ink);min-height:40px}
.pseg button:first-child{border-left:0}.pseg button.on,.pseg button.on:hover{background:#16213a;color:#fff;font-weight:700}
.pbar .pnav{display:inline-flex;align-items:center;gap:8px}
.pbar .parr{width:40px;min-height:40px;padding:0;border:1px solid #c9bda6;border-radius:8px;background:#fff;font-size:14px;color:var(--ink)}
.pbar .parr:hover{background:var(--brand-soft)}.pseg.sm button{padding:6px 10px;font-size:13px;min-height:34px}.pbar .pdates{display:flex;align-items:center;gap:8px;flex:0 1 360px;min-width:0}.pbar input[type=date]{flex:1;min-width:0;width:auto;min-height:40px;background:#fff;border:1px solid #c9bda6;border-radius:8px;padding:6px 8px;font-size:14px}
.pbar select{width:auto;min-height:40px;font-size:15px;padding:6px 10px;border-radius:8px;background-color:#fff;border:1px solid #c9bda6}
.chartfig{margin:0}
.donut{display:flex;justify-content:center}
.dleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);margin-top:6px}
.dleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:minmax(70px,140px) 1fr 30px;gap:8px;align-items:center;font-size:13px;margin:7px 0}
.hb .b{height:12px;background:#efe6d5;border-radius:4px}
.hb .b i{display:block;height:12px;border-radius:0 4px 4px 0;background:var(--brand);min-width:3px}
.hb .v{text-align:right;font-weight:700}
.hb.hc{grid-template-columns:minmax(0,1.2fr) minmax(44px,1fr) 30px 60px;gap:6px}.hb .c{text-align:right}
.chg{font-size:12px;font-weight:700;white-space:nowrap}.chg-bad{color:var(--bad)}.chg-good{color:var(--ok)}.chg-eq{color:var(--muted);font-weight:600}
.tchg{margin-top:4px;font-size:12px;color:var(--muted)}.tchg .chg{font-size:13px}.dchg{margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.7}.lccmp{font-size:11.5px;color:var(--muted);align-self:center;margin-left:4px}.lcleg .chg{margin-left:4px;font-size:11px}.lctip .chg{margin-left:6px;font-size:11px}
.dnleg.cmp button{grid-template-columns:14px minmax(0,1fr) auto 36px 66px}.dnleg .dnc{text-align:right}.dncmp{font-size:11.5px;color:var(--muted);margin-top:4px}
.mkpi .kchg{display:block;margin-top:3px}.mkpi .kchg .chg{font-size:11.5px}
input.lsearch{background:#f3ece0;border-color:var(--line)}
.lfilter{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0 6px}
.lfilter select{background:#f3ece0;border-color:var(--line)}
.lcount{font-size:13px;color:var(--muted);margin:2px 0 8px}
@media(max-width:600px){ .lfilter{grid-template-columns:1fr 1fr} }
#tableBox table{min-width:760px}
#tableBox td.nw{white-space:nowrap}
#tableBox td.desc{min-width:140px}
.lv{display:inline-block;margin-top:3px;padding:0 7px;border-radius:999px;font-size:11.5px;font-weight:700;background:#efe7d8;color:var(--ink)}
.lv-schedule{background:var(--warn-soft);color:var(--warn)}
.lv-major{background:var(--bad-soft);color:var(--bad)}
.lv-none{color:var(--muted)}
.chip{font-size:13px;padding:4px 10px;border-radius:999px;background:#f3ece0;text-align:left}
.aires .sheet{border:1px solid var(--line);border-top:3px solid var(--brand);border-radius:8px;background:#fff;padding:10px 12px;margin-top:10px}
.aires .sheet-t{font-weight:700;margin-bottom:6px}
.aires .draft{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.filters select{width:auto;padding:6px 8px}
.pager{margin-top:10px}
.pager select{width:auto;padding:4px 6px}
/* 案件頁：電腦上左右並排（左：案件內容，右：文字整理），手機上下排列 */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
main:has(.split){max-width:1320px}
.split .side{position:sticky;top:76px;max-height:calc(100vh - 150px);overflow:auto}
@media (max-width:900px){ .split{grid-template-columns:1fr} .split .side{position:static;max-height:none;overflow:visible} }
#print{display:none}

/* ---------- 統計頁 ---------- */
.st-head{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.st-title{font-size:20px;font-weight:700;margin:0}
.st-sum{border-radius:8px;padding:12px 14px;font-size:16px;font-weight:700;margin:8px 0 14px;line-height:1.5}
.st-sum.ok{background:var(--ok-soft);color:#0f5a2d}
.st-sum.warn{background:var(--warn-soft);color:#7a3d06}
.st-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.st-tile{border:1px solid var(--line);border-radius:10px;padding:12px 10px;text-align:center;background:#fff}
.st-tile .n{font-size:34px;font-weight:700;line-height:1.1}
.st-tile .l{font-size:14px;font-weight:700;margin-top:4px}
.st-tile .d{font-size:12px;color:var(--muted);margin-top:2px}
.st-tile.t-done .n{color:var(--ok)} .st-tile.t-open .n{color:var(--info)} .st-tile.t-over .n{color:var(--bad)}
.st-tile.t-over{border-color:#e7b4ae;background:var(--bad-soft)}
.st-extra{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.st-extra .box{flex:1 1 240px;border:2px dashed #e7b4ae;border-radius:10px;padding:10px 14px;background:#fff}
.st-extra .box.del{border-color:var(--field)}
.st-extra .n{font-size:26px;font-weight:700;color:var(--bad)} .st-extra .del .n{color:var(--ink)}
.st-extra .l{font-weight:700}
.st-note{font-size:12px;color:var(--muted);margin:2px 0 10px}
.glist .gdesc{min-width:200px;max-width:340px;white-space:normal}
.pkico{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin:4px 0 6px}.pkico button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:11px;color:var(--ink);min-height:0}.pkico button img{width:26px;height:26px}.pkico button.on{border-color:#16213a;box-shadow:0 0 0 2px #16213a;font-weight:700}
.aiph{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 2px}.aiph>div{flex:1 1 200px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}.aiph b{font-size:12.5px}.aiph .ok{color:var(--ok)}.aiph .ng{color:var(--bad)}
.aiph .ths{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.aiph .ths .ph{position:relative}.aiph .ths .ph .x{position:absolute;top:-7px;right:-7px;width:24px;height:24px;min-height:0;padding:0;border-radius:50%;font-size:12px;line-height:1;background:#fff;border:1px solid var(--line)}.aiph .ths img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.aitems .aith{display:flex;gap:4px;margin-top:4px;align-items:center}.aitems .aith img{width:34px;height:34px;object-fit:cover;border-radius:4px;border:2px solid #fff;cursor:zoom-in}.aitems .aith img.ok{outline:2px solid var(--ok)}.aitems .aith img.ng{outline:2px solid var(--bad)}
.aflt{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;align-items:center}.aflt button{padding:5px 10px;font-size:13px;min-height:0}.aflt button.on{background:#16213a;color:#fff;border-color:#16213a}.arow.hide{display:none}.agrp{margin:14px 0 2px;font-weight:700;color:var(--ink);border-left:4px solid var(--gold);padding-left:8px}
.ctbl td{vertical-align:top;line-height:1.5;min-width:84px}.ctbl td:first-child{min-width:96px}.ctbl .chg{font-size:11.5px}
.mloc{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}.mlc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}.mlh{display:flex;align-items:center;gap:8px;margin-bottom:6px}.mlh b{font-size:15px}.mlh .small{color:var(--muted)}.mlh button{margin-left:auto;padding:3px 10px;min-height:0;font-size:12px}.mlc .hb{grid-template-columns:minmax(70px,130px) minmax(48px,1fr) auto;margin:5px 0}.mlc .hb.click{cursor:pointer}.mlc .hb.click:hover{background:var(--brand-soft)}
.st-sec{margin:18px 0 6px;font-size:16px;font-weight:700;border-left:4px solid var(--brand);padding-left:8px;break-after:avoid}

.msec>summary:hover{color:var(--brand)}
.aguide{background:#fffdf8;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:10px}.aguide>summary{cursor:pointer;font-weight:700}.aguide ol{margin:8px 0 2px;padding-left:22px;line-height:1.8;font-size:14px}
.aref{margin-top:10px}.aref>summary{cursor:pointer;font-weight:700}.arow .refs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 2px}.arow .refs img{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.arow .photos img{cursor:zoom-in}
.st-bar{display:grid;grid-template-columns:minmax(80px,170px) 1fr 44px 70px;gap:8px;align-items:center;margin:4px 0;font-size:14px}
.st-bar .b{background:#efe7d8;border-radius:4px;height:16px}
.st-bar .b i{display:block;height:16px;background:var(--brand);border-radius:4px;min-width:2px}
.st-bar .v{text-align:right;font-weight:700}.st-bar .c{text-align:right}
.st-chart svg{width:100%;min-width:560px;height:auto;display:block}
.st-scroll{overflow-x:auto}
.st-leg{display:flex;gap:16px;font-size:13px;margin:4px 0}

.st-leg .a::before{border-color:var(--brand)} .st-leg .c::before{border-color:var(--bad);border-top-style:dashed}
@media (max-width:640px){ .st-tiles{grid-template-columns:repeat(2,1fr)} .st-tile .n{font-size:30px} }
@page{margin:12mm}
@media print{
  body{background:#fff;font-size:12px}
  header,main,.savebar{display:none!important}
  #print{display:block}
  #print h1{font-size:18px;text-align:center;margin:0 0 4px}

<script>

/* =========================================================
   照片：存在瀏覽器的大容量空間 IndexedDB（一樣只在這台電腦、這個瀏覽器）
   案件資料裡只記「ph:編號」，照片本身另外存；不能用 IndexedDB 時，照樣存在案件資料裡
   ========================================================= */
const PH = { db:null, ok:false, cache:new Map() };
const isRef = p => typeof p==='string' && p.startsWith('ph:');
function phOpen(){
  return new Promise(res => {
    try{
      const rq = indexedDB.open('qaHygienePhotos', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('p');
      rq.onsuccess = () => { PH.db = rq.result; PH.ok = true; res(true); };
      rq.onerror = () => res(false); rq.onblocked = () => res(false);
    }catch(e){ res(false); }
  });
}
function phReq(mode, fn){
  return new Promise((res, rej) => {
    try{ const r = fn(PH.db.transaction('p', mode).objectStore('p')); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
    catch(e){ rej(e); }
  });
}
function phNewId(){ return 'ph:' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8); }
async function phPut(id, data){ await phReq('readwrite', st => st.put(data, id)); PH.cache.set(id, data); }
async function phGet(id){
  if(!isRef(id)) return id;
  if(PH.cache.has(id)) return PH.cache.get(id);
  if(!PH.ok) return '';
  try{ const v = await phReq('readonly', st => st.get(id)) || ''; if(v) PH.cache.set(id, v); return v; }catch(e){ return ''; }
}
const phSync = p => isRef(p) ? (PH.cache.get(p) || '') : p;
/* 畫面上的 <img data-ph> 先顯示空白，再從 IndexedDB 補上照片 */
async function hydrate(root){
  const imgs = [...(root||document).querySelectorAll('img[data-ph]')];
  for(const im of imgs){ const v = await phGet(im.dataset.ph); if(v) im.src = v; else im.alt = '（照片找不到）'; }
}
async function preloadPhotos(rs){
  await Promise.all(rs.flatMap(r => r.photos.concat(r.improvePhotos)).filter(isRef).map(phGet));
}
/* 舊資料：把存在案件資料裡的照片搬進 IndexedDB */
async function phMoveOut(list){
  let moved = 0;
  for(const r of list){
    for(const f of ['photos','improvePhotos']){
      const arr = r[f] || [];
      for(let i=0;i<arr.length;i++){
        if(typeof arr[i]==='string' && arr[i].startsWith('data:')){ const id = phNewId(); await phPut(id, arr[i]); arr[i] = id; moved++; }
      }
    }
  }
  return moved;
}
/* 刪掉沒有任何案件用到的照片（一天內新增的先不刪，可能是別的分頁還沒儲存的） */
async function phCleanup(){
  try{
    const used = new Set(records.flatMap(r => (r.photos||[]).concat(r.improvePhotos||[])).filter(isRef).concat(mapImageIds(), AUDITS.flatMap(au=>au.results.flatMap(r=>r.photos||[]))));
    const keys = await phReq('readonly', st => st.getAllKeys());
    const dayAgo = Date.now() - 86400000;
    for(const k of keys){
      const t = parseInt(String(k).slice(3).split('-')[0], 36);
      if(!used.has(k) && t < dayAgo){ await phReq('readwrite', st => st.delete(k)); PH.cache.delete(k); }
    }
  }catch(e){}
}
async function storageWarn(){
  try{
    if(!navigator.storage || !navigator.storage.estimate || window.__warned) return;
    const e = await navigator.storage.estimate();
    if(e.quota && e.usage/e.quota > 0.8){ window.__warned = true; say('提醒：瀏覽器的儲存空間已用約 80% 以上。請盡快按「下載備份」，並封存舊的已結案案件。'); }

}
async function storageText(){
  const el = $('#usedMB'); if(!el) return;
  try{ const e = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null; el.textContent = e ? (e.usage/1024/1024).toFixed(1)+' MB' : storageUsedMB()+' MB'; }catch(x){ el.textContent = storageUsedMB()+' MB'; }
}

/* ---------- 小工具 ---------- */
const $ = s => document.querySelector(s);
/* 頁面內的提示與確認視窗（claude.ai 版不會顯示瀏覽器的 alert／confirm 視窗） */
function dialog(msg, okText, cancelText){

    m.querySelector('.msg').textContent = msg;
    const done = v => { m.remove(); res(v); };
    m.querySelector('#dlgYes').onclick = () => done(true);
    if(cancelText) m.querySelector('#dlgNo').onclick = () => done(false);
    document.body.appendChild(m); m.querySelector('#dlgYes').focus();

}
const ask = msg => dialog(msg, '確定', '取消');
const say = msg => { dialog(msg, '知道了'); };
const inClaude = () => typeof claude !== 'undefined';
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function today(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
/* ---------- 常用選項（使用者自己設定的下拉清單，只存在這個瀏覽器；下載備份會一起帶走） ---------- */
const KEY_O = 'qaHygieneTracker_v1_opts';
const OPT_KINDS = { area:'缺失區域', people:'人員', dept:'單位' };
/* 名稱比對用：全形半形視為相同（１＝1、Ａ＝A）、去掉空白與看不見的字元 */
const nkey = v => String(v??'').normalize('NFKC').replace(/[\s\u200b-\u200f\u2060\ufeff]+/g,'');
const nclean = v => String(v??'').replace(/[\u200b-\u200f\u2060\ufeff]/g,'').trim();
function optList(a){ if(!Array.isArray(a)) return []; const seen = new Set(), out = [];
  a.map(nclean).forEach(x=>{ const k = nkey(x); if(x && x!=='其它' && !seen.has(k)){ seen.add(k); out.push(x); } }); return out; }
function optFind(kind, v){ const k = nkey(v); return k ? OPTS[kind].find(x=>nkey(x)===k) : undefined; }
function loadOpts(){ let o = {}; try{ o = JSON.parse(localStorage.getItem(KEY_O)||'{}') || {}; }catch(e){}
  return { area:optList(o.area), people:optList(o.people), dept: Array.isArray(o.dept) ? optList(o.dept) : ['生產課','儲運'], holidays:holList(o.holidays) }; }
/* 公司休假日：[{d:'2026-01-01', n:'元旦'}]，算改善天數時不算 */
function holList(a){ if(!Array.isArray(a)) return []; const m = new Map(); a.forEach(x => { if(x && /^\d{4}-\d{2}-\d{2}$/.test(x.d||'')) m.set(x.d, {d:x.d, n:String(x.n||'').slice(0,30)}); }); return [...m.values()].sort((x,y)=>x.d.localeCompare(y.d)); }
const holSet = () => new Set((OPTS.holidays||[]).map(x=>x.d));
let OPTS = loadOpts();
function saveOpts(){ try{ localStorage.setItem(KEY_O, JSON.stringify(OPTS)); return true; }catch(e){ say('常用選項存不進去，瀏覽器的儲存空間可能已滿。'); return false; } }
/* 下拉選常用；選「其它（自己打字）」才出現輸入框。值仍存在原本的欄位（data-f 或 id） */
function combo(kind, v, attr, ph, dis){
  v = v || '';
  return `<div class="combo" data-kind="${kind}"><select class="cmsel lockable" aria-label="${OPT_KINDS[kind]}常用選項" onchange="comboPick(this)" ${dis?'disabled':''}>${comboOpts(kind, comboSel(kind,v))}</select>
    <div class="cmrow" ${comboSel(kind,v)==='__o'?'':'hidden'}><input type="text" ${attr} value="${esc(v)}" placeholder="${esc(ph||'')}" ${dis?'disabled':''}><button type="button" class="cmadd lockable" onclick="comboAdd(this)" ${dis?'disabled':''}>＋加入常用</button></div></div>`;
}
function comboSel(kind, v){ return v ? (optFind(kind, v) || '__o') : (OPTS[kind].length ? '' : '__o'); }
function comboOpts(kind, sel){ return `<option value="">— 請選擇 —</option>${OPTS[kind].map(x=>`<option value="${esc(x)}" ${x===sel?'selected':''}>${esc(x)}</option>`).join('')}<option value="__o" ${sel==='__o'?'selected':''}>其它（自己打字）</option>`; }
function comboPick(sel){
  const row = sel.closest('.combo').querySelector('.cmrow'), inp = row.querySelector('input'), other = sel.value==='__o';
  row.hidden = !other;
  inp.value = other ? '' : sel.value;
  inp.dispatchEvent(new Event('input', {bubbles:true}));
  if(other) inp.focus();
}
/* 把下拉的選取狀態對回輸入框目前的值（清單變動、程式改值之後用） */
function comboSync(box){
  const kind = box.dataset.kind, inp = box.querySelector('input'), sel = box.querySelector('select'), k = comboSel(kind, inp.value);
  sel.innerHTML = comboOpts(kind, k); box.querySelector('.cmrow').hidden = k!=='__o';
}
function comboAdd(btn){
  const box = btn.closest('.combo'), kind = box.dataset.kind, v = box.querySelector('input').value.trim();
  if(!v){ say('請先在框裡輸入要加入的'+OPT_KINDS[kind]+'。'); return; }
  if(v==='其它'){ say('「其它」不能加入常用。'); return; }
  if(!optFind(kind, v)){ OPTS[kind].push(v); if(!saveOpts()){ OPTS[kind].pop(); return; } }
  document.querySelectorAll(`.combo[data-kind=${kind}]`).forEach(comboSync);
  flash('已加入常用：'+v);
}
function whoText(d,n){ return [d,n].filter(x=>x&&String(x).trim()).join('／'); }
function ownerText(r){ return whoText(r.ownerDept,r.ownerNote); }
function improveByText(r){ return whoText(r.improveDept,r.improveNote); }
function migrate(r){
  /* 舊的 20 類換成新的 14 類（寫在函式裡，因為載入資料時這個函式會比下面的常數先執行） */
  const V1 = {'01':'01','02':'02','03':'03','04':'03','05':'04','06':'05','07':'06','08':'07','09':'07','10':'08','11':'09','12':'10','13':'10','14':'02','15':'01','16':'11','17':'08','18':'13','19':'12','20':'14'};
  if(r.defType && r.defTypeV===undefined){ r.defType = V1[r.defType] || '14'; r.defTypeV = 2; }
  /* v2 的「14 其他衛生缺失」在 v3 變成 15 */
  if(r.defType && r.defTypeV===2 && r.defType==='14') r.defType = '15';
  r.defTypeV = 3;
  if(r.formalDesc){ r.rawDesc=r.formalDesc; r.formalDesc=''; }
  if(r.owner && !r.ownerDept){ r.ownerDept='其它'; r.ownerNote=r.owner; }
  if(r.improveBy && !r.improveDept){ r.improveDept='其它'; r.improveNote=r.improveBy; }
  delete r.owner; delete r.improveBy; return r;
}
function deptSel(f,label,idAttr,r,extra){
  /* 單位：下拉選常用，選「其它（自己打字）」可輸入，也能「＋加入常用」；舊資料的「其它」照樣顯示 */
  return `<div><label class="f" ${idAttr?`id="${idAttr}"`:''}>${label}</label>${combo('dept', r[f], `data-f="${f}"`, '例：品保課、支援組')}${extra||''}</div>`; }
function cfld(kind, f, label, opt={}){ return `<div><label class="${opt.req?'f req':'f'}">${label}</label>${combo(kind, cur[f], `data-f="${f}"`, opt.ph)}</div>`; }
function addDays(ymd,n){ const [y,m,d]=ymd.split('-').map(Number); const t=new Date(y,m-1,d+n); return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); }
let showDlErr=false;
/* 改善期限預設：限期改善缺失 20 天，其他 7 天（從發現日期起算）；使用者自己改過的日期不會被蓋掉 */
function dlDays(cat){ return cat==='schedule' ? 20 : 7; }
function dlHint(cat){ return cat==='schedule' ? '（限期改善缺失預設 20 天，從發現日期起算）' : '（預設一週改善，從發現日期起算）'; }
function dlIsDefault(r, found){ return !r.deadline || [7,20].some(n => r.deadline===addDays(found,n)); }
function dlApplyDefault(){
  if(!cur.foundDate || !dlIsDefault(cur, cur.foundDate)) return;

  const el = document.querySelector('[data-f=deadline]'); if(el) el.value = cur.deadline;
}
function dlError(r){ if(!r.deadline) return '請填改善期限'; if(r.foundDate && r.deadline<r.foundDate) return '改善期限不能早於發現日期'; return ''; }
function fmtDate(s){ if(!s) return ''; const [y,m,d]=s.split('-'); return `${y}/${m}/${d}`; }
/* 搜尋欄輸入日期時，比對發現日期：2026/10/26、10/26、2026/10（整月）；/ - . 都可以 */
function dateQuery(q){
  const m = q.match(/^(\d{1,4})[\/\-.](\d{1,2})(?:[\/\-.](\d{1,2}))?$/); if(!m) return null;
  const a=+m[1], b=+m[2], c=m[3]?+m[3]:0;
  const eq = (y,mo,d) => s => { if(!s) return false; const [Y,M,D]=s.split('-').map(Number); return (!y||Y===y) && M===mo && (!d||D===d); };
  if(c) return eq(a,b,c);
  if(m[1].length===4) return eq(a,b,0);
  return eq(0,a,b);
}

/* ---------- 規則判斷（依使用者提供之管理程序） ---------- */
function lastReview(r){ return r.reviews.length ? r.reviews[r.reviews.length-1] : null; }
function isOverdue(r){ return !r.closed && r.deadline && r.deadline < today() && !(lastReview(r) && lastReview(r).result==='pass'); }

function statusOf(r){
  if(r.closed) return {t:'已結案', c:'s-closed'};
  const lr = lastReview(r);
  if(lr && lr.result==='pass') return {t:'待品管確認結案', c:'s-ready'};
  if(lr) return {t:'持續追蹤（複查'+REVIEW_RESULT[lr.result]+'）', c:'s-track'};
  if(r.improveContent) return {t:'待複查', c:'s-review'};
  return {t:'待改善', c:'s-todo'};
}
function badges(r){
  const s = statusOf(r);

}

function ruleHints(r){
  const h = [];
  if(!r.category) h.push('尚未選擇缺失等級。等級請由品管／品保人員判定，系統不會自動判斷。');
  if(r.category==='general') h.push('一般缺失：記錄問題、通知相關人員改善，並確認改善結果。');
  if(r.category==='schedule') h.push('需安排時間改善：須記錄負責單位、改善期限及追蹤情形。');
  if(r.category==='major') h.push('重大缺失：應立即通知相關單位，並要求先採取必要的風險控制措施。');
  if(r.consecutive) h.push('相同缺失連續兩天發生：應追蹤改善。');
  if(r.recurred) h.push('已通知改善後再次發生：應確認發生原因，並追蹤改善。');
  return h;
}

let closeBasisUI='pass';
function closeChecks(r){
  const c = [];
  const add = (ok, t) => c.push({ok:!!ok, t});
  add(r.category, '已由品管／品保人員選擇缺失等級');
    if(r.category==='schedule'){ add(ownerText(r), '已填寫負責單位'); add(r.deadline, '已填寫改善期限'); }
  if(r.category==='major') add(r.riskControl.trim(), '已記錄風險控制措施');
  if(r.recurred){ add(r.causeAnalysis.trim(), '已確認發生原因'); ; }
  add(r.improveContent.trim(), '已填寫如何改善');
  const lr = lastReview(r);
  if(closeBasisUI==='other'){ const nt = ($('#clNote') ? $('#clNote').value : r.closeNote)||''; add(nt.trim(), '結案依據選「其它」，並已填寫結案說明'); }
  else add(lr && lr.result==='pass', '最近一次複查結果為「通過」（或下方結案依據選「其它」並填寫說明）');
  return c;
}

      `<p>統計頁最下面「📍 缺失區域分析」可以選<b>年度、每季、每月</b>，按 ◀ ▶ 跳上一期／下一期（跟最上面的統計期間同步，依發現日期）：</p><p><b>圓餅圖</b>${gN(1)}：這段期間各缺失區域佔多少，右邊列出件數、佔比和<b>比上期 ▲▼ %</b>（上月／上季／去年，本期還沒過完就比到同一天）；前 5 名各一塊，其餘合成灰色的「其它區域」。<b>點一塊或右邊清單</b>就列出那個區域的案件。</p><p><b>曲線圖</b>${gN(2)}：各缺失區域每個時間點幾件（選年看 12 個月、選季看 3 個月、選月看每週），看哪一區最近變多或變少；滑過看數字、點圓點看那個月的案件、點圖例只看一條線。</p><p>要看<b>各區域的年、季、月分析、跟上期比、下載 Excel／Word</b>，按右上角「🗺️ 到廠區地圖看各區細部分析」（見廠區地圖使用說明第 12 步）。</p><p class="muted small">同一個區域在圓餅圖和曲線圖是同一個顏色。區域名稱寫法不同（例：1F倉儲區、1樓倉儲區）會被當成兩區，可以到「常用選項」合併。</p>`),

      `<p>畫多邊形、拖曳畫方形、拖角修改時，<b>🧲 磁鐵</b>${gN(1)}（預設開）會輕輕把點吸到：</p><p>① <b>附近別的角</b>：相鄰的區域或分區角會完全重合，中間不留縫。<br>② <b>跟別的角對齊</b>：上下或左右對齊，邊就是筆直的。<br>③ <b>平面圖上的線條、色塊邊界</b>。</p><p>吸到時游標旁的小圓點會變<b>橘色</b>，並出現<b>橘色虛線</b>${gN(2)}，點下去前就知道位置。只有靠近 10 個像素以內才會吸，遠一點就照你點的位置。</p><p>想放在線旁邊不要被吸，<b>按住 Alt 再點</b>${gN(3)}；或按「🧲 磁鐵」關掉。缺失區域、清潔分區、動線箭頭、門窗標記都適用。</p><p class="muted small">色塊分明的平面圖效果最好；手繪或照片拍的平面圖可能會吸到文字，按住 Alt 就好。</p>`),
    gStep(5,'⌨️ 快捷鍵：刪除、複製、貼上', gC(gR(`${gN(1)}<span class="gx-tag dk">Delete</span><span class="gx-s">刪除選取的物件</span>`)+gR(`${gN(2)}<span class="gx-tag dk">Ctrl</span>＋<span class="gx-tag dk">C</span><span class="gx-s">複製</span><span class="gx-tag dk">Ctrl</span>＋<span class="gx-tag dk">V</span><span class="gx-s">貼在滑鼠位置</span>`)+gR(`${gN(3)}<span class="gx-tag dk">Ctrl</span>＋<span class="gx-tag dk">Z</span><span class="gx-s">復原</span><span class="gx-tag dk">Esc</span><span class="gx-s">取消畫圖／取消選取</span>`)+gR(`<span class="gx-tag dk">R</span><span class="gx-s">門、冷氣等標記轉 90°</span>`),'編輯模式，先點一下要處理的物件'),
      `<p>在「✏️ 編輯模式」先<b>點一下</b>分區、箭頭、門窗標記、易碎品或病媒防治設施：</p><p>按 <b>Delete</b>${gN(1)} 直接刪除；刪錯了按 <b>Ctrl＋Z</b>${gN(3)} 救回來。</p><p>按 <b>Ctrl＋C</b> 複製、<b>Ctrl＋V</b>${gN(2)} 貼上：會貼在<b>滑鼠所在的位置</b>；連按 Ctrl＋V 會往右下錯開，不會疊在一起。適合一次放很多個一樣的門、鼠板站或捕蟲燈；易碎品、病媒設施貼上時會自動給新編號。也可以切換地圖，把東西貼到另一張地圖。</p><p><b>Esc</b> 取消正在畫的線或多邊形，或取消選取；選了門、冷氣等標記按 <b>R</b> 轉 90°。</p><p class="muted small">缺失區域和位置因為有案件資料，按 Delete 會先跳確認，而且不能複製（名稱不能重複）。打字的時候（輸入框裡）快捷鍵不會作用。Mac 用 ⌘ 代替 Ctrl。</p>`),
    gStep(6,'放位置、參考照片', gC(gR(`${gB('📍 新增位置',{hl:1,n:1})}`)+gR(`${gTag('P01','dk')}${gTag('P03','rd')}<span class="gx-s">打漿機／地面及排水溝</span>`)) + gC(gR(`<span class="gx-ph"></span><span class="gx-ph b"></span>${gB('＋ 加參考照片',{hl:1,n:2})}`)+`<div class="gx-dash">📋 點這裡，再按 Ctrl+V 貼上</div>`,'📷 參考照片（正常狀態）'),
      `<p>按「📍 新增位置」${gN(1)}，在區域框裡點一下，輸入<b>位置編號</b>（例：P03、輸送帶），名稱可以之後在右邊補。</p><p><b>舊案件補位置</b>：打開缺失單，在「細部位置（廠區地圖）」選位置；<b>已結案的也可以補</b>（只改位置，選了就自動存）。缺失區域名稱跟地圖不一樣時（例：打漿區2樓），先選「對應到地圖區域」再選位置。已結案的<b>負責單位</b>也可以改得更細（例：生產課／打漿組），改完自動存。</p><p>編輯模式點區域或位置，「＋ 加參考照片」${gN(2)}放正常、清潔時的樣子；也可以點虛線框按 <b>Ctrl+V</b> 貼上。</p>`),
    gStep(7,'看缺失、新增缺失、匯出', gC(gR(`<span class="gx-k">3<small>累計</small></span><span class="gx-k b">2<small>未結案</small></span><span class="gx-k rd">1<small>逾期</small></span>`)+gR(gB('＋ 在「打漿區」新增缺失',{dk:1,hl:1,n:1}))+gR(gB('📗 匯出這個區域（Excel）',{hl:1,n:2})),'🏭 打漿區'),
      `<p>檢視模式點區域或位置，右邊會出現件數與歷史缺失。</p><p>「＋ 新增缺失」${gN(1)}自動帶入區域、位置、負責單位；「📗 匯出這個區域」${gN(2)}依類別由多到少，含改善前後照片。</p><p>從地圖（右邊歷史缺失、地圖統計跳出的清單）點進缺失單後，左上角會變成<b>「← 回廠區地圖」</b>，按下去回到剛剛那個區域和畫面位置；存檔、結案後也會自動回來。從統計分析點進去的則是「← 回統計分析」。</p>`),
    gStep(8,'現場稽核', gC(gR(`${gB('＋ 新增稽核重點',{n:1})}${gB('載入範例')}`)+gR(gB('📋 開始稽核',{ok:1,hl:1,n:2}))) + gC(gR(`<span class="gx-s" style="flex:1">排水溝清潔暢通</span>${gN(3)}${gB('✅ 合格',{ok:1})}${gB('❌ 不合格',{rd:1,hl:1})}`)),
      `<p>點地圖上的區域，右邊「稽核重點」按「＋ 新增稽核重點」${gN(1)}寫清楚<b>查核標準</b>（或載入範例 8 項）；<b>檢視、編輯模式都可以</b>新增、編輯、刪除。</p><p>每一項稽核重點可以放照片給稽核人員對照：<b>✅ 應有的樣子</b>（正常、清潔時）和 <b>❌ 不合格範例</b>（髒污、不符合時），各最多 3 張，可以直接 📸 拍照；右邊清單會顯示小圖。「<b>📗 匯出稽核重點（含圖片）</b>」可以選只匯出這一區，或這張地圖全部區域，做成一份有照片的稽核標準表。</p><p><b>區域很大、稽核點很多時</b>：建議先在區域裡放好「細部位置」（例：P01 洗手台、P02 輸送帶），稽核重點選「對應位置」；開始稽核時上方會出現位置按鈕，可以<b>照位置一段一段稽核</b>，按鈕上會顯示還沒填幾項。</p><p>右邊的「細部位置」「稽核紀錄」「稽核重點」「參考照片」標題都可以<b>點一下收合</b>，開／關會記住。</p><p>到現場按「📋 開始稽核」${gN(2)}，每項選${gN(3)}：✅ 合格、❌ 不合格（可「＋ 建立缺失」）、👁 觀察事項、⊘ 不適用。稽核頁上方有<b>📖 怎麼用</b>（可收合）和這一區的<b>參考照片</b>；對應到位置的項目旁邊也有那個位置的參考照片，點一下看大圖。</p><p>不合格、觀察事項的說明以「<b>現場稽核發現</b>」開頭；按 <b>📸 開相機拍照</b>直接用手機相機拍，或 🖼 從相簿選；拍好的照片點一下看大圖、按 ✕ 刪掉。</p>`),
    gStep(9,'風險顏色、連續發生警示、地圖統計', gC(gR(`${gB('🎨 風險顏色（開）',{dk:1,hl:1,n:1})}`)+gR(`<span class="gx-sw" style="background:#b42318"></span><span class="gx-s">重大／逾期／重複</span><span class="gx-sw" style="background:#d97706"></span><span class="gx-s">未結案</span><span class="gx-sw" style="background:#167a3e"></span><span class="gx-s">都結案</span>`)) + gC(gR(`${gN(2)}${gTag('年度','dk')}${gTag('每季')}${gTag('每月')}${gTag('自訂')}`),'📊 地圖統計'),
      `<p>檢視模式依缺失狀況自動上色${gN(1)}：紅＝重大、逾期或<b>重複發生</b>；黃＝有未結案；綠＝都結案；灰＝沒紀錄。</p><p><b>⚠ 連續發生警示</b>：同一位置同一類缺失<b>連續 3 個月</b>都發生，位置標記會閃動並加 ⚠，右邊面板會提醒檢討根本原因。</p><p>地圖下方「📊 地圖統計」${gN(2)}選期間（年度、每季、每月，按 ◀ ▶ 跳上一期／下一期；或全部期間、最近三個月、最近六個月、自訂）；<b>點某個區域時，統計會變成那一區各位置的分布</b>，按「看全部區域」回到全廠。</p><p class="muted small">地圖統計的數字卡和長條都可以點開看案件，見第 10 步。</p>`),
    gStep(10,'📊 地圖統計：點開看案件', gC(gR(`<span class="gx-k">8<small>缺失總數</small></span>${gN(1)}<span class="gx-k b" style="box-shadow:0 0 0 2px var(--gold)">2<small>未結案</small></span><span class="gx-k rd">2<small>逾期</small></span>`)+gR(`<span class="gx-s" style="width:52px">包裝區</span><span style="flex:1;height:8px;border-radius:4px;background:#16213a;max-width:120px"></span><span class="gx-s">7</span>${gN(2)}`),'📊 地圖統計') + gC(gR(`<span class="gx-s" style="flex:1"><b>QA-001</b>　包裝區　待改善（逾期）</span>${gN(3)}`)+gR(`<span class="gx-s" style="flex:1"><b>QA-002</b>　包裝區　待改善</span>`)+gR(`<span style="flex:1"></span>${gB('關閉',{dk:1})}`),'未結案　一樓・全部區域・全部期間 2 件'),
      `<p>地圖下方「📊 地圖統計」的<b>數字卡</b>${gN(1)}可以點：缺失總數、未結案、逾期、重複發生、連續 3 個月警示、改善完成率（列出已結案的）。</p><p><b>長條</b>${gN(2)}也可以點：各區域（或各位置）、缺失類型、月份趨勢，會列出那一項的案件。</p><p>跳出的清單${gN(3)}上方寫著範圍（地圖・區域・期間），未結案排前面；<b>點案件就直接打開</b>，可以補資料或結案。</p><p class="muted small">範圍跟著上方選的期間；點了地圖上某個區域，就只列那一區。「廠區」「已建立位置」「最近稽核不合格」不是缺失案件，不能點。</p>`),
    gStep(11,'📊 地圖統計：區域分布圓餅圖與趨勢', gC(gR(`<svg viewBox="0 0 120 120" style="width:84px;height:84px;flex:none"><circle cx="60" cy="60" r="44" fill="none" stroke="#2a78d6" stroke-width="20" stroke-dasharray="96 400" transform="rotate(-90 60 60)"/><circle cx="60" cy="60" r="44" fill="none" stroke="#eb6834" stroke-width="20" stroke-dasharray="0 98 64 400" transform="rotate(-90 60 60)"/><circle cx="60" cy="60" r="44" fill="none" stroke="#1baf7a" stroke-width="20" stroke-dasharray="0 164 44 400" transform="rotate(-90 60 60)"/><circle cx="60" cy="60" r="44" fill="none" stroke="#9aa3b2" stroke-width="20" stroke-dasharray="0 210 66 400" transform="rotate(-90 60 60)"/><text x="60" y="66" text-anchor="middle" font-size="20" font-weight="800" fill="#16213a">90</text></svg><span style="display:flex;flex-direction:column;gap:3px;font-size:11px;flex:1"><span><i style="display:inline-block;width:9px;height:9px;background:#2a78d6;border-radius:2px"></i> 包裝區　<b>28</b>　31%</span><span><i style="display:inline-block;width:9px;height:9px;background:#eb6834;border-radius:2px"></i> 打漿區　<b>19</b>　21%</span><span><i style="display:inline-block;width:9px;height:9px;background:#1baf7a;border-radius:2px"></i> 緩衝區　<b>12</b>　13%</span><span><i style="display:inline-block;width:9px;height:9px;background:#9aa3b2;border-radius:2px"></i> 其它區域</span></span>${gN(1)}`),'各區域缺失分布') + gC(`<svg viewBox="0 0 200 60" style="width:100%;height:auto;display:block"><line x1="6" x2="196" y1="54" y2="54" stroke="#c9bda6"/><polyline points="6,40 44,30 82,20 120,34 158,26 196,10" fill="none" stroke="#2a78d6" stroke-width="2"/><polyline points="6,46 44,42 82,36 120,30 158,40 196,38" fill="none" stroke="#eb6834" stroke-width="2"/><polyline points="6,50 44,48 82,44 120,46 158,36 196,44" fill="none" stroke="#1baf7a" stroke-width="2"/></svg>`+gR(`<span class="gx-s">${gN(2)}各區域每月件數（最近 6 個月）</span>`)),
      `<p>地圖下方「📊 地圖統計」最下面有兩張圖，範圍跟著上方選的期間：</p><p><b>圓餅圖</b>${gN(1)}：這張地圖<b>全部區域</b>的缺失各佔多少（每一區一塊、顏色都不一樣；折線圖還是前 5 名＋其它，線太多會看不清楚），清單右邊有<b>比上期 ▲▼ %</b>；<b>點一塊或右邊清單</b>列出那一區的案件。</p><p><b>折線圖</b>${gN(2)}：各區域每個時間點幾件——選年看 12 個月、選季看 3 個月、選月看每週；圖例旁的 ▲▼ % 是合計比上期，滑過某一點是比前一個月（週）。點圓點看那個時間的案件。</p><p><b>點地圖上某個區域</b>時，兩張圖會自動變成<b>那一區各位置</b>的分布和趨勢（沒指定位置的算「未指定位置」）；按「看全部區域」回到全廠。</p>`),
    gStep(12,'📋 各區域分析：年、季、月與下載', gC(gR(`${gN(1)}${gTag('年度','dk')}${gTag('每季')}${gTag('每月')}<span class="gx-s">◀ 2026 年 ▾ ▶</span>`)+gR(`<div style="font-size:11px;width:100%"><div style="display:grid;grid-template-columns:2fr 1fr 1.3fr 1fr;gap:2px;background:#f3ece0;padding:3px 4px;border-radius:4px;font-weight:700"><span>區域</span><span>件數</span><span>跟上期比</span><span>結案率</span></div><div style="display:grid;grid-template-columns:2fr 1fr 1.3fr 1fr;gap:2px;padding:3px 4px"><span>包裝區</span><b>26</b><b style="color:#b42318">▲ +11（+73%）</b><span>65%</span></div><div style="display:grid;grid-template-columns:2fr 1fr 1.3fr 1fr;gap:2px;padding:3px 4px"><span>出貨平台</span><b>4</b><b style="color:#167a3e">▼ −6（−60%）</b><span>25%</span></div></div>${gN(2)}`),'📊 地圖統計') + gC(gR(`${gB('📗 下載區域分析（Excel）',{hl:1,n:3})}`)+gR(`${gB('📄 下載區域分析（Word）',{dk:1,hl:1,n:4})}`)),
      `<p>「📊 地圖統計」選<b>年度、每季或每月</b>${gN(1)}，再選年份、第幾季或幾月；按 <b>◀ ▶</b> 可以直接跳上一期／下一期（跨年會自動換年份）。整個統計（數字卡、長條、圓餅圖、折線圖）都跟著換。右邊另一組可以選全部期間、最近三個月、最近六個月或自訂日期。折線圖選年看 12 個月、選季看 3 個月、選月看每週。</p><p><b>📋 各區域分析表</b>${gN(2)}：每一區的件數、<b>跟上期比</b>（▲ 紅色＝變多、▼ 綠色＝變少，括號是<b>幾 %</b>）、未結案、逾期、結案率、重複發生、最多的類別。上期＝選月比上個月、選季比上一季、選年比<b>去年同期</b>；這個月／這一季還沒過完時，上期只算到同一天。</p><p><b>▲▼ 百分比</b>也會出現在「缺失總數」「重複發生」數字卡、各區域與類型長條、圓餅圖清單、折線圖圖例（跟上期比）；「缺失趨勢」長條和折線圖滑過的數字是跟<b>前一個月（選月時前一週）</b>比。未結案、逾期不比百分比，因為越早的案件有越多時間結案，比起來不公平。數字可以點開看案件；點地圖上某一區，表格就變成那一區各位置。</p><p><b>📍 各區域位置缺失次數</b>：看全部區域時，下面會把<b>每一區的各位置件數</b>一次列出來（每區一張小卡，多到少、0 件也列出、比上期 ▲▼），不用一區一區點；點一列看案件，按「看地圖」跳到那一區。</p><p><b>📗 Excel</b>${gN(3)}：四段——各區域總表、區域 × 月份（或週）、區域 × 缺失類別、各區域的位置明細，可以自己排序、畫圖。</p><p><b>📄 Word</b>${gN(4)}：一頁摘要（哪幾區變多、變少）＋總表＋<b>平面圖</b>（每個區域、位置旁用紅色數字寫<b>選的期間（月／季／年）發現幾件缺失</b>）＋<b>圓餅圖、折線圖</b>＋各表格，可以直接列印交報告。</p><p class="muted small">統計分析頁的「📍 缺失區域分析」也有「🗺️ 到廠區地圖看各區細部分析」按鈕可以直接過來。</p>`),
    gStep(13,'給同事用同一張地圖', gC(gR(`${gB('匯出地圖設定',{hl:1,n:1})}${gB('匯入地圖設定',{hl:1,n:2})}`)) + `<div class="gx-s" style="text-align:center">含平面圖・區域・位置・稽核重點・參考照片<br>＋清潔分區・易碎品・動線・病媒防治・顏色設定<br>不含案件，不會蓋掉同事的案件</div>`,
      `<p>按「匯出地圖設定」${gN(1)}存成檔案給同事，同事按「匯入地圖設定」${gN(2)}就有同一張地圖。</p><p>「匯出地圖設定」包含<b>所有圖層</b>（清潔分區、易碎品、動線、病媒防治）和顏色設定；只有地圖，不含案件、稽核紀錄、易碎品檢查紀錄。</p><p>要放進報告或貼公告時，按上方<b>「🖼 匯出平面圖（圖片）」</b>，會把目前這一層存成清晰的 PNG：平面圖多的空白會自動裁掉、放大到約佔 8～9 成寬（四周留一點白，邊緣的標記不會被切掉），附圖例（缺失層依目前風險顏色開／關）。</p><p class="muted small">要連案件一起帶走，請用缺失清單的「下載備份」。平面圖屬公司內部資料，不會上傳也不會送給 AI；匯出的圖片傳給別人前請先確認可以外流。</p>`),
    gStep(14,'切換圖層（缺失以外的圖）', gC(gR(`${gN(1)}<span class="gx-seg" style="flex-wrap:wrap"><i class="on">🔍 缺失</i><i>🧼 清潔分區</i><i>🔶 易碎品</i><i>➡️ 動線與設施</i><i>🐭 病媒防治</i></span>`)+gR(`${gB('🧼 疊清潔分區（開）',{dk:1,hl:1,n:2})}${gB('🖼 匯出平面圖（圖片）',{hl:1,n:3})}`)),
      `<p>地圖上方有一排圖層${gN(1)}，每一層<b>分開畫、分開看</b>，不會跟缺失混在一起；平面圖只要上傳一次，五層共用。</p><p>易碎品、動線、病媒這三層可以按「🧼 疊清潔分區」${gN(2)}，把分區淡淡地墊在底下對照。</p><p>在哪一層按「🖼 匯出平面圖（圖片）」${gN(3)}，就匯出<b>那一層</b>的清晰 PNG，下方附圖例。</p>`),
    gStep(15,'🧼 清潔分區', gC(gR(`${gIn('準清潔區 ▾',1)}${gN(1)}${gB('▭ 畫分區（拖曳）',{hl:1,n:2})}${gB('⬠ 多邊形分區',{hl:1})}`)+gR(`<span class="gx-sw" style="background:#c4bb7c"></span><span class="gx-s">一般作業區</span><span class="gx-sw" style="background:#b9cde5"></span><span class="gx-s">準清潔區</span><span class="gx-sw" style="background:#e6b9b8"></span><span class="gx-s">清潔區</span>`)) + gC(gR(`${gIn('包裝區 ▾')}${gIn('準清潔區 ▾')}`)+gR(gB('複製成清潔分區',{hl:1,n:3})),'📋 從缺失區域複製範圍'),
      `<p>切到「✏️ 編輯模式」，先選<b>分區種類</b>${gN(1)}，再按「▭ 畫分區」${gN(2)}在平面圖上拖曳；L 型等不規則形狀用「⬠ 多邊形分區」，每個角點一下；<b>🧲 磁鐵</b>會幫你貼齊色塊邊界和旁邊分區的角（見第 4 步）。</p><p>分區跟缺失區域一樣大時，右邊「從缺失區域複製範圍」${gN(3)}，不用重畫。</p><p>點分區可以改種類、取名稱（例：包裝室）、寫說明；拖白色方塊改角、拖「＋」加角。畫好後可以「🔒 鎖定分區」避免拖到。</p><p><b>🔤 文字在顏色上</b>（預設開）：分區顏色像螢光筆一樣<b>墊在底稿文字下面</b>，黑字照樣清楚，白底平面圖效果最好；如果底稿本身有顏色、疊起來顏色怪怪的，按一下關掉，改成半透明蓋在上面。</p><p><b>🎨 分區顏色 淡／濃</b>：地圖上方的滑桿可以調分區的透明程度，往「淡」拉底稿的字比較清楚、往「濃」拉顏色比較明顯；<b>顏色本身不變</b>，匯出圖片也照這個濃淡。</p><p class="muted small">顏色預設：一般作業區卡其、準清潔區淺藍、清潔區淺粉；編輯模式右邊「🎨 圖例顏色」可以改。</p>`),
    gStep(16,'🔶 易碎品：標示', gC(gR(`${gIn('攝影機 ▾',1)}${gN(1)}${gB('放置',{hl:1,n:2})}`)+gR(`<img src="${fragIcon('clock')}" alt="" style="width:22px;height:22px"><span class="gx-s">時鐘</span><img src="${fragIcon('camera')}" alt="" style="width:22px;height:22px"><span class="gx-s">攝影機</span><img src="${fragIcon('glass')}" alt="" style="width:22px;height:22px"><span class="gx-s">玻璃</span><img src="${fragIcon('plastic')}" alt="" style="width:22px;height:22px"><span class="gx-s">塑膠</span>`)+gR(`<span class="gx-tag" style="background:#f59e0b;color:#3b2500;border-color:#fff">◆ G05</span><span class="gx-s">其它（自己打字，不用圖）</span>`)) + gC(gR(`${gIn('材質：玻璃')}${gIn('數量：2')}`)+gR(`${gIn('每 1 個月 ▾',1)}${gN(2)}`),'🔶 G01 燈罩'),
      `<p>編輯模式先選<b>種類</b>${gN(1)}：<b>時鐘、攝影機、玻璃、塑膠</b>有圖示；不在這四種的選「其它（自己打字）」，標記用 ◆ 編號、不用圖。</p><p>按「放置」${gN(2)}後在所在位置<b>點一下就放好</b>（跟病媒防治一樣，不會跳視窗），編號自動編 <b>G01、G02…</b>；名稱先用種類（例：時鐘、玻璃），「其它」先叫「其它易碎品」，之後點標記在右邊改名稱（例：觀察窗玻璃、塑膠籃）。可以連續放，放完按「■ 停止放置」。點標記也可以改種類。</p><p>點標記可以填材質、數量、位置說明、加參考照片（可 Ctrl+V 貼上）。</p><p><b>檢查頻率</b>${gN(2)}：預設<b>每個月一次</b>，右邊面板可改成每 2、3、4、6、12 個月；個別項目也可以單獨設定。</p><p>「📗 匯出易碎品清單（Excel）」含最近檢查日、下次檢查日與檢查紀錄。</p>`),
    gStep(17,'🔶 易碎品：定期檢查', gC(gR(gB('📝 開始易碎品檢查',{dk:1,hl:1,n:1}))+gR(`<span class="gx-s" style="flex:1">G01 燈罩</span>${gN(2)}${gB('✅ 完整',{ok:1})}${gB('❌ 破損',{rd:1,hl:1})}${gB('❓ 遺失')}`)+gR(gB('＋ 建立缺失',{dk:1,hl:1,n:3}))) + gC(gR(`<img src="${fragIcon('clock')}" alt="" style="width:22px;height:22px"><span class="gx-tag" style="background:#f59e0b;color:#3b2500;border-color:#fff">G01</span><span class="gx-s">正常</span><img src="${fragIcon('camera')}" alt="" style="width:22px;height:22px"><span class="gx-tag" style="background:#f59e0b;color:#3b2500;box-shadow:0 0 0 2px #b42318">G02 !</span><span class="gx-s">到期未檢查</span>`)+gR(`<img src="${fragIcon('glass')}" alt="" style="width:22px;height:22px"><span class="gx-tag" style="background:#b42318;color:#fff">G03</span><span class="gx-s">破損</span>`),'編號標籤的顏色'),
      `<p>按「📝 開始易碎品檢查」${gN(1)}，逐項選${gN(2)}：✅ 完整、❌ 破損、❓ 遺失、⊘ 不適用；沒問題的可以按「其餘全部 ✅ 完整」。</p><p>儲存後，破損或遺失的項目按「＋ 建立缺失」${gN(3)}，自動帶入區域與描述，接到缺失追蹤；破損要確認碎片有沒有污染產品。</p><p>圖示旁的<b>編號標籤</b>會提醒你：<b>橘框</b>＝7 天內要檢查、<b>紅框＋!</b>＝到期沒檢查、<b>整顆紅</b>＝上次檢查破損或遺失。</p>`),
    gStep(18,'➡️ 動線與設施', gC(gR(`${gIn('物流（原料） ▾',1)}${gN(1)}${gB('✏️ 畫箭頭',{hl:1,n:2})}`)+gR(`<span class="gx-s" style="color:#e46c0a;font-weight:800">──➜ 人流</span><span class="gx-s" style="color:#ff0000;font-weight:800">──➜ 原料</span><span class="gx-s" style="color:#c00000;font-weight:800">╌╌➜ 成品</span><span class="gx-s" style="color:#7f0000;font-weight:800">┄┄➜ 廢棄物</span>`)+gR(`<span class="gx-s" style="color:#0070c0;font-weight:800">──➜ 氣流</span><span class="gx-s" style="color:#a6a6a6;font-weight:800">──➜ 水流</span>`)) + gC(gR(`<span class="gx-sw" style="background:#0d0d0d"></span><span class="gx-s">門</span><span class="gx-sw" style="background:#00b050"></span><span class="gx-s">冷氣</span><span class="gx-sw" style="background:#7030a0"></span><span class="gx-s">抽風口</span><span class="gx-sw" style="background:#ff77ff"></span><span class="gx-s">水源</span><span class="gx-sw" style="background:#984807"></span><span class="gx-s">水溝</span>`)+gR(`${gN(3)}<span class="gx-s">點圖例＝隱藏／顯示</span>`),'設施標記（粗線）'),
      `<p>編輯模式先選<b>種類</b>${gN(1)}，按「✏️ 畫箭頭」${gN(2)}：從起點開始，一個轉彎點點一下，最後一點會變成箭頭；在最後一點<b>再點一下</b>或按「完成這條」結束，可以接著畫下一條。</p><p>物流分三種：<b>原料實線、成品虛線、廢棄物點線</b>，起點標「原／成／廢」。畫反了，點箭頭按「⇄ 反轉方向」。</p><p>門、冷氣、抽風口、水源供應處、水溝／排水孔選好後按「✏️ 畫標記」，在平面圖上<b>拖曳</b>畫一段粗線：<b>直的門上下拖、橫的門左右拖</b>，接近水平或垂直會自動拉直。已經畫好的，點一下按「↻ 轉 90°」（或鍵盤 <b>R</b>）就能橫的變直的。</p><p>檢視模式點上方圖例${gN(3)}可以只看某幾種（例如只看人流），匯出圖片也只會有顯示中的。</p>`),
    gStep(19,'🐭 病媒防治', gC(gR(`${gIn('鼠板站（黏鼠板） ▾',1)}${gN(1)}${gB('放置',{hl:1,n:2})}`)+gR(`<img src="${pestIcon('light')}" alt="" style="width:22px;height:22px"><span class="gx-s">捕蟲燈 L01</span><img src="${pestIcon('board')}" alt="" style="width:22px;height:22px"><span class="gx-s">鼠板站 B01</span><img src="${pestIcon('bait')}" alt="" style="width:22px;height:22px"><span class="gx-s">鼠餌站 R01</span>`)) + gC(gR(gB('📗 匯出病媒防治設施清單（Excel）',{hl:1,n:3}))+gR(gB('＋ 在這裡建立缺失（病媒防治）',{dk:1,hl:1,n:4}))),
      `<p>編輯模式先選<b>設施種類</b>${gN(1)}，按「放置」${gN(2)}後在平面圖上點一下；可以連續放，放完按「■ 停止放置」。</p><p>不在這三種的選<b>「其它（自己打字）」</b>：旁邊先打<b>名稱</b>（例：誘蚊燈）、選<b>圖示</b>（蟑螂、蒼蠅、蚊子、螞蟻、鳥、噴藥、捕鼠籠、黏蟲紙、？，或用上面三種的圖），之後放的每一個都<b>固定</b>是這個名稱和圖示。編號<b>依圖示各自從 01 算</b>：蚊子 M01、M02…，蟑螂 C01…，蒼蠅 F01…，螞蟻 A01…，鳥 W01…，噴藥 S01…，捕鼠籠 K01…，黏蟲紙 G01…，？ O01…（用捕蟲燈／鼠板站／鼠餌站的圖則是 OL、OB、OR）。放好後換圖示，編號也會自動換成新圖示的下一號（自己改過編號的就照你打的）。</p><p>打過的名稱會<b>記住</b>，下次在種類選單「自己打過的」直接選；不要了按「✕ 移除」。放好後點圖示，右邊也可以再改名稱、換圖示（檢視、編輯模式都可以；移動、刪除要在編輯模式）。右邊的數量統計、圖例、匯出圖片都會用<b>你選的圖示＋名稱</b>各自一格（例：🧴 噴藥 4）；「📗 匯出病媒防治設施清單」第一欄也會放每一個設施的圖示。</p><p>圖示：<b>紫色的蟲＝捕蟲燈</b>、<b>黏鼠板＝鼠板站</b>、<b>老鼠＝鼠餌站</b>；編號自動編 L01／B01／R01，點圖示可以改編號、寫位置說明。</p><p>「📗 匯出設施清單」${gN(3)}給病媒防治廠商或稽核用；現場發現蟲鼠問題，點圖示按「＋ 建立缺失」${gN(4)}，類別預設 05 病媒防治。</p><p class="muted small">這幾張圖會露出工廠動線與設施位置，傳給外面的人前請先確認可以外流。</p>`)
  ]},

      `<p>在缺失清單按「刪除」${gN(1)}，案件會移到「最近刪除」，<b>保留 30 天</b>。</p><p class="muted small">已結案的案件不能刪除。</p>`),

async function listDelete(){
  const ids = [...listSel].filter(id=>{ const r=records.find(x=>x.id===id); return r && !r.closed && !r.deleted; });
  if(!ids.length) return;
  if(!(await ask(`確定要刪除選取的 ${ids.length} 筆嗎？`))) return;
  const done = [];
  records.forEach(r => { if(ids.includes(r.id)){ r.deleted = true; r.deletedAt = today(); done.push(r); } });
  if(!persistAll()){ done.forEach(r=>{ r.deleted=false; delete r.deletedAt; }); return; }
  listSel = new Set(); showList(); flash('已移到「最近刪除」（'+done.length+' 筆）');
}

  const v = (document.querySelector('#side button.on')||{}).dataset?.v || '';

  if(v==='map'){ const pv = $('#mapView'); return {to:'map', mapId:MV.mapId, sel:MV.sel ? {...MV.sel} : null, layer:MV.layer, mode:MV.mode, y:scrollY, sl:pv?pv.scrollLeft:0, st:pv?pv.scrollTop:0}; }
  if(v==='stats') return {to:'stats', y:scrollY};
  if(v==='') return RET;   /* 已經在缺失單裡（例：重新打開）→ 保留原本的返回位置 */

}
const retLabel = () => RET ? ({map:'← 回廠區地圖', stats:'← 回統計分析', audit:'← 回稽核紀錄'})[RET.to] : '← 返回清單';
async function goBack(){
  const R0 = RET; if(!R0){ showList(); return; }
  if(dirty && !(await ask('有尚未儲存的修改，確定要離開嗎？'))) return;
  cur = null; dirty = false; RET = null;
  if(R0.to==='audit'){ auditView(R0.id); }
  else if(R0.to==='stats'){ setSide('stats'); renderStats(); }
  else { setSide('map'); if(MAPD.maps.find(m=>m.id===R0.mapId)) MV.mapId = R0.mapId; MV.layer = R0.layer || 'defect'; MV.mode = R0.mode || MV.mode; MV.tool = ''; MV.poly = null;
    MV.sel = R0.sel && (R0.sel.t==='area' ? areaById(R0.sel.id) : locById(R0.sel.id)) ? R0.sel : null; NO_SIDE_SCROLL = true; try{ renderMap(); } finally { NO_SIDE_SCROLL = false; }
    const pv = $('#mapView'); if(pv){ pv.scrollLeft = R0.sl||0; pv.scrollTop = R0.st||0; } }
  requestAnimationFrame(() => window.scrollTo(0, R0.y||0));
}

function refresh(){
  const r = cur;
  $('#stBadge').innerHTML = r.id ? badges(r) : '';
  $('#dirtyMark').innerHTML = dirty ? '<span class="dirty">● 有尚未儲存的修改</span>' : '';

  const hints = ruleHints(r);
  let hintHtml = hints.length ? `<div class="notice ${r.category==='major'?'bad':'warn'}"><b>依管理程序應辦理：</b><ul>${hints.map(h=>`<li>${esc(h)}</li>`).join('')}</ul></div>` : '';
  if(isOverdue(r)) hintHtml += `<div class="notice bad"><b>已逾期：</b>改善期限 ${fmtDate(r.deadline)} 已過，尚未複查通過，請持續追蹤。</div>`;
  $('#ruleHint').innerHTML = hintHtml;

  $('#ownerLab').classList.toggle('req', r.category==='schedule');
  $('#deadlineLab').classList.add('req');
  const de = showDlErr ? dlError(r) : '';
  $('#errDeadline').textContent = de;
  document.querySelector('[data-f=deadline]').classList.toggle('bad', !!de);

  const show = { risk: r.category==='major', cause: r.recurred };
  document.querySelectorAll('[data-show]').forEach(el => el.hidden = !show[el.dataset.show]);
  // 未要求時仍可填寫：若已有內容則顯示
  if(!show.risk && r.riskControl) document.querySelector('[data-show=risk]').hidden=false;
  if(!show.cause && r.causeAnalysis) document.querySelector('[data-show=cause]').hidden=false;

  if($('#typeHint')) $('#typeHint').textContent = typeHint(r.defType);
  const rv = $('#rvDate');
  if(rv){ rv.max = today(); if(r.foundDate) rv.min = r.foundDate; else rv.removeAttribute('min'); }
  renderReviews();
  renderClose();
  applyLock();
}

/* 欄位輸入即更新 */
document.addEventListener('input', onField);
document.addEventListener('change', onField);
function onField(e){
  const el = e.target; const f = el.dataset && el.dataset.f;
  if(!f || !cur) return;
  if(f==='ownerDept' && cur.closed){ cur.ownerDept = el.value; clearTimeout(OWNER_T); if(e.type==='change') ownerPatch(); else OWNER_T = setTimeout(ownerPatch, 600); return; }
  const oldFound = cur.foundDate, oldV = cur[f];
  cur[f] = el.type==='checkbox' ? el.checked : el.value;
  /* 預設帶入：缺失區域 → 負責單位；負責單位 → 改善執行單位；負責人 → 執行人。下面欄位自己改過（跟上面不一樣）就不再跟著變 */
  if(f==='area'){ const d0 = areaDeptDefault(oldV), d1 = areaDeptDefault(cur.area); if(d1 && (!cur.ownerDept || cur.ownerDept===d0)) followSet('ownerDept', d1); }
  if(f==='ownerDept') followTo('improveDept', oldV, cur.ownerDept);
  if(f==='ownerNote') followTo('improveNote', oldV, cur.ownerNote);
  if(f==='foundDate' && cur.foundDate && oldFound && dlIsDefault(cur, oldFound)){
    cur.deadline = addDays(cur.foundDate, dlDays(cur.category));
    document.querySelector('[data-f=deadline]').value = cur.deadline;
  }
  if(f==='area') locSelRefresh();
  if(f==='category'){ dlApplyDefault(); const h = $('#dlHint'); if(h) h.textContent = dlHint(cur.category); }
  if(f==='foundDate' && cur.foundDate && oldFound && cur.improveDate===addDays(oldFound,7)){
    cur.improveDate = addDays(cur.foundDate,7);
    document.querySelector('[data-f=improveDate]').value = cur.improveDate;
  }
  dirty = true;
  refresh();
}
/* 缺失區域的預設負責單位：廠區地圖上這一區設定的負責單位；沒有的話用這一區最近一筆案件的負責單位 */
function areaDeptDefault(area){ const k = nkey(area); if(!k) return '';
  const a = areaByName(area); if(a && a.unit) return a.unit;
  const r = live().filter(x=>x.id!==(cur&&cur.id) && nkey(x.area)===k && x.ownerDept && x.ownerDept!=='其它').sort((x,y)=>(y.foundDate||'').localeCompare(x.foundDate||''))[0];
  return r ? r.ownerDept : ''; }
function followSet(f, v){ const old = cur[f]; cur[f] = v; const el = document.querySelector(`[data-f="${f}"]`); if(el){ el.value = v; const box = el.closest('.combo'); if(box) comboSync(box); }
  if(f==='ownerDept') followTo('improveDept', old, v); }
function followTo(f, oldSrc, newSrc){ if(!cur[f] || cur[f]===oldSrc) followSet(f, newSrc||''); }

/* ---------- 照片 ---------- */
function addPhotos(field, input){
  const files = [...input.files]; input.value='';
  addPhotoFiles(field, files);
}
function addPhotoFiles(field, files){
  if(cur.closed){ say('已結案的案件不能再加照片。'); return; }
  if(!files.length) return;
  if(files.some(f=>!/^image\//.test(f.type))){ say('請上傳圖檔'); return; }
  if(cur[field].length + files.length > 10){ say('每個照片區最多 10 張'); return; }
  files.forEach(file => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 900, s = Math.min(1, max/Math.max(img.width,img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        const url = c.toDataURL('image/jpeg',0.6);
        if(PH.ok){
          const id = phNewId();
          phPut(id, url).then(() => { cur[field].push(id); dirty = true; renderPhotoBox(field); refresh(); })
            .catch(() => say('照片存不進去，瀏覽器的儲存空間可能已滿。請先「下載備份」，並封存舊的已結案案件。'));
          return;
        }
        cur[field].push(url);
        dirty = true; renderPhotoBox(field); refresh();
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- 文字整理（範本，非 AI） ---------- */
function tidy(s){
  s = String(s||'').trim().replace(/\s+/g,' ').replace(/,/g,'，').replace(/;/g,'；');
  if(s && !/[。！？.!?]$/.test(s)) s += '。';
  return s;
}
/* 去掉先前範本整理加上的開頭，避免再按時一層層疊上去 */
function stripPrefix(t){
  return String(t||'').trim().replace(/^(?:(?:\d{4}\/\d{1,2}\/\d{1,2}|【待補：發現日期】)於「[^」]*」巡查時發現：\s*)+/, '');
}
function makeDraft(){
  const r = cur, miss = [];
  if(!r.foundDate) miss.push('發現日期');
  if(!r.area.trim()) miss.push('缺失區域');
  if(!r.rawDesc.trim()) miss.push('缺失描述');
  if(!r.defType) miss.push('缺失類別');
  if(!r.category) miss.push('缺失等級（需品管／品保人員判定）');
  if(!ownerText(r)) miss.push('負責單位');
  if(r.category==='schedule' && !r.deadline) miss.push('改善期限');
  const P = t => `【待補：${t}】`;

  const desc = `${r.foundDate?fmtDate(r.foundDate):P('發現日期')}於「${r.area.trim()||P('缺失區域')}」巡查時發現：${tidy(stripPrefix(r.rawDesc))||P('缺失描述')}`;

  $('#draftBox').innerHTML = `<div class="subbox">
    <div class="small muted">以下為<b>範本整理草稿（非 AI 產生）</b>，僅使用你填寫的內容。可直接修改後再套用。</div>
    ${miss.length?`<div class="notice warn small"><b>資料不足，請補充：</b>${miss.map(esc).join('、')}</div>`:''}
    <label class="f" style="margin-top:8px">正式缺失內容（草稿）</label><textarea id="dDesc" rows="3">${esc(desc)}</textarea>
    <div class="row" style="margin-top:8px">

/* ---------- 產生分析（claude.ai 版才有；用各自的 Claude 帳號，不放任何金鑰） ---------- */
const AI_SYS = `你是食品工廠衛生稽核及缺失改善追蹤助手。請像稽核老師開立缺失單一樣，依據現場缺失事實、食品安全風險及工廠管理要求，替下面這筆衛生缺失判斷「缺失類別」、撰寫「缺失描述」，並依「缺失等級判定規則」建議缺失等級。

   (2) 管理問題：用「顯示……未落實」點出管理面的問題，優先使用下方「稽核用語庫」的說法；
   (3) 風險或改善要求：用「存在……風險」說明影響，再依缺失等級（品管已選等級時以品管選的為準，否則依你建議的等級）接一句改善要求——一般缺失用「要求立即改善」用語；限期改善缺失用「要求限期改善」用語；重大缺失用「立即採取必要管制措施、依不合格品管制程序辦理」；有勾選「已通知改善後再次發生」或「連續兩天發生」時，加上「重複缺失」用語；等級未判定時依內容選最適當的。

7. 「待人工確認事項」列出判定等級或撰寫描述所缺的資訊，包含這五點中沒提供的：①哪裡（區域＋設備或作業點）②看到什麼 ③多少（大概的量就好，例如一點點、一大片；不要求精確數字）④當時狀態（作業中、清洗後或停機）⑤附近有沒有產品、包材或食品接觸面；以及產品是否已隔離、是否流入後續製程或出貨等影響等級的事項。
8. 「建議改善期限」寫建議的天數或時限與理由（例：立即、24 小時內、7 天內），只供參考。
缺失等級判定規則：
一、缺失等級固定為三種
1. 一般缺失（可立即改善）
2. 限期改善缺失（需安排改善）
3. 重大缺失

不得自行新增等級，不得將缺失類別與缺失等級混為一談。

二、一般缺失（可立即改善）的判定條件
- 缺失程度輕微，影響範圍有限。
- 未發現明顯食品安全危害或重大污染風險。
- 屬偶發性或單一項目異常。
- 現場可立即完成改善。
- 改善後可確認異常已排除，且產品與製程仍在有效管制下。

若涉及食品污染、重要管制失效或其他重大風險，不得只因已立即改善而判定為一般缺失。

三、限期改善缺失（需安排改善）的判定條件
- 缺失涉及設備、設施、作業流程或管理制度不足。
- 需要安排維修、更換、採購、人力調度或跨部門協調。
- 相同缺失重複發生，顯示改善措施或預防再發機制不足。
- 需要原因分析、正式改善計畫、佐證資料或後續複查。
- 目前尚未達重大缺失程度，且暫時管制措施能有效控制食品安全風險。

如暫時管制無法有效控制風險，須立即採取更高強度的風險管制，不得僅以限期改善處理。

四、重大缺失的判定條件
符合下列任一重大風險情形時，應優先評估為重大缺失：
- 已發生嚴重食品污染或存在明確的重大食品安全風險。
- 食品遭受可能危害安全的生物性、化學性或物理性污染。
- 產品掉落地面後被回收投入製程或作為食品使用，造成污染風險。
- HACCP 重要管制點失控，且未依程序採取必要處置。
- 不合格產品未有效隔離，仍可能持續流入後續製程或出貨。
- 關鍵食品安全管制失效，或無法確認受影響產品的安全性。
- 其他依適用法規、驗證基準或工廠程序應立即採取重大風險管制的情形。

重大缺失應立即控制風險，必要時停止相關作業、隔離產品、通報主管，並評估影響範圍及後續處置。

五、判定必須考慮的因素
1. 食品安全風險。
2. 污染程度及污染來源。
3. 食品或食品接觸面的接觸情形。
4. 產品是否已隔離、流入後續製程或出貨。
5. 缺失發生頻率及是否重複發生。
6. 影響範圍及涉及批次。
7. 現有管制措施的有效性。
8. 改善難度及是否需要跨部門處理。
9. 改善及複查結果。
10. 適用法規、CAS 驗證基準、HACCP 計畫及工廠內部規定。

六、重要判定原則
- 不得單憑缺失名稱、數量或是否立即改善決定等級。
- 不得將所有重複缺失自動判定為重大缺失。
- 不得因產品尚未包裝，就直接認定沒有污染風險。
- 不得在缺乏證據時推測污染已發生或已排除。
- 若資訊不足，須列出待確認事項，並建議暫時風險管制及人工複核。
- 重大食品安全風險優先於改善所需時間。
- 缺失等級與改善狀態分開記錄；已改善不等於原缺失等級自動降低。
- 最終分級仍須依適用規範及工廠核定的缺失分級標準確認。

/* ---------- 儲存 / 刪除 ---------- */
function saveRecord(silent){
  const r = cur, miss = [];
  if(!r.foundDate) miss.push('發現日期');
  if(!r.area.trim()) miss.push('缺失區域');
  if(!r.rawDesc.trim()) miss.push('缺失描述');
  if(!r.defType) miss.push('缺失類別');
  if(!r.category) miss.push('缺失等級');
  { const a = recMapArea(r); r.areaManual = !!(a && !areaByName(r.area)); r.areaId = a ? a.id : ''; if(r.locId && !(a && mapAreaLocs(a.id).some(l=>l.id===r.locId))) r.locId = ''; }
  if(miss.length){ say('請先填寫：' + miss.join('、')); return false; }
  if(dlError(r)){
    showDlErr = true; refresh();
    const el = document.querySelector('[data-f=deadline]'); el.scrollIntoView({block:'center'}); el.focus();
    return false;
  }
  const isNew = !r.id;
  if(isNew){ r.id = genId(); r.createdAt = new Date().toLocaleString('zh-TW'); }
  r.updatedAt = new Date().toLocaleString('zh-TW');
  const backupList = records.slice();
  const i = records.findIndex(x=>x.id===r.id);
  const copy = JSON.parse(JSON.stringify(r));
  if(i>=0) records[i] = copy; else records.push(copy);
  if(!persist()){ records = backupList; if(isNew) r.id=''; return false; }
  dirty = false;
  if(isNew) auditLinkSaved(r.id); else AUDIT_LINK = null;
  try{ const used = (localStorage.getItem(KEY)||'').length + (localStorage.getItem(KEY_T)||'').length;
    if(used > 4000000 && !window.__warned){ window.__warned = true; say('提醒：本機儲存空間已用約 80% 以上。請盡快按「下載備份」，並考慮減少照片。'); } }catch(e){}
  storageWarn();
  if(isNew && !silent){ backOrList(); flash('已儲存 '+r.id); return true; }
  renderDetail();
  if(!silent) flash('已儲存');
  return true;
}
async function deleteRecord(){
  if(!(await ask('確定要刪除嗎？'))) return;
  const rec = records.find(x=>x.id===cur.id);
  if(!rec) return;
  rec.deleted = true; rec.deletedAt = today();
  if(!persistAll()){ rec.deleted = false; delete rec.deletedAt; return; }
  dirty = false; backOrList(); flash('已移到「最近刪除」');
}
function flash(t){
  const d = document.createElement('div');
  d.textContent = t;
  d.style.cssText = 'position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#16213a;color:#fffdf8;padding:8px 20px;border-radius:6px;z-index:99;box-shadow:0 2px 8px rgba(0,0,0,.2)';

}

     這時改成跳出「下載檔案」按鈕，讓使用者親手按一下再下載 */
  if(navigator.userActivation && !navigator.userActivation.isActive){
    const ok = await dialog('檔案已準備好：\n'+name, '⬇ 下載檔案', '取消');
    if(!ok) return;
  }
  try{
    const dl = (typeof claude!=='undefined' && claude && claude.use) ? await claude.use('downloads') : null;
    if(dl){ await dl.save({filename:name, data:new Blob([content],{type})}); return; }
  }catch(e){ if(e && e.code && e.code!=='unavailable') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content],{type}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- 備份 / 還原 ---------- */
/* 畫面設定（風險顏色、磁鐵、圖層、地圖高度、隱藏的圖例、說明展開…）：只帶設定，不含資料 */
const PREF_KEYS = ['mapH','mapZ','mapRisk','mapLock','mapStat','mapLayer','mapZbg','mapHide','mapSnap','mapSW','mapSec','audGuide','fcGuide'];
function prefsGet(){ const o = {}; try{ for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(!k.startsWith(KEY+'_')) continue; const n = k.slice(KEY.length+1); if(PREF_KEYS.includes(n) || n.startsWith('guide_')) o[n] = localStorage.getItem(k); } }catch(e){} return o; }
function prefsSet(o){ if(!o || typeof o!=='object') return; try{ Object.entries(o).forEach(([n,v])=>{ if((PREF_KEYS.includes(n) || /^guide_\w+$/.test(n)) && typeof v==='string') localStorage.setItem(KEY+'_'+n, v); }); }catch(e){} }
async function backup(){
  /* 備份檔裡放照片本身（不是編號），換電腦還原時照片才會跟著過去 */
  /* 完整備份：案件（含「最近刪除」）與照片、常用選項、廠區地圖全部圖層、稽核、易碎品檢查、畫面設定 */
  const rs = records.slice();
  await preloadPhotos(rs);
  const out = rs.map(r => Object.assign({}, r, { photos:r.photos.map(phSync).filter(Boolean), improvePhotos:r.improvePhotos.map(phSync).filter(Boolean) }));
  const mapImages = {}; for(const id of mapImageIds()){ mapImages[id] = await phGet(id); }
  const audits = await auditsForBackup();
  download(JSON.stringify({app:'qaHygieneTracker', version:3, exportedAt:new Date().toISOString(), records:out, tombs, opts:OPTS, map:MAPD, mapImages, audits, fragChecks:FRAGCHK, prefs:prefsGet()}, null, 1),
    `Casevoras_完整備份_${today()}.json`, 'application/json');
}
function restore(input){
  const file = input.files[0]; input.value='';
  if(!file) return;
  const fr = new FileReader();
  fr.onload = async () => {
    try{
      const data = JSON.parse(fr.result);
      if(!data || !Array.isArray(data.records)) throw 0;
      const incoming = data.records.filter(r=>!r.deleted), inTrash = data.records.filter(r=>r.deleted);
      const trashN = records.filter(r=>r.deleted).length;
      if(!(await ask(`備份檔內有 ${incoming.length} 筆紀錄${inTrash.length?`（另有「最近刪除」${inTrash.length} 筆）`:''}。\n還原會「取代」目前瀏覽器中的 ${live().length} 筆資料，目前「最近刪除」裡的 ${trashN} 筆案件也會一併被取代，${data.map&&Array.isArray(data.map.maps)&&data.map.maps.length?'\n備份裡的廠區地圖（含所有圖層）也會取代目前的地圖。':''}\n確定嗎？`))) return;
      const old = records, oldT = tombs.slice();
      const next = [...incoming, ...inTrash].map(r=>Object.assign(blankRecord(), migrate(r)));
      if(PH.ok){ try{ await phMoveOut(next); }catch(e){ say('照片存不進去，瀏覽器的儲存空間可能已滿，還原已取消，目前資料沒有變動。'); return; } }
      records = next;
      const have = new Set(tombs.map(t=>t.id));
      (Array.isArray(data.tombs)?data.tombs:[]).forEach(t=>{ if(t && t.id && !have.has(t.id)) tombs.push(t); });
      if(!persistAll()){ records = old; tombs = oldT; return; }
      /* 常用選項：跟目前的合併，不會刪掉現有的 */
      if(data.opts){ Object.keys(OPT_KINDS).forEach(k=>{ OPTS[k] = optList([...OPTS[k], ...optList(data.opts[k])]); }); OPTS.holidays = holList([...(OPTS.holidays||[]), ...holList(data.opts.holidays)]); saveOpts(); }
      /* 備份裡有廠區地圖時，一起還原（取代目前的地圖） */
      if(data.map && Array.isArray(data.map.maps) && data.map.maps.length) await mapApply(data.map, data.mapImages);
      if(Array.isArray(data.audits)) await auditsRestore(data.audits);
      if(Array.isArray(data.fragChecks)){ FRAGCHK = data.fragChecks.filter(c=>c && c.id && Array.isArray(c.results)); saveFragChk(); }
      if(data.prefs){ prefsSet(data.prefs); MV_RISK = lyLS('mapRisk')!=='0'; MV_LOCK = lyLS('mapLock')==='1'; MV_ZBG = lyLS('mapZbg')!=='0'; MV_SNAP = lyLS('mapSnap')!=='0'; try{ MV_HIDE = new Set(JSON.parse(lyLS('mapHide')||'[]')); }catch(e){} if(LAYERS[lyLS('mapLayer')]) MV.layer = lyLS('mapLayer'); }
      optUnify(); flash('還原完成'); showList();
    }catch(e){ say('無法讀取：這不是本工具的備份檔。'); }
  };
  fr.readAsText(file);
}

    if(drag.k==='pan'){ const dx = e.clientX-drag.cx, dy = e.clientY-drag.cy; if(Math.abs(dx)+Math.abs(dy)>4) drag.moved = true; view.scrollLeft = drag.sl-dx; view.scrollTop = drag.st-dy; return; }
    const dx = p.x-drag.s.x, dy = p.y-drag.s.y; if(Math.abs(dx)+Math.abs(dy)>0.005) drag.moved = true;
    if(drag.k==='draw'){ const d = $('#mDraw'), x = Math.min(p.x,drag.s.x), y = Math.min(p.y,drag.s.y); d.hidden = false; Object.assign(d.style,{left:x*100+'%',top:y*100+'%',width:Math.abs(dx)*100+'%',height:Math.abs(dy)*100+'%'}); }
    if(drag.k==='mva'){ const a = drag.a; a.x = clamp01(Math.min(1-a.w, drag.o.x+dx)); a.y = clamp01(Math.min(1-a.h, drag.o.y+dy)); Object.assign(drag.el.style,{left:a.x*100+'%',top:a.y*100+'%'}); }
    if(drag.k==='res'){ const a = drag.a; a.w = Math.max(0.02, Math.min(1-a.x, drag.o.w+dx)); a.h = Math.max(0.02, Math.min(1-a.y, drag.o.h+dy)); const el = inner.querySelector(`[data-aid="${a.id}"]`); Object.assign(el.style,{width:a.w*100+'%',height:a.h*100+'%'}); }

      const now = Date.now(), L = MV.lastVtx;
      if(L && L.aid===d.a.id && L.i===d.i && now-L.t<500){
        MV.lastVtx = null;

        d.a.pts.splice(d.i,1); polyBox(d.a); saveMap(); renderMap(); flash('已刪除一個角'); return;
      }
      MV.lastVtx = {aid:d.a.id, i:d.i, t:now}; return;
    }
    if(d.k==='vtx' || d.k==='mvp'){ if(d.moved || d.k==='vtx'){ polyBox(d.a); saveMap(); } MV.sel = {t:'area', id:d.a.id}; renderMap(); return; }
    if(d.k==='draw'){
      $('#mDraw').hidden = true;

      const a = {id:mapUid('ar'), mapId:MV.mapId, name, unit:'', desc:'', color:'#b8955a', x:Math.min(p.x,d.s.x), y:Math.min(p.y,d.s.y), w, h};

      addAreaOpt(name); MV.tool = ''; MV.sel = {t:'area', id:a.id}; renderMap(); flash('已新增區域：'+name);
      return;
    }
    if(d.k==='place'){
      const hit = areaAt(p);
      if(!hit){ say('位置要放在區域框裡面。請先畫好區域，再點在區域框內。'); return; }
      const n = mapAreaLocs(hit.id).length + 1;
      const t = await askText(`位置編號（放在「${hit.name}」，例：P0${n}、輸送帶）：`, `P${String(n).padStart(2,'0')}`);
      if(!t) return;
      const l = {id:mapUid('lc'), areaId:hit.id, code:t.trim(), name:'', desc:'', x:p.x, y:p.y};  /* 打的字就是位置編號；名稱可以之後在右邊補 */
      MAPD.locs.push(l); if(!saveMap()){ MAPD.locs.pop(); return; }
      MV.tool = ''; MV.sel = {t:'loc', id:l.id}; renderMap(); flash('已新增位置：'+(l.code+' '+l.name).trim());
      return;
    }
    if(d.k==='mva' || d.k==='res' || d.k==='mvl'){
      if(d.moved){
        if(d.k==='mvl'){ const hit = areaAt({x:d.l.x, y:d.l.y}); if(hit && hit.id!==d.l.areaId){ d.l.areaId = hit.id; flash('位置改到「'+hit.name+'」'); } }
        saveMap();
      }
      MV.sel = d.k==='mvl' ? {t:'loc', id:d.l.id} : {t:'area', id:d.a.id}; mapSide(); return;
    }
    if(d.k==='pan' && !d.moved){
      if(d.lEl) MV.sel = {t:'loc', id:d.lEl.dataset.lid};
      else if(d.aEl) MV.sel = {t:'area', id:d.aEl.dataset.aid};
      else MV.sel = null;
      mapSide();
    }
  };
}

/* 區域形狀：矩形（x,y,w,h）或多邊形（pts；另外保留外框 x,y,w,h 方便排序） */
function inArea(a,p){
  if(a.pts){ let c = false; for(let i=0,j=a.pts.length-1;i<a.pts.length;j=i++){ const [xi,yi]=a.pts[i], [xj,yj]=a.pts[j]; if((yi>p.y)!==(yj>p.y) && p.x < (xj-xi)*(p.y-yi)/(yj-yi)+xi) c = !c; } return c; }

}

/* 上傳／換平面圖：縮到最長邊 2400px 存進照片資料庫 */
function mapUpload(input, mid){
  const f = input.files[0]; input.value = ''; if(!f) return;
  if(!/^image\/(jpeg|png)$/.test(f.type)){ say('平面圖請用 JPG 或 PNG 圖檔。'); return; }
  if(f.size > 25*1024*1024){ say('圖片太大（超過 25MB），請先縮小後再上傳。'); return; }
  const fr = new FileReader();
  fr.onerror = () => say('圖片讀取失敗，請換一張再試。');
  fr.onload = () => { const img = new Image();
    img.onerror = () => say('圖片讀取失敗，請換一張再試。');
    img.onload = async () => {
      const s = Math.min(1, 2400/Math.max(img.width,img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
      const url = c.toDataURL('image/jpeg',0.85);
      if(mid){ const m = MAPD.maps.find(x=>x.id===mid);
        if(!(await ask('換圖片後，原本畫的區域和位置會保留在相同比例的位置上；如果新圖的範圍或比例不同，請再檢查區域是否對齊。確定要換嗎？'))) return;
        const id = phNewId(); try{ await phPut(id, url); }catch(e){ say('平面圖存不進去，瀏覽器的儲存空間可能已滿。'); return; }
        m.img = id; m.w = c.width; m.h = c.height; saveMap(); renderMap(); flash('已換圖片'); return; }
      const name = await askText('地圖名稱（例：一樓、二樓、A 廠）：', '一樓'); if(!name) return;
      const id = phNewId(); try{ await phPut(id, url); }catch(e){ say('平面圖存不進去，瀏覽器的儲存空間可能已滿。'); return; }
      const m = {id:mapUid('mp'), name, img:id, w:c.width, h:c.height};
      MAPD.maps.push(m); if(!saveMap()){ MAPD.maps.pop(); return; }
      MV.mapId = m.id; MV.mode = 'edit'; MV.tool = 'area'; MV.zoom = 1; MV.sel = null; renderMap(); flash('已新增地圖，接著在平面圖上拖曳畫出第一個區域');
    };
    img.src = fr.result; };
  fr.readAsDataURL(f);
}

/* 照片：壓縮後放照片資料庫 */
function auditPhotos(i, input){
  const files = [...input.files].filter(f=>/^image\//.test(f.type)); input.value = '';
  files.forEach(file => { const fr = new FileReader(); fr.onload = () => { const img = new Image(); img.onload = async () => {
    const s = Math.min(1, 900/Math.max(img.width,img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width*s); c.height = Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const id = phNewId(); try{ await phPut(id, c.toDataURL('image/jpeg',0.6)); }catch(e){ say('照片存不進去，瀏覽器的儲存空間可能已滿。'); return; }
    AUD.results[i].photos.push(id); dirty = true; $('#ar'+i).outerHTML = auditRowHTML(AUD.results[i], i, false); hydrate($('#ar'+i));
  }; img.src = fr.result; }; fr.readAsDataURL(file); });
}
async function auditSave(){

async function auditsRestore(list){

/* ---------- 廠區地圖（第三期）：風險顏色、重複缺失、地圖統計、參考照片 ---------- */
/* 重複缺失：同一位置（沒有位置就看同一區域）＋同一缺失類別，之前已經發生過，或勾了「已通知改善後再次發生」 */
function areaIdOf(r){ return areaById(r.areaId) ? r.areaId : (areaByName(r.area)||{}).id || ''; }
function repeatSet(){
  const g = new Map(), out = new Set();
  live().filter(r=>r.defType).sort((a,b)=>(a.foundDate||'').localeCompare(b.foundDate||'') || a.id.localeCompare(b.id)).forEach(r=>{
    const k = (r.locId && locById(r.locId) ? 'L'+r.locId : 'A'+(areaIdOf(r) || (r.area||'').trim())) + '|' + r.defType;
    if(g.has(k)) out.add(r.id); else g.set(k, r.id);
  });
  live().forEach(r=>{ if(r.recurred) out.add(r.id); });
  return out;
}
/* 連續發生警示：同一位置（沒有位置就看同一區域）＋同一缺失類別，連續 3 個月以上每個月都有發生，而且最後一個月是本月或上個月 */
function monthIdx(d){ return (+d.slice(0,4))*12 + (+d.slice(5,7)) - 1; }
function monthTxt(m){ return (m%12+1)+' 月'; }
function streakAlerts(){
  const g = new Map();
  live().filter(r=>r.defType && r.foundDate).forEach(r=>{

function lyZoneAlpha(){ const v = +MAPD.zoneAlpha; return v>=0.1 && v<=0.95 ? v : 0.55; }
function lyAlpha(v, save){ const a = Math.max(0.1, Math.min(0.95, (+v||55)/100)); const i = $('#mapInner'); if(i) i.style.setProperty('--za', a); const t = $('#lyAlphaV'); if(t) t.textContent = Math.round(a*100)+'%';
  if(save){ MAPD.zoneAlpha = a; saveMap(); } }
/* 文字在顏色上（相乘疊色）：存在地圖設定，預設開 */
function lyZoneMul(){ return MAPD.zoneMul !== false; }
function lyZoneMulToggle(){ MAPD.zoneMul = !lyZoneMul(); saveMap(); renderMap(); flash(lyZoneMul() ? '🔤 分區顏色墊在文字下面' : '分區顏色改成半透明蓋在上面'); }
function lyZbgToggle(){ MV_ZBG = !MV_ZBG; lyLS('mapZbg', MV_ZBG?'1':'0'); renderMap(); }
function lyToggle(k){ MV_HIDE.has(k) ? MV_HIDE.delete(k) : MV_HIDE.add(k); lyLS('mapHide', JSON.stringify([...MV_HIDE])); renderMap(); }
const LY_ARR = { zone:'zones', flow:'flows', mark:'marks', frag:'frags', pest:'pests' };
function lyList(t, mid){ return (MAPD[LY_ARR[t]]||[]).filter(o=>o.mapId===(mid||MV.mapId)); }
function lyGet(t, id){ return (MAPD[LY_ARR[t]]||[]).find(o=>o.id===id); }
function lyCur(){ return MV.sel && LY_ARR[MV.sel.t] ? lyGet(MV.sel.t, MV.sel.id) : null; }
function lyMap(){ return MAPD.maps.find(x=>x.id===MV.mapId); }
const lyVH = m => 1000*((m&&m.h)||1)/((m&&m.w)||1);
const lyBox = pts => { const xs = pts.map(q=>q[0]), ys = pts.map(q=>q[1]); return {x:Math.min(...xs), y:Math.min(...ys), w:Math.max(...xs)-Math.min(...xs), h:Math.max(...ys)-Math.min(...ys)}; };
/* 分區名稱放在最上面、最左邊的角（L 型也不會跑到形狀外面） */
const lyLabPt = pts => { const q = pts.slice().sort((a,b)=>(a[1]-b[1]) || (a[0]-b[0]))[0]; return {x:q[0], y:q[1]}; };
const fragLabel = f => (f.code+' '+(f.name||'')).trim();

/* ---- 易碎品：檢查頻率與狀態 ---- */
const KEY_FC = 'qaHygieneTracker_v1_fragChecks';
let FRAGCHK = []; try{ const a = JSON.parse(localStorage.getItem(KEY_FC)||'[]'); if(Array.isArray(a)) FRAGCHK = a; }catch(e){}
function saveFragChk(){ try{ localStorage.setItem(KEY_FC, JSON.stringify(FRAGCHK)); return true; }catch(e){ say('易碎品檢查紀錄存不進去，瀏覽器的儲存空間可能已滿。'); return false; } }
function fragDefMonths(){ const n = +((MAPD.fragCfg||{}).months); return n>=1 && n<=24 ? n : 1; }
function fragMonths(f){ const n = +f.months; return n>=1 && n<=24 ? n : fragDefMonths(); }
function addMonths(ymd, n){ const [y,m,d] = ymd.split('-').map(Number); const last = new Date(y, m-1+n+1, 0).getDate(), t = new Date(y, m-1+n, Math.min(d,last)); return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); }
function fragChecksSorted(){ return FRAGCHK.slice().sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt)); }
function fragHistory(f){ const out = []; fragChecksSorted().forEach(c => { const r = c.results.find(x=>x.fid===f.id && x.res); if(r) out.push({date:c.date, by:c.inspector, res:r.res, note:r.note, cid:c.id}); }); return out; }
function fragState(f){
  const L = fragHistory(f).find(h=>h.res!=='na') || null, t = today();
  if(!L) return {k:'due', t:'尚未檢查', last:null, next:''};
  const next = addMonths(L.date, fragMonths(f));
  if(L.res==='broken' || L.res==='missing') return {k:'bad', t:'上次檢查：'+FR[L.res].t, last:L, next};
  if(t>next) return {k:'due', t:'逾期未檢查', last:L, next};
  if(daysBetween(t, next)<=7) return {k:'soon', t:'即將到期', last:L, next};
  return {k:'ok', t:'正常', last:L, next};
}
function fragNextCode(){ const n = Math.max(0, ...(MAPD.frags||[]).map(f=>parseInt(String(f.code||'').replace(/\D/g,''),10)||0)) + 1; return 'G'+String(n).padStart(2,'0'); }
function zoneAt(p, mid){ return lyList('zone', mid).filter(z=>inArea(z,p)).sort((a,b)=>{ const x = lyBox(a.pts), y = lyBox(b.pts); return x.w*x.h-y.w*y.h; })[0]; }
function areaAtMap(p, mid){ return mapAreas(mid).filter(a=>inArea(a,p)).sort((x,y)=>x.w*x.h-y.w*y.h)[0]; }

  return '';
